[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neverd-plugin"
version = "3389.0.1"
description = "Official Python authoring SDK for NeverD plugins"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "NeverD contributors" }]
keywords = ["decompiler", "plugin", "reverse-engineering", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/NeverSight/NeverD"
Documentation = "https://github.com/NeverSight/NeverD/blob/dev/docs/python-plugins.md"
Issues = "https://github.com/NeverSight/NeverD/issues"

[tool.setuptools]
packages = ["neverd_plugin"]
include-package-data = true

[tool.setuptools.package-data]
neverd_plugin = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
