name: Preserve live Intel HVF recovery evidence
description: Observe the original single-process recovery loop without pausing between iterations
inputs:
  source:
    description: Separate clean checkout of the exact tested commit
    required: true
  build:
    description: Native Intel Release build within that checkout
    required: true
  evidence:
    description: New diagnostic evidence directory
    required: true
  upload-action:
    description: Separate checkout of the pinned official upload-artifact action
    required: true
  upload-runtime:
    description: default or js-interpreter (WebAssembly retained) for controller plan/progress upload children only
    default: default
  repetitions:
    description: Original one-process repetition count, 100 or 1000
    default: '1000'
  experiment:
    description: Explicit recovery or isolated lifecycle, instruction, instruction-reuse, instruction-vcpu-recreate, instruction-vm-recreate, instruction-owner-recreate, owner-failure-controls, recovery-reuse, recovery-vcpu-recreate, recovery-vm-recreate, recovery-vm-no-host-kick or finite-deadline mode
    default: recovery
runs:
  using: node24
  main: run.cjs
