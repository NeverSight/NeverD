name: EVM Upstream Audit

on:
  push:
    branches:
      - dev
  pull_request:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evm-upstream-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opcode-metadata:
    name: Audit latest go-ethereum opcodes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test the upstream audit
        run: python -m unittest -v scripts.tests.test_audit_evm_opcode_metadata

      - name: Fetch and audit current go-ethereum HEAD
        run: python scripts/audit_evm_opcode_metadata.py
