name: Temporary macOS restore diagnostic

on:
  push:
    branches: [codex/nov03-gui-ci-followup]
    paths:
      - '.github/workflows/gui-restore-diagnostic.yml'
      - 'tools/neverd-gui/tests/DockingTests.cpp'

permissions:
  contents: read

concurrency:
  group: gui-restore-diagnostic
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the affected Qt version
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt"
      - name: Build the fixture and docking owner
        run: |
          cmake -S tools/neverd-gui/tests/mock-sdk -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release
          python scripts/build.py build-fixture --parallel 3
          cmake -S tools/neverd-gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/macos" \
            -DNEVERD_ENGINE_LIBRARY="$GITHUB_WORKSPACE/build-fixture/bin/libneverd_fixture.dylib" \
            -DNEVERD_WORKER_REAL_ENGINE_TESTS=OFF
          python scripts/build.py build-gui --target neverd-gui-docking-tests --parallel 3
      - name: Repeat the native restore sequence
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          output = Path('restore-evidence')
          output.mkdir()
          records = []
          for attempt in range(12):
              path = output / f'round-{attempt + 1:02}.txt'
              command = ['build-gui/bin/neverd-gui-docking-tests',
                         'quickStartChoosesWorkbenchSize', 'workbenchReopensWindowed',
                         '-o', str(path) + ',txt']
              record = {'attempt': attempt + 1, 'command': command}
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=90)
                  record['returncode'] = result.returncode
                  (output / f'round-{attempt + 1:02}-stderr.txt').write_text(result.stderr)
                  log = path.read_text() if path.exists() else ''
                  totals = re.search(r'Totals: (\d+) passed, (\d+) failed, (\d+) skipped', log)
                  record['totals'] = list(map(int, totals.groups())) if totals else None
                  record['complete'] = result.returncode == 0 and record['totals'] == [12, 0, 0]
                  for line in log.splitlines():
                      if any(word in line for word in ('FAIL!', 'Totals:', 'restore fixture', 'restore click')):
                          print(line)
              except subprocess.TimeoutExpired:
                  record['complete'] = False
                  record['timeout'] = True
              records.append(record)
              (output / 'summary.json').write_text(json.dumps(records, indent=2))
          raise SystemExit(0 if all(record['complete'] for record in records) else 1)
          PY
      - name: Retain bounded reproduction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-restore-${{ github.sha }}
          path: |
            restore-evidence/
            build-gui/CMakeCache.txt
          retention-days: 7
