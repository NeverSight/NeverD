name: Capstone fork contract

# The decoder's own suite exercises the pinned fork, so its result can only
# change with the pin. Native pipeline still runs NeverD's contracts against
# every Capstone update.
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/capstone-contract.yml'
      - 'third_party/capstone'
  pull_request:
    paths:
      - '.github/workflows/capstone-contract.yml'
      - 'third_party/capstone'

permissions:
  contents: read

concurrency:
  group: capstone-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS arm64
            runner: macos-15
            cc: clang
            cxx: clang++
          - name: Windows x64 MSVC
            runner: windows-2025-vs2026
            cc: cl
            cxx: cl
          - name: Windows x64 clang-cl
            runner: windows-2025-vs2026
            cc: clang-cl
            cxx: clang-cl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize the pinned decoder
        run: git submodule update --init --depth 1 third_party/capstone
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja lld
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify the decoder's public contracts and buffer bounds
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sanitize=ON
          if [ "$RUNNER_OS" = Windows ]; then sanitize=OFF; fi
          cmake -S third_party/capstone -B build-capstone-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON \
            -DCAPSTONE_ARM_SUPPORT=ON -DCAPSTONE_AARCH64_SUPPORT=ON \
            -DCAPSTONE_BUILD_CSTEST=ON -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_LEGACY_TESTS=OFF -DCAPSTONE_BUILD_MACOS_THIN=ON \
            -DENABLE_ASAN="$sanitize"
          python - <<'PY'
          from collections import Counter
          import json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          build = Path('build-capstone-core')
          command = ['ctest', '--test-dir', str(build), '-R', '^unit_']
          inventory = json.loads(subprocess.check_output(command + ['--show-only=json-v1'], text=True))
          names = [test['name'] for test in inventory['tests']]
          assert len(names) >= 83 and len(names) == len(set(names))
          assert {'unit_mcinst', 'unit_x86_buffer_bounds', 'unit_x86_far_immediate_encoding'} <= set(names)
          # CTest also registers Python tests, whose names are not build targets.
          # Build the configured decoder suite, then audit every discovered test.
          subprocess.run(['cmake', '--build', str(build), '--parallel', '3'], check=True)
          subprocess.run(command + ['--no-tests=error', '--output-on-failure', '--output-junit', 'results.xml'], check=True)
          cases = list(ET.parse(build / 'results.xml').getroot().iter('testcase'))
          assert Counter(case.get('name') for case in cases) == Counter(names)
          # This one native fault oracle requires x86-64 POSIX (see Capstone's
          # tests/unit/x86_x87_environment_hardware.c). Keep it required on
          # native x64 POSIX, and never count its explicit absence as a pass.
          unavailable_x87_host = (os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']) in {
              ('macOS', 'ARM64'), ('Linux', 'ARM64'), ('Windows', 'X64'), ('Windows', 'ARM64')}
          skipped = 0
          for case in cases:
              assert not any(child.tag in {'failure', 'error'} for child in case)
              missing = case.find('skipped')
              if missing is None:
                  assert case.get('status') == 'run'
                  continue
              assert unavailable_x87_host and case.get('name') == 'unit_x86_x87_environment_hardware'
              assert case.get('status') == 'notrun' and missing.get('message') == 'SKIP_RETURN_CODE=77'
              assert case.findtext('system-out', '').strip() == 'SKIP: x87 execution requires an x86-64 POSIX host'
              skipped += 1
          (build / 'source.txt').write_text(subprocess.check_output(['git', '-C', 'third_party/capstone', 'rev-parse', 'HEAD'], text=True))
          print(f'Capstone: {len(cases) - skipped} passed, zero failed, {skipped} explicitly unavailable native-x87 tests')
          subprocess.run(['ctest', '--test-dir', str(build), '-R', '^integration_py_cstest$',
                          '--no-tests=error', '--output-on-failure',
                          '--output-junit', 'cstest-integration.xml'], check=True)
          traversal = list(ET.parse(build / 'cstest-integration.xml').getroot().iter('testcase'))
          assert len(traversal) == 1 and traversal[0].get('name') == 'integration_py_cstest'
          assert traversal[0].get('status') == 'run' and not any(
              child.tag in {'failure', 'error', 'skipped'} for child in traversal[0])
          decoder = build / 'suite/cstest' / ('cstest.exe' if os.name == 'nt' else 'cstest')
          details = subprocess.run([str(decoder), 'third_party/capstone/tests/details/arm.yaml',
                                    'third_party/capstone/tests/details/aarch64.yaml'],
                                   stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                                   encoding='utf-8', errors='replace', timeout=180)
          (build / 'arm-details.log').write_text(details.stdout, encoding='utf-8')
          counts = {key: int(value) for key, value in re.findall(
              r'^\s*(Valid files|Invalid files|Errors|Total|Successful|Skipped|Failed):\s*(\d+)\s*$',
              details.stdout, re.M)}
          (build / 'arm-details.json').write_text(json.dumps(counts, indent=2) + '\n')
          assert details.returncode == 0, details.stdout
          assert counts['Valid files'] == 2 and counts['Total'] >= 2, counts
          assert counts['Successful'] == counts['Total'], counts
          assert all(counts[key] == 0 for key in ('Invalid files', 'Errors', 'Skipped', 'Failed')), counts
          print(f"ARM/ARM64 details: {counts['Successful']} passed, zero failed, zero skipped")
          PY
      - name: Retain decoder results and configuration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capstone-contract-${{ matrix.name }}-${{ github.sha }}
          path: |
            build-capstone-core/CMakeCache.txt
            build-capstone-core/source.txt
            build-capstone-core/results.xml
            build-capstone-core/cstest-integration.xml
            build-capstone-core/arm-details.log
            build-capstone-core/arm-details.json
            build-capstone-core/Testing/Temporary/LastTest.log
          if-no-files-found: warn
