name: Prebuilt LLVM Audit

on:
  push:
    branches:
      - dev
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prebuilt-llvm-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  published-assets:
    name: Verify published packages match source pins
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test the release audit
        run: python -m unittest -v scripts.tests.test_audit_prebuilt_llvm_release

      - name: Compare published packages with source pins
        run: python scripts/audit_prebuilt_llvm_release.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
