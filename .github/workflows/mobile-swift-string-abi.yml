name: Mobile Swift String ABI Evidence

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Fixed Swift boolean import to inspect
        type: choice
        default: comparison
        options:
          - comparison
          - prefix
          - object-equality

permissions:
  contents: read

jobs:
  evidence:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      CONSUMER_COMMIT: ${{ github.sha }}
      SWIFT_STRING_PROBE: ${{ inputs.probe || 'comparison' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify compiler evidence retention
        run: python -m unittest scripts.tests.test_mobile_swift_string_abi
      - name: Compile fixed Swift and C probes for both SDKs
        run: |
          test -d "$DEVELOPER_DIR"
          python scripts/collect_mobile_swift_string_abi.py \
            --probe "$SWIFT_STRING_PROBE" \
            --output "$RUNNER_TEMP/mobile-swift-string-abi"
      - name: Preserve compiler and SDK evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-swift-string-abi
          path: ${{ runner.temp }}/mobile-swift-string-abi
          if-no-files-found: error
          retention-days: 7
