name: Cancel Closed Pull Request Runs

# The PR workflows cancel their own runs on close through their concurrency
# groups, which needs no runner. This job has to wait for a runner, so it only
# catches what those groups cannot: default-setup CodeQL runs and any workflow
# without the closed trigger. pull_request_target gives fork PRs the same write
# token; this workflow never checks out or executes pull-request code.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cancel:
    name: Cancel the closed pull request's runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      # Branch names are untrusted input; they only reach gh through env.
      - name: Cancel queued and running pull-request runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SELF_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # A reopened PR has live runs again; leave them alone.
          state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .state)
          if [ "$state" != closed ]; then
            echo "PR #$PR_NUMBER is $state again; nothing to cancel."
            exit 0
          fi
          # Workflow runs are keyed by the head branch; default-setup CodeQL
          # runs are keyed by the pull ref.
          ids=$(
            gh api --paginate -X GET "repos/$GH_REPO/actions/runs" \
              -f branch="$HEAD_REF" -f event=pull_request -f per_page=100 \
              --jq '.workflow_runs[] | select(.status != "completed"
                and .head_repository.full_name == env.HEAD_REPO) | .id'
            gh api --paginate -X GET "repos/$GH_REPO/actions/runs" \
              -f branch="refs/pull/$PR_NUMBER/head" -f per_page=100 \
              --jq '.workflow_runs[] | select(.status != "completed") | .id'
          )
          failed=0
          for id in $ids; do
            [ "$id" = "$SELF_RUN_ID" ] && continue
            if gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" --silent; then
              echo "Cancelled run $id"
            elif [ "$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .status)" = completed ]; then
              echo "Run $id completed before it could be cancelled"
            else
              echo "::error::Could not cancel run $id"
              failed=1
            fi
          done
          exit "$failed"
