name: Debug macOS call ABI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce AArch64 Mach-O call ABI
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify native environment
        shell: bash
        run: |
          sw_vers
          uname -m
          cmake --version
          ninja --version
          clang --version
          ld.lld --version

      - name: Configure focused Release build
        shell: bash
        run: |
          PYTHON_EXECUTABLE="$(python3 -c 'import sys; print(sys.executable)')"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DNEVERD_LLVM_PREBUILT=OFF

      - name: Build owning test binary
        shell: bash
        run: >-
          cmake --build build-ci --config Release
          --target NeverDLiftTests --parallel 3

      - name: Run exact call-ABI tests
        id: call_abi_tests
        continue-on-error: true
        shell: bash
        env:
          NEVERD_THREADS: '1'
        run: |
          set -o pipefail
          build-ci/bin/NeverDLiftTests \
            --gtest_filter='AArch64_CallAbi.*' 2>&1 | tee macos-call-abi.log

      - name: Package native reproducer
        if: always()
        shell: bash
        run: |
          tar -czf macos-call-abi-reproducer.tar.gz \
            -C build-ci \
            bin/NeverDLiftTests \
            bin/neverd \
            bin/libneverd.dylib \
            unittests/lift/test_call_abi_a64_macho \
            unittests/lift/libtest_call_abi_a64_macho.dylib
          shasum -a 256 macos-call-abi-reproducer.tar.gz \
            > macos-call-abi-reproducer.tar.gz.sha256

      - name: Upload reproducer and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-call-abi-reproducer-${{ github.sha }}
          path: |
            macos-call-abi-reproducer.tar.gz
            macos-call-abi-reproducer.tar.gz.sha256
            macos-call-abi.log
            build-ci/Testing/Temporary/*.log
          if-no-files-found: warn
          retention-days: 3

      - name: Report reproducer result
        if: steps.call_abi_tests.outcome == 'failure'
        shell: bash
        run: exit 1
