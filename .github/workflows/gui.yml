name: Desktop GUI

on:
  push:
    branches: [dev]
    paths: ['tools/neverd-gui/**', 'tools/neverd-worker/**', 'tools/neverd-mcp/**', 'scripts/check_gui_i18n.py', '.github/workflows/gui.yml']
  pull_request:
    paths: ['tools/neverd-gui/**', 'tools/neverd-worker/**', 'tools/neverd-mcp/**', 'scripts/check_gui_i18n.py', '.github/workflows/gui.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Qt Quick (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, host: linux, arch: linux_gcc_64, qt_dir: gcc_64, library: libneverd_fixture.so}
          - {runner: macos-15, host: mac, arch: clang_64, qt_dir: macos, library: libneverd_fixture.dylib}
          - {runner: windows-latest, host: windows, arch: win64_msvc2022_64, qt_dir: msvc2022_64, library: neverd_fixture.dll}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Qt and build tools
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt '${{ matrix.host }}' desktop 6.8.3 '${{ matrix.arch }}' -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}/bin" >> "$GITHUB_PATH"
          if [ '${{ runner.os }}' = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
          fi
      - name: Build test-only C ABI fixture
        shell: bash
        run: |
          cmake -S tools/neverd-gui/tests/mock-sdk -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fixture --parallel 3
      - name: Build workbench with fixture SDK
        shell: bash
        run: |
          cmake -S tools/neverd-gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}" \
            -DNEVERD_ENGINE_LIBRARY="$GITHUB_WORKSPACE/build-fixture/bin/${{ matrix.library }}" \
            -DNEVERD_ENGINE_IMPLIB="$GITHUB_WORKSPACE/build-fixture/bin/neverd_fixture.lib" \
            -DNEVERD_WORKER_REAL_ENGINE_TESTS=OFF
          cmake --build build-gui --parallel 3
          cp "build-fixture/bin/${{ matrix.library }}" build-gui/bin/
      - name: Verify GUI, IPC, MCP and translation contracts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/check_gui_i18n.py
          ctest --test-dir build-gui --output-on-failure
      # These binaries use a deterministic fixture, not the NeverD engine.
      # Intentionally do not upload or publish them as product artifacts.
