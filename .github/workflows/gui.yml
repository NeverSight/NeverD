name: Desktop GUI

on:
  push:
    branches: [dev]
    paths: ['tools/neverd-gui/**', 'tools/neverd-worker/**', 'tools/neverd-mcp/**', 'scripts/check_gui_i18n.py', '.github/workflows/gui.yml']
  pull_request:
    paths: ['tools/neverd-gui/**', 'tools/neverd-worker/**', 'tools/neverd-mcp/**', 'scripts/check_gui_i18n.py', '.github/workflows/gui.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Qt Quick (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, host: linux, arch: linux_gcc_64, qt_dir: gcc_64, library: libneverd_fixture.so}
          - {runner: macos-15, host: mac, arch: clang_64, qt_dir: macos, library: libneverd_fixture.dylib}
          - {runner: windows-latest, host: windows, arch: win64_msvc2022_64, qt_dir: msvc2022_64, library: neverd_fixture.dll}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Qt and build tools
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt '${{ matrix.host }}' desktop 6.8.3 '${{ matrix.arch }}' -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}/bin" >> "$GITHUB_PATH"
          if [ '${{ runner.os }}' = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0
          fi
      - name: Build test-only C ABI fixture
        shell: bash
        run: |
          cmake -S tools/neverd-gui/tests/mock-sdk -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-fixture --parallel 3
      - name: Build workbench with fixture SDK
        shell: bash
        run: |
          cmake -S tools/neverd-gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/${{ matrix.qt_dir }}" \
            -DNEVERD_ENGINE_LIBRARY="$GITHUB_WORKSPACE/build-fixture/bin/${{ matrix.library }}" \
            -DNEVERD_ENGINE_IMPLIB="$GITHUB_WORKSPACE/build-fixture/bin/neverd_fixture.lib" \
            -DNEVERD_GUI_CI_DIAGNOSTICS=${{ runner.os == 'Windows' && 'ON' || 'OFF' }} \
            -DNEVERD_WORKER_REAL_ENGINE_TESTS=OFF
          cmake --build build-gui --parallel 3
          cp "build-fixture/bin/${{ matrix.library }}" build-gui/bin/
      - name: Verify GUI, IPC, MCP and translation contracts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/check_gui_i18n.py
          if [ '${{ runner.os }}' = Windows ]; then
            mkdir -p build-gui/ci-diagnostics
            set +e
            ctest --test-dir build-gui --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build-gui/ci-diagnostics/ctest.xml" \
              > build-gui/ci-diagnostics/ctest.log 2>&1
            ctest_status=$?
            set -e
            printf '%s\n' "$ctest_status" > build-gui/ci-diagnostics/ctest-exit-code.txt || true
            cat build-gui/ci-diagnostics/ctest.log || true
            exit "$ctest_status"
          fi
          ctest --test-dir build-gui --output-on-failure
      - name: Retain Windows GUI contract diagnostics
        id: gui_diagnostics
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          build = Path("build-gui").resolve()
          output = Path("build-gui-ci-diagnostics")
          output.mkdir(exist_ok=False)
          limit = 4 * 1024 * 1024
          files = {
              "pane-navigation.txt": "ci-diagnostics/pane-navigation.txt",
              "pane-navigation.xml": "ci-diagnostics/pane-navigation.xml",
              "controller.txt": "ci-diagnostics/controller.txt",
              "controller.xml": "ci-diagnostics/controller.xml",
              "ctest.xml": "ci-diagnostics/ctest.xml",
              "ctest.log": "ci-diagnostics/ctest.log",
              "ctest-exit-code.txt": "ci-diagnostics/ctest-exit-code.txt",
              "LastTest.log": "Testing/Temporary/LastTest.log",
              "LastTestsFailed.log": "Testing/Temporary/LastTestsFailed.log",
          }
          records = []
          for name, relative in files.items():
              source = build / relative
              record = {"name": name, "source": relative}
              try:
                  if not source.exists():
                      record["status"] = "missing"
                  elif (source.is_symlink() or not source.is_file()
                        or not source.resolve().is_relative_to(build)):
                      record["status"] = "rejected_path"
                  else:
                      size = source.stat().st_size
                      with source.open("rb") as stream:
                          data = stream.read(limit + 1)
                      captured = data[:limit]
                      (output / name).write_bytes(captured)
                      record.update({
                          "status": "truncated" if len(data) > limit else "copied",
                          "source_bytes": size,
                          "captured_bytes": len(captured),
                          "captured_sha256": hashlib.sha256(captured).hexdigest(),
                      })
              except OSError as error:
                  record.update({"status": "io_error", "error": str(error)[:1024]})
              records.append(record)
          complete = all(record["status"] == "copied" or
                         (record["name"] == "LastTestsFailed.log" and
                          record["status"] == "missing") for record in records)
          manifest = {
              "schema": "neverd-gui-ci-diagnostics-v1",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "collection_complete": complete,
              "test_success": "read original CTest exit and child results",
              "per_file_bytes_cap": limit,
              "payload_bytes_cap": len(files) * limit,
              "manifest_bytes_cap": 64 * 1024,
              "files": records,
          }
          encoded = (json.dumps(manifest, indent=2) + "\n").encode("utf-8")
          if len(encoded) > 64 * 1024:
              raise RuntimeError("GUI diagnostic manifest exceeds its fixed cap")
          (output / "manifest.json").write_bytes(encoded)
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write("ready=true\n")
          if not complete:
              print("Incomplete GUI diagnostics; inspect the retained manifest.", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Upload Windows GUI contract diagnostics
        if: ${{ always() && runner.os == 'Windows' && steps.gui_diagnostics.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-gui-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-gui-ci-diagnostics/
          if-no-files-found: error
          retention-days: 7
      # These binaries use a deterministic fixture, not the NeverD engine.
      # Intentionally do not upload or publish them as product artifacts.
