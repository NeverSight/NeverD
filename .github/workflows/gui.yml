name: Temporary macOS native event loop diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-drag:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install matching Qt and build tools
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt mac desktop 6.8.3 clang_64 -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.3/macos/bin" >> "$GITHUB_PATH"
      - name: Build only the docking boundary
        run: |
          cmake -S tools/neverd-gui/tests/mock-sdk -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release
          python scripts/build.py build-fixture --parallel 3
          cmake -S tools/neverd-gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/macos" \
            -DNEVERD_ENGINE_LIBRARY="$GITHUB_WORKSPACE/build-fixture/bin/libneverd_fixture.dylib" \
            -DNEVERD_GUI_CI_DIAGNOSTICS=ON \
            -DNEVERD_WORKER_REAL_ENGINE_TESTS=OFF
          python scripts/build.py build-gui --parallel 3 --target neverd-gui-docking-tests
          cp build-fixture/bin/libneverd_fixture.dylib build-gui/bin/
      - name: Compare manual polling with the native event loop at unchanged gesture timing
        run: |
          python - <<'PY'
          import json, os, platform, subprocess, time
          from pathlib import Path
          out = Path('build-gui/ci-diagnostics/drag-trace')
          out.mkdir(parents=True, exist_ok=True)
          binary = 'build-gui/bin/neverd-gui-docking-tests'
          cases = {
              'caption': ['lockedDragsStayFloating:caption'],
              'preceding': ['floatingCaption', 'doubleClickDetachStartsLocked',
                            'explicitDockIgnoresLock', 'lockedDragsStayFloating'],
              'full': [],
          }
          report = {'platform': platform.platform(), 'runs': []}
          for command in [['sw_vers'], ['clang', '--version'], ['cmake', '--version'], ['git', 'rev-parse', 'HEAD']]:
              report[' '.join(command)] = subprocess.check_output(command, text=True)
          for kind, repeats in [('caption', 16), ('preceding', 8), ('full', 2)]:
              for repeat in range(repeats):
                  # Alternate order so an environment trend cannot favor one gesture.
                  for mode in (['poll', 'exec'] if repeat % 2 == 0 else ['exec', 'poll']):
                      name = f'{kind}-{repeat:02d}-{mode}'
                      env = {**os.environ, 'NEVERD_TRACE_NATIVE_DRAG': '1'}
                      if mode == 'exec':
                          env['NEVERD_TRACE_NATIVE_EVENT_LOOP'] = '1'
                      start = time.monotonic()
                      with (out / (name + '.log')).open('w') as log:
                          try:
                              result = subprocess.run([binary, *cases[kind]], env=env,
                                                      stdout=log, stderr=subprocess.STDOUT,
                                                      timeout=210, check=False)
                              code = result.returncode
                          except subprocess.TimeoutExpired:
                              code = 'timeout'
                      text = (out / (name + '.log')).read_text()
                      item = {'name': name, 'exit': code, 'seconds': time.monotonic() - start,
                              'totals': [line for line in text.splitlines() if line.startswith('Totals:')],
                              'failures': [line for line in text.splitlines() if line.startswith(('FAIL!', 'SKIP'))]}
                      report['runs'].append(item)
                      (out / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
                      print(json.dumps(item), flush=True)
          assert len(report['runs']) == 52
          candidate = [r for r in report['runs'] if r['name'].endswith('-exec')]
          control = [r for r in report['runs'] if r['name'].startswith('caption-') and r['name'].endswith('-poll')]
          expected = {'caption': '3 passed, 0 failed, 0 skipped',
                      'preceding': '8 passed, 0 failed, 0 skipped',
                      'full': '73 passed, 0 failed, 1 skipped'}
          report['controlReproduced'] = any(r['exit'] != 0 for r in control)
          report['candidatePassed'] = all(r['exit'] == 0 and len(r['totals']) == 1 and expected[r['name'].split('-')[0]] in r['totals'][0] for r in candidate)
          (out / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          if not report['controlReproduced'] or not report['candidatePassed']:
              raise SystemExit(1)
          PY
      - name: Preserve bounded native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-event-loop-diagnosis-${{ github.run_id }}
          path: |
            build-gui/ci-diagnostics/drag-trace/
            build-gui/neverd-build-receipt.json
            build-gui/CMakeCache.txt
          retention-days: 7
          if-no-files-found: warn
