name: Debug AArch64 exclusive global roundtrip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Linux x64 focused reproducer
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Configure focused Release build
        shell: bash
        run: |
          python_executable="$(python3 -c 'import sys; print(sys.executable)')"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DPython3_EXECUTABLE="$python_executable" \
            -DNEVERD_LLVM_PREBUILT=OFF

      - name: Build semantic test binary
        shell: bash
        run: cmake --build build-ci --config Release --target NeverDSemanticTests --parallel 4

      - name: Run focused reproducer
        id: repro
        shell: bash
        run: |
          mkdir -p a64-exclusive-artifact
          cp build-ci/bin/NeverDSemanticTests a64-exclusive-artifact/
          clang --version > a64-exclusive-artifact/clang-version.txt
          cmake --version > a64-exclusive-artifact/cmake-version.txt
          ldd build-ci/bin/NeverDSemanticTests > a64-exclusive-artifact/ldd.txt
          sha256sum build-ci/bin/NeverDSemanticTests > a64-exclusive-artifact/sha256.txt
          set +e
          build-ci/bin/NeverDSemanticTests \
            --gtest_filter='OptStress207/A64OptStress207RT.Verify/*' \
            --gtest_repeat=3 2>&1 | tee a64-exclusive-artifact/test.log
          status="${PIPESTATUS[0]}"
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Package reproducer
        if: always() && steps.repro.outputs.status != ''
        shell: bash
        run: tar -C a64-exclusive-artifact -czf a64-exclusive-linux-x64.tar.gz .

      - name: Upload reproducer
        if: always() && steps.repro.outputs.status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a64-exclusive-linux-x64
          path: a64-exclusive-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Propagate focused test result
        if: always() && steps.repro.outputs.status != ''
        shell: bash
        run: exit "${{ steps.repro.outputs.status }}"
