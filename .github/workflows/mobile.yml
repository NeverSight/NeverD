name: Mobile Decompilation

# These self-owned regression suites run entirely in Actions. The separate
# real-application workflow supplies the stricter release qualification gate.
# Core loader/IR/backend changes also affect mobile recovery, so do not filter
# this workflow to mobile frontend paths.
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: C++ mobile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
            executable: neverd
          - os: macos-15
            cc: clang
            cxx: clang++
            executable: neverd
          - os: windows-2025
            cc: cl
            cxx: cl
            executable: neverd.exe
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Python for build scripts and independent test oracles
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build zlib1g-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja --yes --no-progress
      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Configure native mobile without the optional Python plugin host
        shell: bash
        run: |
          cmake -S . -B build-mobile -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DBUILD_TESTING=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build the actual C++ CLI and mobile tests
        id: build_mobile
        run: cmake --build build-mobile --config Release --target neverd NeverDMobileTests --parallel 3
      - name: Run native readers, emitters, archives, process and CLI tests
        run: ctest --test-dir build-mobile/unittests/mobile -C Release --output-on-failure --no-tests=error
      - name: Verify the independent acceptance gates reject false coverage
        run: python -m unittest scripts.tests.test_mobile_android_internal_runner scripts.tests.test_mobile_ios_backend scripts.tests.test_mobile_swift_backend -v
      - name: Verify runtime with no interpreter on PATH
        shell: bash
        run: |
          test -z "$(find tools/neverd/mobile -name '*.py' -print -quit)"
          test ! -e build-mobile/bin/mobile
          mkdir -p "$RUNNER_TEMP/mobile-empty-path"
          PATH="$RUNNER_TEMP/mobile-empty-path" NEVERD_PYTHON=unavailable \
            "$GITHUB_WORKSPACE/build-mobile/bin/$EXECUTABLE" mobile \
            "$GITHUB_WORKSPACE/scripts/tests/fixtures/mobile/Peer.smali" \
            -o "$RUNNER_TEMP/mobile-no-interpreter" --json
        env:
          EXECUTABLE: ${{ matrix.executable }}
      - name: Set up JDK for Android source compilation and execution
        if: runner.os == 'Linux'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare D8 for self-owned Android fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0"
          fi
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          printf 'NEVERD_D8=%s\n' "$ANDROID_HOME/build-tools/35.0.0/d8" >> "$GITHUB_ENV"
      - name: Recover and independently execute Android sources through C++ CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python scripts/test_mobile_android_internal.py \
            --neverd build-mobile/bin/neverd --d8 "$NEVERD_D8" \
            --work-dir "$RUNNER_TEMP/android-native" --timeout 120
      - name: Prepare the pinned optional Android compatibility backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip --output "$RUNNER_TEMP/jadx.zip"
          printf '%s  %s\n' "$JADX_SHA256" "$RUNNER_TEMP/jadx.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
        env:
          JADX_SHA256: '545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974'
      - name: Verify explicit external compatibility through C++ CLI
        if: runner.os == 'Linux'
        shell: bash
        run: python scripts/test_mobile_android_backend.py --neverd build-mobile/bin/neverd --jadx "$RUNNER_TEMP/jadx/bin/jadx"
      # Attempt every suite even when an earlier test fails. No failure is
      # ignored; separate steps retain diagnostics for all requested corpora.
      - name: Recover and independently execute Objective-C scalar sources
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build_mobile.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: |
          python scripts/test_mobile_ios_backend.py \
            --neverd "$GITHUB_WORKSPACE/build-mobile/bin/neverd" \
            --arch all --fixups both --work-dir "$RUNNER_TEMP/ios-native/scalar"
      - name: Recover and independently execute Objective-C calls and Blocks
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build_mobile.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        run: |
          python scripts/test_mobile_ios_calls_backend.py \
            --neverd "$GITHUB_WORKSPACE/build-mobile/bin/neverd" \
            --arch all --fixups both --work-dir "$RUNNER_TEMP/ios-native/calls"
      - name: Recover and independently execute Swift sources
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.build_mobile.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        run: |
          python scripts/test_mobile_swift_backend.py \
            --neverd "$GITHUB_WORKSPACE/build-mobile/bin/neverd" \
            --arch all --fixups both --work-dir "$RUNNER_TEMP/ios-native/swift"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-mobile-${{ matrix.os }}
          path: |
            build-mobile/Testing/Temporary/
            build-mobile/unittests/mobile/Testing/Temporary/
            ${{ runner.temp }}/android-native/acceptance.json
            ${{ runner.temp }}/android-native/logs/
            ${{ runner.temp }}/ios-native/scalar/
            ${{ runner.temp }}/ios-native/calls/
            ${{ runner.temp }}/ios-native/swift/
          if-no-files-found: ignore
