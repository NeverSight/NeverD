name: CI macOS pointer-table verification

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runtime-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-macos:
    name: Focused runtime (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Configure focused Release build
        shell: bash
        run: |
          python_executable="$(python3 -c 'import sys; print(sys.executable)')"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DNEVERD_LLVM_PREBUILT=OFF \
            -DPython3_EXECUTABLE="$python_executable"

      - name: Build focused binaries
        shell: bash
        run: |
          cmake --build build-ci --config Release \
            --target neverd NeverDPatchFullTests \
              NeverDMachOPointerRelocationBoundaryTests \
              NeverDMachOSymbolResolutionTests \
            --parallel 3

      - name: Run pointer-table regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          export NEVERD="$PWD/build-ci/bin/neverd"
          test_rc=0
          build-ci/bin/NeverDPatchFullTests \
            --gtest_filter='PatchFullFnPtr_HostE2E.*' \
            --gtest_repeat=5 \
            --gtest_output=xml:ci-artifacts/fnptr-exact.xml \
            2>&1 | tee ci-artifacts/fnptr-exact.log || test_rc=1
          build-ci/bin/NeverDPatchFullTests \
            --gtest_filter='PatchFullFnPtrSret_HostE2E.*:PatchFullIndFpRet_HostE2E.*:PatchFullRetPtr_HostE2E.*:PatchFullSelectStr_HostE2E.*:PatchFullComputedGoto_HostE2E.*' \
            --gtest_output=xml:ci-artifacts/fnptr-adjacent.xml \
            2>&1 | tee ci-artifacts/fnptr-adjacent.log || test_rc=1
          build-ci/bin/NeverDMachOPointerRelocationBoundaryTests \
            --gtest_output=xml:ci-artifacts/pointer-boundary.xml \
            2>&1 | tee ci-artifacts/pointer-boundary.log || test_rc=1
          build-ci/bin/NeverDMachOSymbolResolutionTests \
            --gtest_output=xml:ci-artifacts/symbol-resolution.xml \
            2>&1 | tee ci-artifacts/symbol-resolution.log || test_rc=1
          exit "$test_rc"

      - name: Upload focused binaries and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-runtime-debug-macos-arm64
          if-no-files-found: warn
          retention-days: 3
          compression-level: 1
          path: |
            build-ci/bin/neverd*
            build-ci/bin/libneverd*
            build-ci/bin/NeverD*Tests*
            ci-artifacts
