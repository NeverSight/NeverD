name: Mobile Swift Toolchain Qualification

# Acquisition evidence for a fixed additional compiler. Application recovery
# and behavior qualification remain in Mobile Real Applications.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-swift-toolchain-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Identify the fixed Swift 6.4 snapshot
    if: github.repository == 'NeverSight/NeverD' && github.ref == 'refs/heads/dev'
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the package and tool identity guards
        run: python -m unittest scripts.tests.test_mobile_swift_toolchain -v
      - name: Verify and install the signed snapshot in the temporary runner
        run: |
          python scripts/qualify_mobile_swift_toolchain.py \
            --work-dir "$RUNNER_TEMP/mobile-swift-toolchain"
      - name: Preserve installation identity and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-swift-toolchain-qualification
          path: ${{ runner.temp }}/mobile-swift-toolchain/evidence
          retention-days: 7
          if-no-files-found: warn
