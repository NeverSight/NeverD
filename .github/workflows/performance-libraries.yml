name: Performance library compatibility

on:
  workflow_dispatch:
  push:
    branches: [dev, codex/performance-libraries]
    paths:
      - '.github/workflows/performance-libraries.yml'
      - 'cmake/NeverDPerformance.cmake'
      - 'cmake/NeverDForks*'
      - '.gitmodules'
      - 'third_party/forks.json'
      - 'third_party/highway'
      - 'third_party/simdutf'
      - 'third_party/simdjson'
      - 'third_party/oneTBB'
      - 'third_party/mimalloc'
      - 'cmake/NeverDMimalloc.cmake'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'scripts/build.py'
      - 'scripts/fork_dependencies.py'
      - 'scripts/tests/test_fork_dependencies.py'
      - 'include/neverd/support/ByteScan.h'
      - 'include/neverd/support/SortedSearch.h'
      - 'include/neverd/support/Limits.h'
      - 'include/neverd/support/Parallel.h'
      - 'lib/support/ByteScan.cpp'
      - 'lib/support/SortedSearch.cpp'
      - 'lib/support/Unicode.cpp'
      - 'lib/support/Parallel.cpp'
      - 'tools/common/transport/**'
      - 'unittests/acceleration/**'
  pull_request:
    paths:
      - '.github/workflows/performance-libraries.yml'
      - 'cmake/NeverDPerformance.cmake'
      - 'cmake/NeverDForks*'
      - '.gitmodules'
      - 'third_party/forks.json'
      - 'third_party/highway'
      - 'third_party/simdutf'
      - 'third_party/simdjson'
      - 'third_party/oneTBB'
      - 'third_party/mimalloc'
      - 'cmake/NeverDMimalloc.cmake'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'scripts/build.py'
      - 'scripts/fork_dependencies.py'
      - 'scripts/tests/test_fork_dependencies.py'
      - 'include/neverd/support/ByteScan.h'
      - 'include/neverd/support/SortedSearch.h'
      - 'include/neverd/support/Limits.h'
      - 'include/neverd/support/Parallel.h'
      - 'lib/support/ByteScan.cpp'
      - 'lib/support/SortedSearch.cpp'
      - 'lib/support/Unicode.cpp'
      - 'lib/support/Parallel.cpp'
      - 'tools/common/transport/**'
      - 'unittests/acceleration/**'

permissions:
  contents: read

concurrency:
  group: performance-libraries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x64, runner: ubuntu-24.04, cc: clang, cxx: clang++, arch: x64}
          - {name: Linux x64 GCC, runner: ubuntu-24.04, cc: gcc, cxx: g++, arch: x64}
          - {name: Linux ARM64, runner: ubuntu-24.04-arm, cc: clang, cxx: clang++, arch: arm64}
          - {name: macOS arm64, runner: macos-15, cc: clang, cxx: clang++, arch: arm64}
          - {name: macOS x64, runner: macos-15-intel, cc: clang, cxx: clang++, arch: x64}
          - {name: Windows x64 MSVC, runner: windows-2025-vs2026, cc: cl, cxx: cl, arch: x64}
          - {name: Windows x64 clang-cl, runner: windows-2025-vs2026, cc: clang-cl, cxx: clang-cl, arch: x64}
          - {name: Windows ARM64, runner: windows-11-arm, cc: cl, cxx: cl, arch: arm64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Verify fork refresh and build receipts
        run: python -m unittest scripts.tests.test_fork_dependencies -v
      - name: Test enabled and disabled libraries, including installed binaries
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          for mode in ON OFF; do
            for profile in Release Debug; do
              build="build-accel-$mode-$profile"
              options=(-DNEVERD_TEST_EXPECT_ACCELERATION="$mode")
              if [ "$mode" = OFF ]; then
                options+=(-DNEVERD_ENABLE_TBB=OFF -DNEVERD_ENABLE_HIGHWAY=OFF
                          -DNEVERD_ENABLE_SIMDUTF=OFF -DNEVERD_ENABLE_SIMDJSON=OFF)
              fi
              cmake -S unittests/acceleration -B "$build" -G Ninja \
                -DCMAKE_BUILD_TYPE="$profile" -DNEVERD_TEST_EXPECT_MIMALLOC=ON \
                "${options[@]}"
              python scripts/build.py "$build" --target all neverd-sorted-search-bench --parallel 3
              python unittests/acceleration/verify.py "$build/bin/NeverDAccelerationTests$suffix" "$build/evidence"
              runtimes=0
              if [ "$mode" = ON ]; then runtimes=1; fi
              python unittests/acceleration/verify.py "$build/bin/NeverDSharedSchedulerTests$suffix" "$build/evidence/shared-scheduler" --minimum 2 --tbb-runtimes "$runtimes"
              cmake --install "$build" --prefix "$build/installed"
              python unittests/acceleration/verify.py "$build/installed/bin/NeverDAccelerationTests$suffix" "$build/installed-evidence"
              python unittests/acceleration/verify.py "$build/installed/bin/NeverDSharedSchedulerTests$suffix" "$build/installed-evidence/shared-scheduler" --minimum 2 --tbb-runtimes "$runtimes"
              if find "$build/installed" -type f \( -iname '*tbb*.dll' -o -iname '*tbb*.so*' -o -iname '*tbb*.dylib' \) | grep -q .; then
                echo 'Unexpected oneTBB shared runtime in installation' >&2
                exit 1
              fi
            done
          done
      - name: Verify the fork's loader and process allocator policies
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          tbb_source=$(python -c 'import json; from pathlib import Path; s=json.load(open("build-accel-ON-Release/.neverd-deps/snapshot.json"))["sources"]["neverd_tbb"]; print(Path(s["archive"]).parent / "src")')
          cmake -S "$tbb_source" -B build-tbb-loader -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DTBB_TEST=ON -DTBB_STRICT=OFF -DTCM_BUILD=OFF -DTCM_TEST=OFF \
            -DTBBMALLOC_BUILD=ON -DTBBMALLOC_PROXY_BUILD=OFF -DTBB_USE_SYSTEM_ALLOCATOR=ON \
            -DTBB_ENABLE_IPO=OFF -DTBB_DISABLE_HWLOC_AUTOMATIC_SEARCH=ON
          # The isolated regression provides a real allocator sidecar to prove
          # the scheduler refuses discovery. Product builds never build it.
          cmake --build build-tbb-loader --target test_dynamic_link test_system_allocator --parallel 3
          cd build-tbb-loader
          ctest -R '^(test_dynamic_link|test_system_allocator)$' \
            --no-tests=error --output-on-failure --output-junit loader.xml
          python - <<'PYTHON'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('loader.xml').getroot().iter('testcase'))
          assert {c.get('name') for c in cases} == {'test_dynamic_link', 'test_system_allocator'}
          assert all(c.get('status') == 'run' for c in cases)
          assert not any(child.tag in {'failure', 'error', 'skipped'} for c in cases for child in c)
          PYTHON
      - name: Test system allocator and sanitizer coexistence
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          ASAN_OPTIONS: detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          cmake -S unittests/acceleration -B build-accel-system -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNEVERD_ENABLE_TBB=ON \
            -DNEVERD_ENABLE_MIMALLOC=OFF -DNEVERD_TEST_EXPECT_MIMALLOC=OFF
          python scripts/build.py build-accel-system --parallel 3
          python unittests/acceleration/verify.py "build-accel-system/bin/NeverDAccelerationTests$suffix" build-accel-system/evidence
          python unittests/acceleration/verify.py "build-accel-system/bin/NeverDSharedSchedulerTests$suffix" build-accel-system/evidence/shared-scheduler --minimum 2 --tbb-runtimes 1
          if [ "$RUNNER_OS" != Windows ]; then
            cmake -S unittests/acceleration -B build-accel-asan -G Ninja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEVERD_ENABLE_TBB=ON \
              -DNEVERD_TEST_EXPECT_MIMALLOC=OFF \
              -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
              -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
            python scripts/build.py build-accel-asan --parallel 3
            python unittests/acceleration/verify.py build-accel-asan/bin/NeverDAccelerationTests build-accel-asan/evidence
            python unittests/acceleration/verify.py build-accel-asan/bin/NeverDSharedSchedulerTests build-accel-asan/evidence/shared-scheduler --minimum 2 --tbb-runtimes 1
          fi
      - name: Verify macOS allocator minimum size and libffi compatibility
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          allocator_source=$(python -c 'import json; from pathlib import Path; s=json.load(open("build-accel-ON-Release/.neverd-deps/snapshot.json"))["sources"]["neverd_mimalloc"]; print(Path(s["archive"]).parent / "src")')
          for config in Release Debug; do
            cmake -S "$allocator_source" -B "build-mimalloc-fork-$config" -G Ninja \
              -DCMAKE_BUILD_TYPE="$config" -DMI_BUILD_TESTS=ON -DMI_BUILD_SHARED=OFF \
              -DMI_BUILD_STATIC=ON -DMI_BUILD_OBJECT=ON -DMI_NO_OPT_ARCH=ON
            cmake --build "build-mimalloc-fork-$config" --target mimalloc-test-api mimalloc-test-osx-override --parallel 3
            ctest --test-dir "build-mimalloc-fork-$config" -R '^(test-api|test-osx-override)$' \
              --output-on-failure --no-tests=error --output-junit allocator.xml
          done
      - name: Retain complete native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceleration-${{ matrix.name }}-${{ github.sha }}
          path: |
            build-accel-*/evidence
            build-accel-*/installed-evidence
            build-accel-*/CMakeCache.txt
            build-accel-*/neverd-*.json
            build-mimalloc-fork-*/allocator.xml
            build-tbb-loader/loader.xml
            build-tbb-loader/CMakeCache.txt
            build-tbb-loader/Testing/Temporary/LastTest.log
          if-no-files-found: error
