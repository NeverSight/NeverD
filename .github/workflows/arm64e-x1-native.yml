name: Arm64e x1 native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: [self-hosted, macOS, ARM64, neverd-arm64e-x1]
    timeout-minutes: 20
    env:
      EVIDENCE: neverd-arm64e-x1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            unittests/lift/aarch64
            unittests/lift/format
            include/neverd/runtime
            include/neverd/ir/intrinsics/AArch64
      - name: Require native x1 signing, checked arithmetic, writeback and 128-bit LRCPC3
        run: |
          ulimit -c 0
          python3 scripts/verify_arm64e_native.py qualify-x1-full --output "$RUNNER_TEMP/$EVIDENCE"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64e-x1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 7
