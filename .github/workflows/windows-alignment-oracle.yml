name: Windows alignment observations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-alignment-oracle.yml'
      - 'scripts/check_windows_alignment.py'
      - 'scripts/tests/test_check_windows_alignment.py'
      - 'unittests/emulation/fixtures/windows_alignment.*'
      - 'unittests/emulation/fixtures/WindowsAlignmentCases.def'
      - 'scripts/check_aarch64_exclusives.py'
      - 'scripts/tests/test_check_aarch64_exclusives.py'
      - 'unittests/emulation/aarch64/AArch64ExclusiveCases.def'
      - 'unittests/emulation/fixtures/aarch64_exclusive*'
      - 'unittests/emulation/fixtures/AArch64ExclusiveOracle.def'
      - 'scripts/check_aarch64_atomics.py'
      - 'scripts/tests/test_check_aarch64_atomics.py'
      - 'unittests/emulation/aarch64/AArch64AtomicCases.def'
      - 'unittests/emulation/fixtures/aarch64_atomic*'
      - 'unittests/emulation/fixtures/AArch64AtomicOracle.def'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/windows-alignment-oracle.yml'
      - 'scripts/check_windows_alignment.py'
      - 'scripts/tests/test_check_windows_alignment.py'
      - 'unittests/emulation/fixtures/windows_alignment.*'
      - 'unittests/emulation/fixtures/WindowsAlignmentCases.def'
      - 'scripts/check_aarch64_exclusives.py'
      - 'scripts/tests/test_check_aarch64_exclusives.py'
      - 'unittests/emulation/aarch64/AArch64ExclusiveCases.def'
      - 'unittests/emulation/fixtures/aarch64_exclusive*'
      - 'unittests/emulation/fixtures/AArch64ExclusiveOracle.def'
      - 'scripts/check_aarch64_atomics.py'
      - 'scripts/tests/test_check_aarch64_atomics.py'
      - 'unittests/emulation/aarch64/AArch64AtomicCases.def'
      - 'unittests/emulation/fixtures/aarch64_atomic*'
      - 'unittests/emulation/fixtures/AArch64AtomicOracle.def'

permissions:
  contents: read

concurrency:
  group: windows-alignment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Verify observation integrity rules
        run: python -m unittest scripts.tests.test_check_windows_alignment -v
      - name: Collect native Windows exception records
        run: python scripts/check_windows_alignment.py --output build-windows-alignment
      - name: Preserve original native observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-alignment-x64
          path: build-windows-alignment/
          if-no-files-found: error
          retention-days: 14

  observe-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify ARM64 observation integrity rules
        run: python -m unittest scripts.tests.test_check_aarch64_exclusives -v
      - name: Collect original ARM64 alignment and permission observations
        run: python scripts/check_aarch64_exclusives.py --output build-arm64-alignment
      - name: Verify ARM64 atomic observation integrity rules
        run: python -m unittest scripts.tests.test_check_aarch64_atomics -v
      - name: Collect original ARM64 atomic observations
        run: python scripts/check_aarch64_atomics.py --output build-arm64-atomics
      - name: Preserve original ARM64 atomic observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-atomics-arm64
          path: build-arm64-atomics/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve original ARM64 native observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-alignment-arm64
          path: build-arm64-alignment/
          if-no-files-found: error
          retention-days: 14
