name: KVM direct MSR diagnostic (Ubuntu 24 alias)
on:
  push:
    branches: ["codex/kvm-direct-msr-probe-latest-f8db93a1f"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kvm-direct-msr-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Verify the affected Ubuntu 24 x64 image
        run: |
          python3 - <<'PYIMAGE'
          import platform
          value = platform.freedesktop_os_release()
          print(value)
          print(platform.machine())
          assert value['ID'] == 'ubuntu' and value['VERSION_ID'] == '24.04'
          assert platform.machine() == 'x86_64'
          PYIMAGE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: 'v0.16.0'
      - name: Install matching Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build gcc-multilib
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Prepare actual hosted KVM access and identity
        run: |
          python3 scripts/prepare_kvm_ci.py --output build-ci/msr-evidence/device-access.json
          uname -a > build-ci/msr-evidence/host.txt
          lscpu >> build-ci/msr-evidence/host.txt
          clang --version >> build-ci/msr-evidence/host.txt
          cmake --version >> build-ci/msr-evidence/host.txt
      - name: Configure original Release and prebuilt LLVM mode
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_BUILD_WEB_MCP=ON -DNEVERD_BUILD_PLUGINS=ON \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=ON -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=ON \
            -DNEVERD_ENABLE_DRIVER_EMULATION=ON
      - name: Collect bounded original and early-filter observations
        run: python3 .github/diagnostics/kvm_msr_probe.py
      - name: Upload minimal diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvm-direct-msr-diagnostic
          path: build-ci/msr-evidence/
          if-no-files-found: error
          retention-days: 14
