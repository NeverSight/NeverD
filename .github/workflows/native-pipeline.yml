name: MIPS native qualification (temporary)

# Diagnostic branch only. Retire after the pending MIPS chain is qualified.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MIPS PR commit to qualify
        required: true
        type: string
      mips_test_count:
        description: Expected complete MIPS inventory at the exact source
        required: true
        default: '995'
        type: string
      qualification_role:
        description: Source role for exact-base comparison
        required: true
        default: candidate
        type: choice
        options:
          - baseline
          - candidate
      pr_number:
        description: Pending PR number for the pr-owners scope
        required: false
        type: string
      scope:
        description: Native owners or a bounded compiler/worker reproducer
        type: choice
        default: qualification
        options:
          - qualification
          - macos-qualification
          - pr-owners
          - record-unix-qualification
          - constructor-repro
          - render-store-probe
          - render-store-profile
          - worker-cadence
          - dsp64-reference
          - windows-source-boundaries
          - windows-frame-proof
          - windows-crt-proof
          - frame-unix-qualification
          - crt-unix-qualification

permissions:
  contents: read

concurrency:
  group: mips-native-qualification-${{ inputs.scope }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  windows_source_boundaries:
    if: inputs.scope == 'windows-source-boundaries' || inputs.scope == 'windows-frame-proof' || inputs.scope == 'windows-crt-proof'
    name: Windows exact-source boundary diagnosis
    runs-on: windows-latest
    timeout-minutes: 160
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      DIAGNOSTIC_SCOPE: ${{ inputs.scope }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact source
        run: |
          python - <<'PYTHON'
          import os,re,subprocess
          expected=os.environ['EXPECTED_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',expected)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
          PYTHON
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
      - name: Install Windows build tools
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - name: Install pinned fixture compiler
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Configure the same bounded Release profile
        run: |
          cmake -S . -B build-mips-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=ON \
            "-DNEVERD_ARM64E_TEST_CLANG_EXECUTABLE=$(cygpath -m "$NEVERD_SOURCE_CLANG")"
      - name: Build boundary test targets
        run: |
          python - <<'PYTHON'
          import os,subprocess
          targets=['NeverDMachOPointerRelocationBoundaryTests','NeverDNativePointerRelocationBoundaryTests']
          if os.environ['DIAGNOSTIC_SCOPE']=='windows-crt-proof':
              targets=['NeverDLibCTests','NeverDMedCachedCallTargetTests','NeverDWin64CallContractTests','NeverDLLVMCValueTests','NeverDNativePointerRelocationBoundaryTests']
          subprocess.run(['python','scripts/build.py','build-mips-ci','--config','Release','--parallel','4','--target','neverd',*targets],check=True)
          PYTHON
      - name: Capture exact failures and a stack-size diagnostic
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,platform,shutil,struct,subprocess,tarfile,xml.etree.ElementTree as ET
          root=Path('build-mips-ci');out=root/'evidence';out.mkdir()
          temporary=(out/'temporary').resolve();temporary.mkdir()
          environment=dict(os.environ,TMP=str(temporary),TEMP=str(temporary))
          rows=[]
          def digest(p):return hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
          def run(command,name):
              log=out/(name+'.log')
              with log.open('wb') as stream:
                  result=subprocess.run(list(map(str,command)),env=environment,stdout=stream,stderr=subprocess.STDOUT,timeout=240)
              row={'command':list(map(str,command)),'exit':result.returncode,'windows_status':hex(result.returncode&0xffffffff),'log_sha256':digest(log)}
              rows.append(row);(out/'commands.json').write_text(json.dumps(rows,indent=2)+'\n')
              return result.returncode
          originals=[
            ('NeverDMachOPointerRelocationBoundaryTests','LLVMFrameSlotProof.ExhaustedPrefixesAreNotIndependentProofs'),
            ('NeverDNativePointerRelocationBoundaryTests','NativePointerRelocationBoundary.MinGWProgramWholeModuleLLVMCCompiles'),
            ('NeverDNativePointerRelocationBoundaryTests','NativePointerRelocationBoundary.CRTHeaderRecordReuseChecksTheActualRuntimeLayout')]
          if os.environ['DIAGNOSTIC_SCOPE']=='windows-frame-proof':
              binary=root/'bin'/'NeverDMachOPointerRelocationBoundaryTests.exe'
              listing=subprocess.check_output([binary,'--gtest_list_tests'],text=True)
              assert 'DeepOffsetChainsUseTheNodeBudget' in listing
              originals=[('NeverDMachOPointerRelocationBoundaryTests','LLVMFrameSlotProof.*')]
          if os.environ['DIAGNOSTIC_SCOPE']=='windows-crt-proof':
              originals=[
                ('NeverDLibCTests','LibCPrototype.WindowsCRTHandlerAndLocaleKeepPointerContracts'),
                ('NeverDMedCachedCallTargetTests','MedCachedCallTarget.ImmutableReferencesRetainTheRuntimeImportLoad'),
                ('NeverDWin64CallContractTests','Win64CallContract.ImmutableImportReferencesKeepIncomingArguments'),
                ('NeverDLLVMCValueTests','LLVMCValues.WindowsCRTLocaleAndHandlerKeepTheirHeaderTypes'),
                ('NeverDNativePointerRelocationBoundaryTests','NativePointerRelocationBoundary.CRTPrototypesAgreeWithTheirOwningHeaders'),
                ('NeverDNativePointerRelocationBoundaryTests','NativePointerRelocationBoundary.MinGWProgramWholeModuleLLVMCCompiles'),
                ('NeverDNativePointerRelocationBoundaryTests','NativePointerRelocationBoundary.CRTHeaderRecordReuseChecksTheActualRuntimeLayout')]
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['EXPECTED_SOURCE_SHA']
          manifest={'source':source,'workflow':os.environ['GITHUB_SHA'],'platform':platform.platform(),'configuration':'Release','llvm_mode':'published prebuilt LLVM','binaries':{},'scope':os.environ['DIAGNOSTIC_SCOPE']+'; original default-stack outcomes are qualification evidence; expanded stack copy is diagnosis only.'}
          codes=[]
          for i,(owner,test) in enumerate(originals):
              binary=root/'bin'/(owner+'.exe');manifest['binaries'][owner]=digest(binary)
              codes.append(run([binary,'--gtest_filter='+test,'--gtest_output=xml:'+str((out/('original-'+str(i)+'.xml')).resolve())],'original-'+str(i)))
          if os.environ['DIAGNOSTIC_SCOPE']=='windows-crt-proof':
              for i,(_,test) in enumerate(originals):
                  cases=list(ET.parse(out/('original-'+str(i)+'.xml')).getroot().iter('testcase'))
                  assert len(cases)==1 and cases[0].get('classname')+'.'+cases[0].get('name')==test
                  assert cases[0].find('skipped') is None,'A skipped boundary is not validation'
          manifest['stack_diagnostic']=None
          if os.environ['DIAGNOSTIC_SCOPE']!='windows-crt-proof':
              # Change only the copied executable's stack reservation. Keep the
              # default failure and both header values; never qualify this copy.
              binary=root/'bin'/(originals[0][0]+'.exe');copy=binary.with_name('frame-stack-diagnostic.exe');shutil.copy2(binary,copy)
              def pe_stack(path):
                  data=path.read_bytes();pe=struct.unpack_from('<I',data,0x3c)[0];optional=pe+24
                  assert struct.unpack_from('<H',data,optional)[0]==0x20b
                  return struct.unpack_from('<Q',data,optional+72)[0]
              before=pe_stack(copy)
              assert run(['editbin','/STACK:8388608',copy],'edit-stack')==0
              after=pe_stack(copy);assert after==8388608
              diagnostic=run([copy,'--gtest_filter='+originals[0][1]],'stack-diagnostic')
              manifest['stack_diagnostic']={'default_reserve':before,'diagnostic_reserve':after,'sha256':digest(copy),'exit':diagnostic}
              copy.unlink()
          for name in ['cl','clang','x86_64-w64-mingw32-gcc']:
              tool=shutil.which(name)
              if tool:run([tool,*([] if name=='cl' else ['--version'])],name+'-version')
          files={p.relative_to(temporary).as_posix():{'sha256':digest(p),'bytes':p.stat().st_size} for p in temporary.rglob('*') if p.is_file()}
          archive=out/'temporary-diagnostics.tar.gz'
          with tarfile.open(archive,'w:gz') as t:
              for name in files:
                  if Path(name).suffix in ('.c','.cpp','.h','.log','.txt'):
                      t.add(temporary/name,arcname=name)
          with tarfile.open(archive,'r:gz') as t:
              for member in t.getmembers():
                  assert hashlib.sha256(t.extractfile(member).read()).hexdigest()==files[member.name]['sha256']
          shutil.rmtree(temporary)
          manifest['cleanup']={'removed_bytes':sum(x['bytes'] for x in files.values()),'products':files,'diagnostic_copy_removed':True}
          (out/'source.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps({'source':source,'original_exits':codes,'stack_diagnostic':manifest['stack_diagnostic']},indent=2))
          assert all(code==0 for code in codes),'Original failures are retained; diagnostic pass is not a waiver'
          PYTHON
      - name: Upload bounded Windows diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mips-windows-boundaries-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build-mips-ci/evidence/
            build-mips-ci/CMakeCache.txt
            build-mips-ci/neverd-build-receipt.json
            build-mips-ci/neverd-dependency-inputs.json
  constructor:
    if: inputs.scope == 'constructor-repro'
    name: MSVC noncopyable constructor reproducer
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Reproduce and compare construction forms
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,re,subprocess
          p=Path('constructor-evidence');p.mkdir()
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_SOURCE_SHA'])
          common="""#include <memory>
          #include <optional>
          #include <type_traits>
          struct Library {};
          struct Options {};
          class State {
           public:
            State(const Library &, const Options &) : P(std::make_unique<int>(7)) {}
            ~State() = default;
           private:
            std::unique_ptr<int> P;
          };
          static_assert(!std::is_copy_constructible_v<State>);
          static_assert(!std::is_move_constructible_v<State>);
          struct Builder {
            const Library &L;
            std::optional<State> Own;
            const State &Ref;
            Builder(const Library &L, const State *Shared = nullptr)
                : L(L), @INITIALIZER@ {}
          };
          int main() { Library L; State Shared(L, {}); Builder A(L), B(L, &Shared); }
          """
          forms={
           'conditional':'Own(Shared ? std::optional<State>() : std::optional<State>(std::in_place, L, Options{})), Ref(Shared ? *Shared : *Own)',
           'direct_return':'Own([&]() -> std::optional<State> { if (Shared) return {}; return std::optional<State>(std::in_place, L, Options{}); }()), Ref(Shared ? *Shared : *Own)',
           'emplace':'Ref(Shared ? *Shared : Own.emplace(L, Options{}))'}
          results={}
          for name,initial in forms.items():
           source=p/(name+'.cpp');source.write_text(common.replace('@INITIALIZER@',initial));obj=p/(name+'.obj')
           command=['cl','/nologo','/std:c++20','/O2','/EHsc','/c',str(source),'/Fo'+str(obj)]
           result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
           (p/(name+'.log')).write_text(result.stdout)
           results[name]={'command':command,'exit':result.returncode,'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'has_C2280':'C2280' in result.stdout}
           if obj.exists():results[name]['object_sha256']=hashlib.sha256(obj.read_bytes()).hexdigest();obj.unlink()
          version=subprocess.run(['cl'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          receipt={'reference_source':os.environ['EXPECTED_SOURCE_SHA'],'workflow_source':os.environ['GITHUB_SHA'],'compiler':version.stdout,'variants':results,'scope':'Compiler reproducer with the same noncopyable/nonmovable unique_ptr state and user-declared destructor as TypeSpeller, not a build of NeverD or its LLVM dependencies','cleanup':'Generated objects removed after hashing; sources/logs retained'}
          (p/'results.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          assert results['conditional']['exit']!=0 and results['conditional']['has_C2280'], 'original compiler failure not reproduced'
          assert results['direct_return']['exit']==0 and results['emplace']['exit']==0
          PYTHON
      - name: Upload constructor diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msvc-constructor-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: constructor-evidence/
  native:
    if: inputs.scope == 'qualification' || inputs.scope == 'macos-qualification' || inputs.scope == 'record-unix-qualification' || inputs.scope == 'frame-unix-qualification' || inputs.scope == 'crt-unix-qualification'
    name: ${{ matrix.name }} MIPS and source ABI
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.scope == 'macos-qualification' && '{"include":[{"name":"macOS Apple Clang","runner":"macos-15","cc":"clang","cxx":"clang++","parallel":3}]}' || (inputs.scope == 'frame-unix-qualification' || inputs.scope == 'crt-unix-qualification' || inputs.scope == 'record-unix-qualification') && '{"include":[{"name":"Linux Clang 18 libstdc++ 14","runner":"ubuntu-24.04","cc":"clang-18","cxx":"clang++-18","parallel":4},{"name":"macOS Apple Clang","runner":"macos-15","cc":"clang","cxx":"clang++","parallel":3}]}' || '{"include":[{"name":"Linux Clang 18 libstdc++ 14","runner":"ubuntu-24.04","cc":"clang-18","cxx":"clang++-18","parallel":4},{"name":"macOS Apple Clang","runner":"macos-15","cc":"clang","cxx":"clang++","parallel":3},{"name":"Windows MSVC","runner":"windows-latest","cc":"cl","cxx":"cl","parallel":4}]}') }}
    timeout-minutes: 180
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      QUALIFICATION_CXX: ${{ matrix.cxx }}
      QUALIFICATION_ROLE: ${{ inputs.qualification_role }}
      QUALIFICATION_SCOPE: ${{ inputs.scope }}
      EXPECTED_MIPS_TEST_COUNT: ${{ inputs.mips_test_count }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source identity
        run: |
          python - <<'PYTHON'
          import os, re, subprocess
          expected = os.environ['EXPECTED_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), expected
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          PYTHON
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
      - name: Install Linux build and fixture tools
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/neverd-llvm.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/neverd-llvm.asc" \
            | grep '^fpr:.*6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -m 0644 "$RUNNER_TEMP/neverd-llvm.asc" /usr/share/keyrings/neverd-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/neverd-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/neverd-llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-23 cmake libclang-rt-23-dev lld-23 llvm-23 ninja-build gcc-multilib g++-14 zlib1g-dev
          printf '%s\n' /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          printf '%s\n' 'NEVERD_SOURCE_CLANG=/usr/lib/llvm-23/bin/clang' >> "$GITHUB_ENV"
          sudo sysctl -w kernel.core_pattern=/dev/null
      - name: Install macOS build and fixture tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake lld ninja llvm@22
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "NEVERD_SOURCE_CLANG=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - name: Install pinned fixture compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install the CRT fixture toolchain on Unix
        if: inputs.scope == 'crt-unix-qualification'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install --yes gcc-mingw-w64-x86-64
          else
            brew install mingw-w64
          fi
      - name: Configure bounded Release qualification
        run: |
          platform_args=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -d /usr/lib/gcc/x86_64-linux-gnu/14
            platform_args+=("-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            platform_args+=("-DNEVERD_ARM64E_TEST_CLANG_EXECUTABLE=$(cygpath -m "$NEVERD_SOURCE_CLANG")")
          else
            platform_args+=("-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$NEVERD_SOURCE_CLANG")
          fi
          cmake -S . -B build-mips-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=ON "${platform_args[@]}"
      - name: Compile known portability boundaries first
        timeout-minutes: 60
        run: |
          object_suffix=o
          if [ "$RUNNER_OS" = "Windows" ]; then object_suffix=obj; fi
          python scripts/build.py build-mips-ci --config Release --parallel ${{ matrix.parallel }} --target \
            "lib/types/CMakeFiles/NeverDTypes.dir/TypeJSON.cpp.$object_suffix" \
            "lib/sdk/CMakeFiles/neverd_shared.dir/capi/NeverDCAPILocalTypes.cpp.$object_suffix" \
            "unittests/CMakeFiles/NeverDSessionLLVMTests.dir/__/lib/sdk/capi/NeverDCAPILocalTypes.cpp.$object_suffix" \
            "tools/neverd-worker/CMakeFiles/neverd-worker-test-server.dir/EngineComputedStrings.cpp.$object_suffix"
          mkdir -p build-mips-ci/evidence
          cp build-mips-ci/neverd-build-receipt.json build-mips-ci/evidence/portability-build-receipt.json
      - name: Build and verify complete mock worker transport owner
        id: mock_worker
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scripts/build.py build-mips-ci --config Release --parallel ${{ matrix.parallel }} --target neverd-worker-test-server
          python - <<'PYTHON'
          from collections import Counter
          from pathlib import Path
          import hashlib,json,os,re,subprocess,xml.etree.ElementTree as ET
          output=Path('build-mips-ci/evidence');output.mkdir(parents=True,exist_ok=True)
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir','build-mips-ci','-C','Release','--show-only=json-v1'],text=True))
          tests=[t for t in inventory['tests'] if len(t.get('command',[]))>2 and Path(t['command'][2]).stem=='neverd-worker-test-server']
          names=[t['name'] for t in tests]
          assert len(names)==20 and 'NeverDWorkerComputedStrings' in names, names
          (output/'worker-inventory.json').write_text(json.dumps(tests,indent=2)+'\n')
          binary=Path('build-mips-ci/bin')/('neverd-worker-test-server.exe' if os.name=='nt' else 'neverd-worker-test-server')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['EXPECTED_SOURCE_SHA']
          command=['ctest','--test-dir','build-mips-ci','-C','Release','-R','^('+'|'.join(re.escape(n) for n in names)+')$','--parallel','4','--no-tests=error','--output-on-failure','--output-junit',str((output/'worker-results.xml').resolve())]
          receipt={'source_sha':source,'binary_sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),'command':command,'scope':'Complete mock C ABI worker transport group; real worker engine and protocol, not real SDK execution.'}
          (output/'worker-source.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with (output/'worker-ctest.log').open('w') as log: result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=1050)
          cases=list(ET.parse(output/'worker-results.xml').getroot().iter('testcase'))
          actual=Counter(c.get('name') for c in cases);expected=Counter(names)
          failed=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped=[c.get('name') for c in cases if c.find('skipped') is not None]
          audit={'exit':result.returncode,'total':len(cases),'failed':failed,'skipped':skipped,'missing':list((expected-actual).elements()),'unexpected':list((actual-expected).elements())}
          (output/'worker-outcomes.json').write_text(json.dumps(audit,indent=2)+'\n');print(json.dumps(audit,indent=2))
          assert actual==expected and result.returncode==0 and not failed and not skipped,audit
          PYTHON
      - name: Build complete owning test targets
        timeout-minutes: 125
        run: |
          python - <<'PYTHON'
          import os,subprocess
