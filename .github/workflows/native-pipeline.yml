name: MIPS native qualification (temporary)

# Diagnostic branch only. Retire after the pending MIPS chain is qualified.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MIPS PR commit to qualify
        required: true
        type: string
      scope:
        description: Native owners or a bounded compiler/worker reproducer
        type: choice
        default: qualification
        options:
          - qualification
          - macos-qualification
          - constructor-repro
          - render-store-probe
          - render-store-profile

permissions:
  contents: read

concurrency:
  group: mips-native-qualification-${{ inputs.scope }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  constructor:
    if: inputs.scope == 'constructor-repro'
    name: MSVC noncopyable constructor reproducer
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Reproduce and compare construction forms
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,re,subprocess
          p=Path('constructor-evidence');p.mkdir()
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['EXPECTED_SOURCE_SHA'])
          common="""#include <memory>
          #include <optional>
          #include <type_traits>
          struct Library {};
          struct Options {};
          class State {
           public:
            State(const Library &, const Options &) : P(std::make_unique<int>(7)) {}
            ~State() = default;
           private:
            std::unique_ptr<int> P;
          };
          static_assert(!std::is_copy_constructible_v<State>);
          static_assert(!std::is_move_constructible_v<State>);
          struct Builder {
            const Library &L;
            std::optional<State> Own;
            const State &Ref;
            Builder(const Library &L, const State *Shared = nullptr)
                : L(L), @INITIALIZER@ {}
          };
          int main() { Library L; State Shared(L, {}); Builder A(L), B(L, &Shared); }
          """
          forms={
           'conditional':'Own(Shared ? std::optional<State>() : std::optional<State>(std::in_place, L, Options{})), Ref(Shared ? *Shared : *Own)',
           'direct_return':'Own([&]() -> std::optional<State> { if (Shared) return {}; return std::optional<State>(std::in_place, L, Options{}); }()), Ref(Shared ? *Shared : *Own)',
           'emplace':'Ref(Shared ? *Shared : Own.emplace(L, Options{}))'}
          results={}
          for name,initial in forms.items():
           source=p/(name+'.cpp');source.write_text(common.replace('@INITIALIZER@',initial));obj=p/(name+'.obj')
           command=['cl','/nologo','/std:c++20','/O2','/EHsc','/c',str(source),'/Fo'+str(obj)]
           result=subprocess.run(command,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
           (p/(name+'.log')).write_text(result.stdout)
           results[name]={'command':command,'exit':result.returncode,'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),'has_C2280':'C2280' in result.stdout}
           if obj.exists():results[name]['object_sha256']=hashlib.sha256(obj.read_bytes()).hexdigest();obj.unlink()
          version=subprocess.run(['cl'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          receipt={'reference_source':os.environ['EXPECTED_SOURCE_SHA'],'workflow_source':os.environ['GITHUB_SHA'],'compiler':version.stdout,'variants':results,'scope':'Compiler reproducer with the same noncopyable/nonmovable unique_ptr state and user-declared destructor as TypeSpeller, not a build of NeverD or its LLVM dependencies','cleanup':'Generated objects removed after hashing; sources/logs retained'}
          (p/'results.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          assert results['conditional']['exit']!=0 and results['conditional']['has_C2280'], 'original compiler failure not reproduced'
          assert results['direct_return']['exit']==0 and results['emplace']['exit']==0
          PYTHON
      - name: Upload constructor diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msvc-constructor-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: constructor-evidence/
  native:
    if: inputs.scope == 'qualification' || inputs.scope == 'macos-qualification'
    name: ${{ matrix.name }} MIPS and source ABI
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{ fromJSON(inputs.scope == 'macos-qualification' && '{"include":[{"name":"macOS Apple Clang","runner":"macos-15","cc":"clang","cxx":"clang++","parallel":3}]}' || '{"include":[{"name":"Linux Clang 18 libstdc++ 14","runner":"ubuntu-24.04","cc":"clang-18","cxx":"clang++-18","parallel":4},{"name":"macOS Apple Clang","runner":"macos-15","cc":"clang","cxx":"clang++","parallel":3},{"name":"Windows MSVC","runner":"windows-latest","cc":"cl","cxx":"cl","parallel":4}]}') }}
    timeout-minutes: 180
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      QUALIFICATION_CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify source identity
        run: |
          python - <<'PYTHON'
          import os, re, subprocess
          expected = os.environ['EXPECTED_SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', expected), expected
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == expected, (actual, expected)
          PYTHON
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
      - name: Install Linux build and fixture tools
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/neverd-llvm.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/neverd-llvm.asc" \
            | grep '^fpr:.*6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -m 0644 "$RUNNER_TEMP/neverd-llvm.asc" /usr/share/keyrings/neverd-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/neverd-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' \
            | sudo tee /etc/apt/sources.list.d/neverd-llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-23 cmake libclang-rt-23-dev lld-23 llvm-23 ninja-build gcc-multilib g++-14 zlib1g-dev
          printf '%s\n' /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
          printf '%s\n' 'NEVERD_SOURCE_CLANG=/usr/lib/llvm-23/bin/clang' >> "$GITHUB_ENV"
          sudo sysctl -w kernel.core_pattern=/dev/null
      - name: Install macOS build and fixture tools
        if: runner.os == 'macOS'
        run: |
          brew install cmake lld ninja llvm@22
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "NEVERD_SOURCE_CLANG=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - name: Install pinned fixture compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure bounded Release qualification
        run: |
          platform_args=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -d /usr/lib/gcc/x86_64-linux-gnu/14
            platform_args+=("-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            platform_args+=("-DNEVERD_ARM64E_TEST_CLANG_EXECUTABLE=$(cygpath -m "$NEVERD_SOURCE_CLANG")")
          else
            platform_args+=("-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$NEVERD_SOURCE_CLANG")
          fi
          cmake -S . -B build-mips-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=ON "${platform_args[@]}"
      - name: Compile known portability boundaries first
        timeout-minutes: 60
        run: |
          object_suffix=o
          if [ "$RUNNER_OS" = "Windows" ]; then object_suffix=obj; fi
          python scripts/build.py build-mips-ci --config Release --parallel ${{ matrix.parallel }} --target \
            "lib/types/CMakeFiles/NeverDTypes.dir/TypeJSON.cpp.$object_suffix" \
            "lib/sdk/CMakeFiles/neverd_shared.dir/capi/NeverDCAPILocalTypes.cpp.$object_suffix" \
            "unittests/CMakeFiles/NeverDSessionLLVMTests.dir/__/lib/sdk/capi/NeverDCAPILocalTypes.cpp.$object_suffix" \
            "tools/neverd-worker/CMakeFiles/neverd-worker-test-server.dir/EngineComputedStrings.cpp.$object_suffix"
          mkdir -p build-mips-ci/evidence
          cp build-mips-ci/neverd-build-receipt.json build-mips-ci/evidence/portability-build-receipt.json
      - name: Build and verify complete mock worker transport owner
        id: mock_worker
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python scripts/build.py build-mips-ci --config Release --parallel ${{ matrix.parallel }} --target neverd-worker-test-server
          python - <<'PYTHON'
          from collections import Counter
          from pathlib import Path
          import hashlib,json,os,re,subprocess,xml.etree.ElementTree as ET
          output=Path('build-mips-ci/evidence');output.mkdir(parents=True,exist_ok=True)
          inventory=json.loads(subprocess.check_output(['ctest','--test-dir','build-mips-ci','-C','Release','--show-only=json-v1'],text=True))
          tests=[t for t in inventory['tests'] if len(t.get('command',[]))>2 and Path(t['command'][2]).stem=='neverd-worker-test-server']
          names=[t['name'] for t in tests]
          assert len(names)==20 and 'NeverDWorkerComputedStrings' in names, names
          (output/'worker-inventory.json').write_text(json.dumps(tests,indent=2)+'\n')
          binary=Path('build-mips-ci/bin')/('neverd-worker-test-server.exe' if os.name=='nt' else 'neverd-worker-test-server')
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['EXPECTED_SOURCE_SHA']
          command=['ctest','--test-dir','build-mips-ci','-C','Release','-R','^('+'|'.join(re.escape(n) for n in names)+')$','--parallel','4','--no-tests=error','--output-on-failure','--output-junit',str((output/'worker-results.xml').resolve())]
          receipt={'source_sha':source,'binary_sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),'command':command,'scope':'Complete mock C ABI worker transport group; real worker engine and protocol, not real SDK execution.'}
          (output/'worker-source.json').write_text(json.dumps(receipt,indent=2)+'\n')
          with (output/'worker-ctest.log').open('w') as log: result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=1050)
          cases=list(ET.parse(output/'worker-results.xml').getroot().iter('testcase'))
          actual=Counter(c.get('name') for c in cases);expected=Counter(names)
          failed=[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None]
          skipped=[c.get('name') for c in cases if c.find('skipped') is not None]
          audit={'exit':result.returncode,'total':len(cases),'failed':failed,'skipped':skipped,'missing':list((expected-actual).elements()),'unexpected':list((actual-expected).elements())}
          (output/'worker-outcomes.json').write_text(json.dumps(audit,indent=2)+'\n');print(json.dumps(audit,indent=2))
          assert actual==expected and result.returncode==0 and not failed and not skipped,audit
          PYTHON
      - name: Build complete owning test targets
        timeout-minutes: 125
        run: |
          python scripts/build.py build-mips-ci --config Release --parallel ${{ matrix.parallel }} --target \
            neverd NeverDMIPSTests NeverDMIPSFlowTests NeverDMIPSIntegerTests \
            NeverDMIPSPipelineTests NeverDMIPSSDKTests NeverDSourceEntryBindingTests \
            NeverDHighControlFlowTests NeverDSourceCallABITests NeverDAArch64AuthenticatedCallTests \
            NeverDSourceAnchorTests NeverDTypesTests NeverDSessionCAPITests NeverDSessionLLVMTests
      - name: Audit inventory and execute owners
        timeout-minutes: 90
        run: |
          python - <<'PYTHON'
          from collections import Counter
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          output = Path('build-mips-ci/evidence')
          output.mkdir(parents=True, exist_ok=True)
          owners = ['NeverDMIPSTests', 'NeverDMIPSFlowTests', 'NeverDMIPSIntegerTests',
                    'NeverDMIPSPipelineTests', 'NeverDMIPSSDKTests',
                    'NeverDSourceEntryBindingTests', 'NeverDHighControlFlowTests',
                    'NeverDSourceCallABITests', 'NeverDAArch64AuthenticatedCallTests',
                    'NeverDSourceAnchorTests', 'NeverDTypesTests',
                    'NeverDSessionCAPITests', 'NeverDSessionLLVMTests']
          command = ['ctest', '--test-dir', 'build-mips-ci', '-C', 'Release',
                     '-L', '^(' + '|'.join(owners) + ')$']
          inventory = json.loads(subprocess.check_output(command + ['--show-only=json-v1'], text=True))
          tests = inventory['tests']
          name_to_owner = {}
          counts = Counter()
          for test in tests:
              properties = {item['name']: item['value'] for item in test['properties']}
              matched = set(properties.get('LABELS', [])) & set(owners)
              assert len(matched) == 1, (test['name'], matched)
              owner = matched.pop()
              name_to_owner[test['name']] = owner
              counts[owner] += 1
          assert all(counts[owner] > 0 for owner in owners), counts
          assert len(name_to_owner) == len(tests), 'duplicate CTest identity'
          assert 'TypeJSONFixture.SharedSpellerMatchesOwnedLayouts' in name_to_owner
          assert 'SessionCAPITest.LocalTypePagesKeepQueryChangesIndependent' in name_to_owner
          (output / 'inventory.json').write_text(json.dumps(name_to_owner, indent=2) + '\n')
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          binary_hashes = {}
          for owner in owners:
              binary = Path('build-mips-ci/bin') / (owner + ('.exe' if os.name == 'nt' else ''))
              binary_hashes[owner] = hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
          def version(args):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              return {'exit': result.returncode, 'output': result.stdout}
          compiler_tools = {'cl': ['cl'], 'link': ['link', '/?']} if os.name == 'nt' else {
              'cxx': [os.environ['QUALIFICATION_CXX'], '--version']}
          if platform.system() == 'Linux':
              compiler_tools['libstdcxx'] = ['g++-14', '--version']
          receipt = {
              'source_sha': source, 'expected_source_sha': os.environ['EXPECTED_SOURCE_SHA'],
              'platform': platform.platform(), 'machine': platform.machine(),
              'cpu_count': os.cpu_count(), 'python': sys.version,
              'llvm_mode': 'published prebuilt LLVM', 'configuration': 'Release',
              'scope': 'complete MIPS, shared source ABI, source mapping, type-system and C API/SessionLLVM owners; not the full repository CI profile',
              'owners': dict(counts), 'binary_sha256': binary_hashes,
              'commands': {'inventory': command + ['--show-only=json-v1'],
                           'test': command + ['--parallel', '4', '--no-tests=error', '--output-on-failure',
                                              '--output-junit', str((output / 'results.xml').resolve())]},
              'tools': {name: version(args) for name, args in {
                  **compiler_tools, 'cmake': ['cmake', '--version'],
                  'fixture_clang': [os.environ['NEVERD_SOURCE_CLANG'], '--version']}.items()},
              'submodules': subprocess.check_output(['git', 'submodule', 'status'], text=True)
          }
          (output / 'source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert source == os.environ['EXPECTED_SOURCE_SHA'], source
          with (output / 'ctest.log').open('w') as log:
              result = subprocess.run(receipt['commands']['test'], stdout=log,
                                      stderr=subprocess.STDOUT, timeout=5300)
          cases = list(ET.parse(output / 'results.xml').getroot().iter('testcase'))
          expected_names = Counter(test['name'] for test in tests)
          actual_names = Counter(case.get('name') for case in cases)
          failed = [case.get('name') for case in cases
                    if case.find('failure') is not None or case.find('error') is not None]
          skipped = [case.get('name') for case in cases if case.find('skipped') is not None]
          mips_skipped = [name for name in skipped if name_to_owner[name].startswith('NeverDMIPS')]
          source_anchor_skipped = [name for name in skipped if name_to_owner[name] == 'NeverDSourceAnchorTests']
          type_json_skipped = [name for name in skipped if name.startswith(('TypeJSONFixture.', 'TypeFit.'))]
          local_type_skipped = [name for name in skipped if name.startswith('SessionCAPITest.LocalType')]
          audit = {'exit': result.returncode, 'total': len(cases), 'failed': failed,
                   'skipped': skipped, 'mips_skipped': mips_skipped,
                   'source_anchor_skipped': source_anchor_skipped,
                   'type_json_skipped': type_json_skipped,
                   'local_type_skipped': local_type_skipped,
                   'missing': list((expected_names - actual_names).elements()),
                   'unexpected': list((actual_names - expected_names).elements())}
          (output / 'outcomes.json').write_text(json.dumps(audit, indent=2) + '\n')
          print(json.dumps(audit, indent=2))
          assert actual_names == expected_names, 'incomplete inventory execution'
          assert result.returncode == 0 and not failed and not mips_skipped and not source_anchor_skipped and not type_json_skipped and not local_type_skipped, audit
          PYTHON
      - name: Preserve mock-worker failure after owner diagnostics
        if: always() && steps.mock_worker.outcome == 'failure'
        run: |
          echo "::error::Mock-worker qualification failed; owner diagnostics do not waive it."
          exit 1
      - name: Upload bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mips-native-${{ runner.os }}-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build-mips-ci/evidence/
            build-mips-ci/CMakeCache.txt
            build-mips-ci/neverd-build-receipt.json
            build-mips-ci/neverd-dependency-inputs.json
            build-mips-ci/Testing/Temporary/LastTest.log
            build-mips-ci/Testing/Temporary/LastTestsFailed.log

  render_store_probe:
    if: inputs.scope == 'render-store-probe'
    name: macOS RenderStore timeout diagnosis
    runs-on: macos-15
    timeout-minutes: 55
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact source and pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
      - name: Install matching macOS build and fixture tools
        run: |
          brew install cmake lld ninja llvm@22
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "NEVERD_SOURCE_CLANG=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
      - name: Configure the failing Release profile and build only the mock worker
        run: |
          cmake -S . -B build-mips-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=ON \
            "-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$NEVERD_SOURCE_CLANG"
          python scripts/build.py build-mips-ci --config Release --parallel 3 --target neverd-worker-test-server
      - name: Repeat exact tests and capture a bounded phase diagnostic
        run: |
          cat > build-mips-ci/worker-probe.py <<'PROBE'
          from collections import Counter
          from pathlib import Path
          import datetime, hashlib, json, os, platform, re, shutil, signal, subprocess, sys, time
          import xml.etree.ElementTree as ET

          root=Path.cwd();build=root/'build-mips-ci';output=build/'evidence';output.mkdir(exist_ok=True)
          expected=os.environ['EXPECTED_SOURCE_SHA']
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert re.fullmatch(r'[0-9a-f]{40}',expected) and actual==expected
          command=['ctest','--test-dir',str(build),'-C','Release']
          inventory=json.loads(subprocess.check_output(command+['--show-only=json-v1'],text=True))
          tests=[t for t in inventory['tests'] if len(t.get('command',[]))>2 and Path(t['command'][2]).stem=='neverd-worker-test-server']
          names=[t['name'] for t in tests];assert len(names)==20 and 'NeverDWorkerRenderStore' in names
          (output/'worker-inventory.json').write_text(json.dumps(tests,indent=2)+'\n')
          props={v['name']:v['value'] for t in tests if t['name']=='NeverDWorkerRenderStore' for v in t['properties']}
          assert float(props['TIMEOUT'])==240
          binary=build/'bin/neverd-worker-test-server'
          receipt={'source_sha':actual,'workflow_sha':os.environ['GITHUB_SHA'],'platform':platform.platform(),'machine':platform.machine(),'cpu_count':os.cpu_count(),'python':sys.version,'compiler':subprocess.check_output(['clang++','--version'],text=True),'binary_sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),'harness_sha256':hashlib.file_digest(Path(__file__).open('rb'),'sha256').hexdigest(),'fixture_sha256':{n:hashlib.file_digest((root/'tools/neverd-worker/tests'/n).open('rb'),'sha256').hexdigest() for n in ['render_store_test.py','render_ahead_test.py','transport_test.py']},'source_status':subprocess.check_output(['git','status','--porcelain'],text=True),'scope':'Bounded native macOS diagnosis. Three unmodified isolated runs and two complete parallel4 mock-worker groups; existing240second CTest timeout and NEVERD_THREADS unchanged. Not productionSDK or completeMIPS qualification.'}
          assert not receipt['source_status']
          (output/'probe-source.json').write_text(json.dumps(receipt,indent=2)+'\n')
          results=[]
          def save():
              (output/'probe-results.json').write_text(json.dumps({'updated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':actual,'runs':results,'scope':receipt['scope']},indent=2)+'\n')
          def execute(label,args,limit,xml=None,expected_names=None):
              directory=output/label;directory.mkdir();temporary=directory/'tmp';temporary.mkdir()
              env=dict(os.environ,TMPDIR=str(temporary.resolve()),PYTHONUNBUFFERED='1')
              started=time.monotonic();timeout=False
              with (directory/'run.log').open('w') as log:
                  child=subprocess.Popen(args,env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                  try:code=child.wait(timeout=limit)
                  except subprocess.TimeoutExpired:
                      timeout=True;os.killpg(child.pid,signal.SIGKILL);code=child.wait()
                  finally:
                      # CTest can terminate the Python fixture before it closes its workers.
                      try:os.killpg(child.pid,signal.SIGKILL)
                      except ProcessLookupError:pass
              row={'label':label,'command':args,'exit':code,'outer_timeout':timeout,'wall_seconds':time.monotonic()-started,'temporary_root':str(temporary),'complete_inventory':False}
              if xml and xml.exists():
                  cases=list(ET.parse(xml).getroot().iter('testcase'));actual_names=Counter(c.get('name') for c in cases)
                  row.update({'total':len(cases),'complete_inventory':actual_names==Counter(expected_names),'failed':[c.get('name') for c in cases if c.find('failure') is not None or c.find('error') is not None],'skipped':[c.get('name') for c in cases if c.find('skipped') is not None],'cases':[dict(c.attrib) for c in cases]})
              files=[f for f in temporary.rglob('*') if f.is_file()];row['discarded_temporary_products']={'files':len(files),'logical_bytes':sum(f.stat().st_size for f in files)}
              shutil.rmtree(temporary);results.append(row);save();print(json.dumps({k:v for k,v in row.items() if k not in ['command','cases']},indent=2),flush=True)
              return row
          for i in range(3):
              label=f'isolated-{i+1}';xml=output/(label+'.xml')
              execute(label,command+['-R','^NeverDWorkerRenderStore$','--parallel','1','--no-tests=error','--output-on-failure','--output-junit',str(xml)],310,xml,['NeverDWorkerRenderStore'])
          for i in range(2):
              label=f'complete-group-{i+1}';xml=output/(label+'.xml')
              execute(label,command+['-R','^('+'|'.join(re.escape(n) for n in names)+')$','--parallel','4','--no-tests=error','--output-on-failure','--output-junit',str(xml)],1050,xml,names)
          # A diagnostic-only longer run can locate the time spent; it cannot turn an
          # original240second failure into a qualifying pass. No production test is edited.
          if any(r['exit'] or r['outer_timeout'] or not r['complete_inventory'] or (r['label'].startswith('isolated') and r['wall_seconds']>210) for r in results):
              trace=output/'trace-render-store.py'
              trace.write_text('''from pathlib import Path
          import faulthandler,json,sys,time
          sys.path.insert(0,str(Path.cwd()/"tools/neverd-worker/tests"))
          import render_store_test as target
          start=time.monotonic()
          def emit(event,**data):print(json.dumps({"event":event,"elapsed":time.monotonic()-start,**data}),flush=True)
          original_session=target.session
          original_end=target.end
          def session(*args,**kwargs):
              name=Path(args[2]).name
              emit("session.begin",fixture=name,mode=kwargs.get("store",args[3] if len(args)>3 else "write"))
              result=original_session(*args,**kwargs)
              emit("session.ready",fixture=name)
              return result
          def end(*clients):
              emit("close.begin",clients=len(clients))
              result=original_end(*clients)
              emit("close.end",clients=len(clients))
              return result
          target.session=session;target.end=end
          faulthandler.dump_traceback_later(60,repeat=True)
          try:
              target.run(Path(sys.argv[1]))
              emit("completed")
          finally:faulthandler.cancel_dump_traceback_later()
          ''')
              execute('instrumented-diagnostic',[sys.executable,str(trace),str(binary)],600)
          original=results[:5]
          assert len(original)==5 and all(r['exit']==0 and not r['outer_timeout'] and r['complete_inventory'] and not r.get('failed') and not r.get('skipped') for r in original), 'Original fixture/group failure reproduced; see complete artifacts, diagnostic run does not waive it.'
          PROBE
          python build-mips-ci/worker-probe.py
      - name: Upload only diagnostic evidence and configuration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mips-render-store-probe-${{ inputs.source_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build-mips-ci/evidence/
            build-mips-ci/worker-probe.py
            build-mips-ci/CMakeCache.txt
            build-mips-ci/neverd-build-receipt.json
            build-mips-ci/neverd-dependency-inputs.json

  render_store_profile:
    if: inputs.scope == 'render-store-profile'
    name: macOS RenderStore phase and wait profile
    runs-on: macos-15
    timeout-minutes: 35
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Verify exact source and pinned dependencies
      run: |
        test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
        git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
    - name: Install matching macOS build and fixture tools
      run: |
        brew install cmake lld ninja llvm@22
        echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
        echo "NEVERD_SOURCE_CLANG=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
    - name: Configure the failing Release profile and build only the mock worker
      run: |
        cmake -S . -B build-mips-ci -G Ninja \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
          -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF \
          -DNEVERD_ENABLE_SEMANTIC_TESTS=ON \
          "-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$NEVERD_SOURCE_CLANG"
        python scripts/build.py build-mips-ci --config Release --parallel 3 --target neverd-worker-test-server
    - name: Record native phase samples and fixture sleep calibration
      run: |
        cat > build-mips-ci/worker-phase-profile.py <<'PROFILE'
        from pathlib import Path
        import datetime
        import hashlib
        import json
        import os
        import platform
        import resource
        import shutil
        import signal
        import subprocess
        import sys
        import time
  
        root = Path.cwd()
        build = root / "build-mips-ci"
        out = build / "evidence"
        out.mkdir(exist_ok=True)
        binary = build / "bin/neverd-worker-test-server"
        expected = os.environ["EXPECTED_SOURCE_SHA"]
        actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        assert actual == expected
        assert not subprocess.check_output(["git", "status", "--porcelain"], text=True)
        digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
        identity = {
            "utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source_sha": actual,
            "workflow_sha": os.environ["GITHUB_SHA"],
            "platform": platform.platform(),
            "cpu_count": os.cpu_count(),
            "python": sys.version,
            "compiler": subprocess.check_output(["clang++", "--version"], text=True),
            "binary_sha256": digest(binary),
            "script_sha256": digest(Path(__file__)),
            "fixture_sha256": {
                name: digest(root / "tools/neverd-worker/tests" / name)
                for name in ["render_store_test.py", "render_ahead_test.py", "transport_test.py", "mock_engine.cpp"]
            },
            "scope": "Diagnostic only. Unmodified RenderStore assertions observed with heartbeat phase logs and native thread sampling; the 600-second outer observation does not qualify the original 240-second CTest. No production scheduling or fixture sleep changes.",
        }
        (out / "profile-source.json").write_text(json.dumps(identity, indent=2) + "\n")
  
        calibration = out / "sleep-calibration.cpp"
        calibration.write_text(r'''#include <chrono>
        #include <cstdio>
        #include <thread>
        int main() {
          using Clock = std::chrono::steady_clock;
          std::puts("[");
          for (int i = 0; i < 150; ++i) {
            const auto start = Clock::now();
            std::this_thread::sleep_for(std::chrono::milliseconds(20));
            std::printf("%.9f%s\n", std::chrono::duration<double>(Clock::now() - start).count(), i == 149 ? "" : ",");
          }
          std::puts("]");
        }
        ''')
        calibration_binary = build / "sleep-calibration"
        subprocess.run(["clang++", "-std=c++20", "-O3", str(calibration), "-o", str(calibration_binary)], check=True, timeout=60)
        calibration_results = []
        try:
            for index in range(3):
                started = time.monotonic()
                result = subprocess.run([str(calibration_binary)], capture_output=True, text=True, timeout=90, check=True)
                values = json.loads(result.stdout)
                assert len(values) == 150 and all(value >= 0 for value in values)
                calibration_results.append({"trial": index, "wall_seconds": time.monotonic() - started, "requested_sleep_seconds": 0.02, "observed_seconds": values})
                (out / "sleep-calibration.json").write_text(json.dumps(calibration_results, indent=2) + "\n")
        finally:
            if calibration_binary.exists():
                identity["removed_calibration_binary"] = {"sha256": digest(calibration_binary), "bytes": calibration_binary.stat().st_size}
                calibration_binary.unlink()
            (out / "profile-source.json").write_text(json.dumps(identity, indent=2) + "\n")
  
        wrapper = out / "trace-render-phases.py"
        wrapper.write_text(r'''from pathlib import Path
        import faulthandler,json,subprocess,sys,time
        sys.path.insert(0,str(Path.cwd()/"tools/neverd-worker/tests"))
        import render_store_test as target
        from transport_test import Client
        start=time.monotonic()
        out=Path(sys.argv[2]);sampler=None;sample_log=None
        def emit(event,**data):
            print(json.dumps({"event":event,"elapsed":time.monotonic()-start,**data}),flush=True)
        original_session=target.session
        original_end=target.end
        original_next=Client.next
        def next_message(self,*args,**kwargs):
            message=original_next(self,*args,**kwargs)
            if message.get("type")=="heartbeat":
                emit("heartbeat",pid=self.process.pid,background=message.get("background"))
            return message
        def session(*args,**kwargs):
            global sampler,sample_log
            name=Path(args[2]).name
            emit("session.begin",fixture=name)
            result=original_session(*args,**kwargs)
            emit("session.ready",fixture=name,owner=result[0].process.pid,replica=result[1].process.pid)
            if sampler is None:
                sample_log=(out/"sample-command.log").open("w")
                command=["/usr/bin/sample",str(result[1].process.pid),"20","5","-mayDie","-file",str(out/"worker-native-sample.txt")]
                emit("sample.begin",command=command)
                sampler=subprocess.Popen(command,stdout=sample_log,stderr=subprocess.STDOUT)
            return result
        def end(*clients):
            emit("close.begin",clients=[client.process.pid for client in clients])
            result=original_end(*clients)
            emit("close.end")
            return result
        target.session=session;target.end=end;Client.next=next_message
        faulthandler.dump_traceback_later(60,repeat=True)
        try:
            target.run(Path(sys.argv[1]))
            emit("completed")
        finally:
            faulthandler.cancel_dump_traceback_later()
            if sampler is not None:
                try: code=sampler.wait(timeout=30)
                except subprocess.TimeoutExpired:
                    sampler.kill();code=sampler.wait()
                emit("sample.end",exit=code)
                sample_log.close()
        ''')
        temporary = build / "profile-tmp"
        temporary.mkdir()
        started = time.monotonic()
        before = resource.getrusage(resource.RUSAGE_CHILDREN)
        timed_out = False
        code = None
        try:
            with (out / "phase-profile.log").open("w") as log:
                child = subprocess.Popen([sys.executable, str(wrapper), str(binary), str(out)], env=dict(os.environ, TMPDIR=str(temporary), PYTHONUNBUFFERED="1"), stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                try:
                    code = child.wait(timeout=600)
                except subprocess.TimeoutExpired:
                    timed_out = True
                    os.killpg(child.pid, signal.SIGKILL)
                    code = child.wait()
                finally:
                    try:
                        os.killpg(child.pid, signal.SIGKILL)
                    except ProcessLookupError:
                        pass
        finally:
            after = resource.getrusage(resource.RUSAGE_CHILDREN)
            files = [path for path in temporary.rglob("*") if path.is_file()]
            cleanup = {"files": len(files), "logical_bytes": sum(path.stat().st_size for path in files)}
            shutil.rmtree(temporary)
            (out / "profile-results.json").write_text(json.dumps({"exit": code, "outer_timeout": timed_out, "wall_seconds": time.monotonic() - started, "all_children_including_sampler_user_seconds": after.ru_utime - before.ru_utime, "all_children_including_sampler_system_seconds": after.ru_stime - before.ru_stime, "removed_temporary_products": cleanup, "scope": identity["scope"]}, indent=2) + "\n")
            (out / "profile-source.json").write_text(json.dumps(identity, indent=2) + "\n")
        assert code == 0 and not timed_out
        assert (out / "worker-native-sample.txt").stat().st_size > 0
        PROFILE
        python build-mips-ci/worker-phase-profile.py
    - name: Upload only diagnostic evidence and configuration
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mips-render-store-profile-${{ inputs.source_sha }}
        retention-days: 7
        if-no-files-found: error
        path: |
          build-mips-ci/evidence/
          build-mips-ci/worker-phase-profile.py
          build-mips-ci/CMakeCache.txt
          build-mips-ci/neverd-build-receipt.json
          build-mips-ci/neverd-dependency-inputs.json
