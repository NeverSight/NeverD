name: Semantic fixture linkage qualification (temporary)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate source
        required: true
        type: string
      baseline_sha:
        description: Exact baseline source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: semantic-link-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  qualify:
    name: ${{ matrix.runner }} semantic fixture linkage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - runner: macos-15
            cc: clang
            cxx: clang++
          - runner: windows-latest
            cc: cl
            cxx: cl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qualification
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Linux tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 llvm-18 lld-18 cmake ninja-build gcc-multilib g++-14 zlib1g-dev
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"
      - name: Install macOS tooling
        if: runner.os == 'macOS'
        run: |
          brew install cmake lld ninja llvm@22
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Install Windows tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja --yes --no-progress
          ./source/scripts/ci/Install-WindowsFixtureClang.ps1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Compare baseline and candidate owner
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          PROBE_CC: ${{ matrix.cc }}
          PROBE_CXX: ${{ matrix.cxx }}
        run: python qualification/scripts/qualify_semantic_link.py source evidence
      - name: Preserve exact-source diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-link-${{ runner.os }}-${{ inputs.source_sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
