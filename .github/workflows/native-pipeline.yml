name: Native pipeline compatibility

on:
  workflow_dispatch:
  push:
    branches: [dev, codex/pipeline-performance, codex/performance-libraries]
    paths:
      - '.github/workflows/native-pipeline.yml'
      - 'lib/ir/med/abi/**'
      - 'lib/backend/c/LLVMC/LLVMCStmtWriter.cpp'
      - 'unittests/lift/core/LLVMCValueTests.cpp'
      - 'tools/neverd-worker/tests/call_site_types_test.py'
      - 'lib/ir/high/**'
      - 'lib/libc/**'
      - 'lib/loader/ObjectExterns.cpp'
      - 'lib/ir/low/CFGBuilderInsn.cpp'
      - 'lib/pipeline/PipelineReturnContracts.cpp'
      - 'unittests/lift/core/ReturnContractTests.cpp'
      - 'unittests/lift/CMakeLists.txt'
      - 'unittests/libc/**'
      - 'unittests/lift/core/High*Tests.cpp'
      - 'lib/safety/StackSlotFlow.h'
      - 'unittests/lift/core/MedCallingConvTests.cpp'
      - 'unittests/lift/core/FPParameterMaskTests.cpp'
      - 'unittests/PipelineOutcomeTests.cpp'
      - 'unittests/SessionFunctionDiscoveryTests.cpp'
      - 'lib/sdk/capi/**'
      - 'tools/neverd-worker/tests/native_mapping_test.py'
      - 'cmake/NeverDPerformance.cmake'
      - 'cmake/NeverDForks*'
      - '.gitmodules'
      - 'third_party/forks.json'
      - 'third_party/capstone'
      - 'third_party/highway'
      - 'third_party/simdutf'
      - 'third_party/simdjson'
      - 'third_party/oneTBB'
      - 'third_party/mimalloc'
      - 'cmake/NeverDMimalloc.cmake'
      - 'scripts/build.py'
      - 'scripts/fork_dependencies.py'
      - 'scripts/tests/test_fork_dependencies.py'
      - 'include/neverd/support/ByteScan.h'
      - 'include/neverd/support/Parallel.h'
      - 'lib/support/**'
      - 'tools/common/transport/**'
      - 'unittests/acceleration/**'
      - 'unittests/TextEncodingTests.cpp'
  pull_request:
    paths:
      - '.github/workflows/native-pipeline.yml'
      - 'lib/ir/med/abi/**'
      - 'lib/backend/c/LLVMC/LLVMCStmtWriter.cpp'
      - 'unittests/lift/core/LLVMCValueTests.cpp'
      - 'tools/neverd-worker/tests/call_site_types_test.py'
      - 'lib/ir/high/**'
      - 'lib/libc/**'
      - 'lib/loader/ObjectExterns.cpp'
      - 'lib/ir/low/CFGBuilderInsn.cpp'
      - 'lib/pipeline/PipelineReturnContracts.cpp'
      - 'unittests/lift/core/ReturnContractTests.cpp'
      - 'unittests/lift/CMakeLists.txt'
      - 'unittests/libc/**'
      - 'unittests/lift/core/High*Tests.cpp'
      - 'lib/safety/StackSlotFlow.h'
      - 'unittests/lift/core/MedCallingConvTests.cpp'
      - 'unittests/lift/core/FPParameterMaskTests.cpp'
      - 'unittests/PipelineOutcomeTests.cpp'
      - 'unittests/SessionFunctionDiscoveryTests.cpp'
      - 'lib/sdk/capi/**'
      - 'tools/neverd-worker/tests/native_mapping_test.py'
      - 'cmake/NeverDPerformance.cmake'
      - 'cmake/NeverDForks*'
      - '.gitmodules'
      - 'third_party/forks.json'
      - 'third_party/capstone'
      - 'third_party/highway'
      - 'third_party/simdutf'
      - 'third_party/simdjson'
      - 'third_party/oneTBB'
      - 'third_party/mimalloc'
      - 'cmake/NeverDMimalloc.cmake'
      - 'scripts/build.py'
      - 'scripts/fork_dependencies.py'
      - 'scripts/tests/test_fork_dependencies.py'
      - 'include/neverd/support/ByteScan.h'
      - 'include/neverd/support/Parallel.h'
      - 'lib/support/**'
      - 'tools/common/transport/**'
      - 'unittests/acceleration/**'
      - 'unittests/TextEncodingTests.cpp'

permissions:
  contents: read

concurrency:
  group: native-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS arm64
            runner: macos-15
            cc: clang
            cxx: clang++
          - name: Windows x64 MSVC
            runner: windows-2025-vs2026
            cc: cl
            cxx: cl
          - name: Windows x64 clang-cl
            runner: windows-2025-vs2026
            cc: clang-cl
            cxx: clang-cl
    env:
      SCCACHE_GHA_ENABLED: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize the pinned decoder
        run: git submodule update --init --depth 1 third_party/capstone
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.16.0
        with:
          version: v0.16.0
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja lld
      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Verify the decoder's public contracts and buffer bounds
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sanitize=ON
          if [ "$RUNNER_OS" = Windows ]; then sanitize=OFF; fi
          cmake -S third_party/capstone -B build-capstone-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCAPSTONE_ARCHITECTURE_DEFAULT=OFF -DCAPSTONE_X86_SUPPORT=ON \
            -DCAPSTONE_ARM_SUPPORT=ON -DCAPSTONE_AARCH64_SUPPORT=ON \
            -DCAPSTONE_BUILD_CSTEST=ON -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_LEGACY_TESTS=OFF -DCAPSTONE_BUILD_MACOS_THIN=ON \
            -DENABLE_ASAN="$sanitize"
          python - <<'PY'
          from collections import Counter
          import json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          build = Path('build-capstone-core')
          command = ['ctest', '--test-dir', str(build), '-R', '^unit_']
          inventory = json.loads(subprocess.check_output(command + ['--show-only=json-v1'], text=True))
          names = [test['name'] for test in inventory['tests']]
          assert len(names) >= 83 and len(names) == len(set(names))
          assert {'unit_mcinst', 'unit_x86_buffer_bounds', 'unit_x86_far_immediate_encoding'} <= set(names)
          # CTest also registers Python tests, whose names are not build targets.
          # Build the configured decoder suite, then audit every discovered test.
          subprocess.run(['cmake', '--build', str(build), '--parallel', '3'], check=True)
          subprocess.run(command + ['--no-tests=error', '--output-on-failure', '--output-junit', 'results.xml'], check=True)
          cases = list(ET.parse(build / 'results.xml').getroot().iter('testcase'))
          assert Counter(case.get('name') for case in cases) == Counter(names)
          # This one native fault oracle requires x86-64 POSIX (see Capstone's
          # tests/unit/x86_x87_environment_hardware.c). Keep it required on
          # native x64 POSIX, and never count its explicit absence as a pass.
          unavailable_x87_host = (os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']) in {
              ('macOS', 'ARM64'), ('Linux', 'ARM64'), ('Windows', 'X64'), ('Windows', 'ARM64')}
          skipped = 0
          for case in cases:
              assert not any(child.tag in {'failure', 'error'} for child in case)
              missing = case.find('skipped')
              if missing is None:
                  assert case.get('status') == 'run'
                  continue
              assert unavailable_x87_host and case.get('name') == 'unit_x86_x87_environment_hardware'
              assert case.get('status') == 'notrun' and missing.get('message') == 'SKIP_RETURN_CODE=77'
              assert case.findtext('system-out', '').strip() == 'SKIP: x87 execution requires an x86-64 POSIX host'
              skipped += 1
          (build / 'source.txt').write_text(subprocess.check_output(['git', '-C', 'third_party/capstone', 'rev-parse', 'HEAD'], text=True))
          print(f'Capstone: {len(cases) - skipped} passed, zero failed, {skipped} explicitly unavailable native-x87 tests')
          subprocess.run(['ctest', '--test-dir', str(build), '-R', '^integration_py_cstest$',
                          '--no-tests=error', '--output-on-failure',
                          '--output-junit', 'cstest-integration.xml'], check=True)
          traversal = list(ET.parse(build / 'cstest-integration.xml').getroot().iter('testcase'))
          assert len(traversal) == 1 and traversal[0].get('name') == 'integration_py_cstest'
          assert traversal[0].get('status') == 'run' and not any(
              child.tag in {'failure', 'error', 'skipped'} for child in traversal[0])
          decoder = build / 'suite/cstest' / ('cstest.exe' if os.name == 'nt' else 'cstest')
          details = subprocess.run([str(decoder), 'third_party/capstone/tests/details/arm.yaml',
                                    'third_party/capstone/tests/details/aarch64.yaml'],
                                   stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                                   encoding='utf-8', errors='replace', timeout=180)
          (build / 'arm-details.log').write_text(details.stdout, encoding='utf-8')
          counts = {key: int(value) for key, value in re.findall(
              r'^\s*(Valid files|Invalid files|Errors|Total|Successful|Skipped|Failed):\s*(\d+)\s*$',
              details.stdout, re.M)}
          (build / 'arm-details.json').write_text(json.dumps(counts, indent=2) + '\n')
          assert details.returncode == 0, details.stdout
          assert counts['Valid files'] == 2 and counts['Total'] >= 2, counts
          assert counts['Successful'] == counts['Total'], counts
          assert all(counts[key] == 0 for key in ('Invalid files', 'Errors', 'Skipped', 'Failed')), counts
          print(f"ARM/ARM64 details: {counts['Successful']} passed, zero failed, zero skipped")
          PY
      - name: Configure native pipeline, SDK and worker
        run: |
          cmake -S . -B build-abi -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_WORKER=ON \
            -DNEVERD_TEST_EXPECT_MIMALLOC=ON -DNEVERD_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERD_ENABLE_WEB_ANALYSIS=OFF -DNEVERD_ENABLE_CPU_EMULATION=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF
      - name: Build production and complete focused test owners
        run: |
          python scripts/build.py build-abi --parallel 4 --target \
            neverd neverd-worker NeverDAllocatorTests NeverDSessionFunctionDiscoveryTests \
            NeverDFPParameterMaskTests NeverDPipelineOutcomeTests NeverDSupportThreadTests NeverDLibCTests NeverDReturnContractTests \
            NeverDX86NativeStateAuditTests NeverDX86LegacyAlignedMoveTests \
            NeverDX86UndefinedEffectsTests \
            NeverDHighControlFlowTests NeverDAccelerationTests \
            NeverDStringScanTests NeverDTextEncodingTests \
            NeverDPythonRuntimeTests NeverDPythonPluginTests
      - name: Require every focused C++ case to execute and pass
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from scripts.run_lift_qualification import audit
          output = Path('build-abi/evidence')
          output.mkdir(parents=True, exist_ok=True)
          cache = Path('build-abi/CMakeCache.txt').read_text()
          for provider in ('MIMALLOC', 'HIGHWAY', 'SIMDUTF', 'SIMDJSON', 'TBB'):
              assert f'NEVERD_ENABLE_{provider}:BOOL=ON' in cache, provider
          suffix = '.exe' if os.name == 'nt' else ''
          # The stderr descriptor checks are compiled only on their hosts.
          pipeline_minimum = 40 + (os.name != 'nt') + (sys.platform == 'linux')
          for owner, minimum in (('NeverDFPParameterMaskTests', 180),
                                  ('NeverDLibCTests', 71),
                                  ('NeverDReturnContractTests', 21),
                                  ('NeverDPipelineOutcomeTests', pipeline_minimum),
                                  ('NeverDX86NativeStateAuditTests', 8),
                                  ('NeverDX86LegacyAlignedMoveTests', 7),
                                  ('NeverDX86UndefinedEffectsTests', 52),
                                  ('NeverDSupportThreadTests', 11),
                                  ('NeverDHighControlFlowTests', 420),
                                  ('NeverDAccelerationTests', 18),
                                  ('NeverDStringScanTests', 17),
                                  ('NeverDTextEncodingTests', 3),
                                  ('NeverDPythonRuntimeTests', 7),
                                  ('NeverDPythonPluginTests', 3)):
              binary = Path('build-abi/bin') / (owner + suffix)
              listed = subprocess.check_output([str(binary), '--gtest_list_tests'], text=True)
              (output / (owner + '.inventory.txt')).write_text(listed)
              names, suite = [], ''
              for line in listed.splitlines():
                  value = line.split(' #', 1)[0].strip()
                  if line and not line.startswith(' ') and value.endswith('.'):
                      suite = value
                  elif line.startswith('  ') and suite:
                      names.append(suite + value.split()[0])
              assert len(names) >= minimum, (owner, len(names), minimum)
              assert len(set(names)) == len(names), (owner, 'duplicate test identity')
              if owner == 'NeverDPipelineOutcomeTests':
                  for name, supported in (
                      ('ClosedStderrPreservesNativeResult', os.name != 'nt'),
                      ('FullStderrPreservesNativeResult', sys.platform == 'linux'),
                  ):
                      assert (('PipelineStageTrace.' + name) in names) == supported
              if owner == 'NeverDFPParameterMaskTests':
                  for name in ('FrameLocalLeafSummaryKeepsDefinitionIdentityAndDepth',
                               'FrameLocalLeafSummaryDoesNotReuseAnotherFunctionOrInvocation'):
                      assert 'MedABIPass.' + name in names
              if owner == 'NeverDAccelerationTests':
                  # The small-batch stack contract moved from support tests
                  # to the scheduler owner; retain its explicit coverage.
                  assert 'TaskScheduler.SmallAndSerialBatchesRetainTheWorkerStackContract' in names
              xml = output / (owner + '.xml')
              with (output / (owner + '.log')).open('w') as log:
                  result = subprocess.run([str(binary), '--gtest_output=xml:' + str(xml)],
                                          stdout=log, stderr=subprocess.STDOUT, timeout=300)
              report = audit(ET.parse(xml).getroot(), names, result.returncode)
              (output / (owner + '.json')).write_text(json.dumps(report, indent=2) + '\n')
              print(f'{owner}: {len(names)} passed, zero failed, zero skipped')
          PY
      - name: Verify actual SDK allocation and native worker requests
        run: |
          cat > build-abi/verify-sdk-worker.py <<'PY'
          from collections import Counter
          import json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names = ['NeverDAllocatorTests', 'NeverDWorkerNativeMapping',
                   'NeverDWorkerNativeMakeCode', 'NeverDWorkerPEBrowse',
                   'NeverDWorkerRealEngine', 'NeverDWorkerUnicodePaths',
                   'NeverDWorkerCallSiteTypes',
                   'SessionFunctionDiscovery.NativeDiscoveryBeforeAnalysisPublishesRecoveredExtents',
                   'SessionFunctionDiscovery.NativeRecoveryKeepsKnownExtentsAndDeletedEntries']
          if os.name == 'nt':
              names.append('NeverDAllocatorRedirectDisabled')
          command = ['ctest', '--test-dir', 'build-abi', '-C', 'Release',
                     '-R', '^(' + '|'.join(re.escape(name) for name in names) + ')$']
          inventory = json.loads(subprocess.check_output(command + ['--show-only=json-v1'], text=True))
          assert Counter(test['name'] for test in inventory['tests']) == Counter(names)
          output = Path('build-abi') / os.environ.get('NEVERD_NATIVE_EVIDENCE', 'evidence')
          output.mkdir(parents=True, exist_ok=True)
          xml = (output / 'integration.xml').resolve()
          with (output / 'integration.log').open('w') as log:
              result = subprocess.run(command + ['--no-tests=error', '--output-on-failure',
                                                  '--output-junit', str(xml)],
                                      stdout=log, stderr=subprocess.STDOUT, timeout=600)
          cases = list(ET.parse(xml).getroot().iter('testcase'))
          assert Counter(case.get('name') for case in cases) == Counter(names)
          assert result.returncode == 0
          assert all(case.get('status') == 'run' and
                     not any(child.tag in {'failure', 'error', 'skipped'} for child in case)
                     for case in cases)
          print(f'SDK/worker: {len(cases)} passed, zero failed, zero skipped')
          PY
          python build-abi/verify-sdk-worker.py
          cp build-abi/CMakeCache.txt build-abi/evidence/CMakeCache.txt
      - name: Retain default dependency snapshot
        run: cp build-abi/neverd-*.json build-abi/evidence/
      - name: Repeat native contracts with native threads
        run: |
          cmake -S . -B build-abi -DNEVERD_ENABLE_TBB=OFF
          python scripts/build.py build-abi --parallel 4 --target \
            neverd neverd-worker NeverDAllocatorTests NeverDSessionFunctionDiscoveryTests \
            NeverDFPParameterMaskTests NeverDPipelineOutcomeTests NeverDSupportThreadTests NeverDLibCTests NeverDReturnContractTests \
            NeverDX86NativeStateAuditTests NeverDX86LegacyAlignedMoveTests \
            NeverDX86UndefinedEffectsTests \
            NeverDHighControlFlowTests NeverDAccelerationTests \
            NeverDStringScanTests NeverDTextEncodingTests \
            NeverDPythonRuntimeTests NeverDPythonPluginTests
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          suffix = '.exe' if os.name == 'nt' else ''
          for previous in sorted(Path('build-abi/evidence').glob('NeverD*Tests.json')):
              expected = json.loads(previous.read_text())['tests']
              output = Path('build-abi/evidence-native') / previous.stem
              if previous.stem == 'NeverDAccelerationTests':
                  tbb_only = {'TaskScheduler.ForeignWorkersBeforeFirstBatch',
                              'TaskScheduler.ForeignSerialLimitStillCompletes',
                              'TaskScheduler.LargeCallerReusesAvailableHeadroom'}
                  assert tbb_only <= set(expected)
                  expected = sorted(set(expected) - tbb_only)
              minimum = len(expected)
              subprocess.run(['python', 'unittests/acceleration/verify.py',
                              'build-abi/bin/' + previous.stem + suffix, str(output),
                              '--minimum', str(minimum), '--timeout', '300'], check=True)
              actual = json.loads((output / 'audit.json').read_text())['tests']
              assert set(expected) == set(actual), previous.stem
          PY
          NEVERD_NATIVE_EVIDENCE=evidence-native python build-abi/verify-sdk-worker.py
          cp build-abi/CMakeCache.txt build-abi/evidence-native/CMakeCache.txt
          cp build-abi/neverd-*.json build-abi/evidence-native/
      - name: Retain native results and configuration
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-pipeline-${{ matrix.name }}-${{ github.sha }}
          path: |
            build-capstone-core/CMakeCache.txt
            build-capstone-core/source.txt
            build-capstone-core/results.xml
            build-capstone-core/cstest-integration.xml
            build-capstone-core/arm-details.log
            build-capstone-core/arm-details.json
            build-capstone-core/Testing/Temporary/LastTest.log
            build-abi/evidence
            build-abi/evidence-native
            build-abi/CMakeCache.txt
            build-abi/neverd-*.json
          if-no-files-found: warn
