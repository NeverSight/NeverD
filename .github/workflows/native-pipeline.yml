name: Native scalar instruction table qualification
run-name: Scalar instruction tables at deb8e70d903b78932d7872729e1511685585b9be
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Scalar lifters on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cc: clang-18, cxx: clang++-18}
          - {os: macos-15, cc: clang, cxx: clang++}
          - {os: windows-latest, cc: clang-cl, cxx: clang-cl}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: deb8e70d903b78932d7872729e1511685585b9be
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check the source revision and initialize test dependencies
        run: |
          test "$(git rev-parse HEAD)" = "deb8e70d903b78932d7872729e1511685585b9be"
          git submodule update --init --depth 1 third_party/capstone third_party/unicorn signatures
      - name: Install Linux fixture compilers
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key --output "$RUNNER_TEMP/llvm.asc"
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | grep '^fpr:.*6084F3CF814B57C1CF12EFD515CF4D18AF4F7421:'
          sudo install -m 0644 "$RUNNER_TEMP/llvm.asc" /usr/share/keyrings/neverd-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/neverd-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/neverd-llvm.list
          sudo apt-get update -qq
          sudo apt-get install --yes clang-18 clang-23 libclang-rt-23-dev lld-23 llvm-23 ninja-build g++-14 gcc-multilib
          echo /usr/lib/llvm-23/bin >> "$GITHUB_PATH"
      - if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install ninja lld llvm@22
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/Install-WindowsFixtureClang.ps1 -AddToPath
      - name: Build the production CLI and scalar lifter tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=('-DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14')
          elif [[ "$RUNNER_OS" == macOS ]]; then
            args+=("-DNEVERD_SOURCE_PATCH_TEST_CLANG_EXECUTABLE=$(brew --prefix llvm@22)/bin/clang")
          else
            args+=("-DNEVERD_ARM64E_TEST_CLANG_EXECUTABLE=$(cygpath -m "$NEVERD_SOURCE_CLANG")")
          fi
          cmake -S . -B build-forms -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_ENABLE_SEMANTIC_TESTS=ON \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_WEB_ANALYSIS=OFF "${args[@]}"
          python scripts/build.py build-forms --config Release --parallel 4 --target \
            neverd NeverDLiftTests NeverDMIPSFlowTests NeverDMIPSIntegerTests \
            NeverDX86APXSetccTests NeverDX86APXCFCmovTests NeverDX86APXNddCMovTests
      - name: Run the scalar lifter suites on this host
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/neverd.txt
          git rev-parse HEAD:third_party/llvm-project > evidence/llvm.txt
          python - <<'PY'
          from pathlib import Path
          from scripts.run_gtest_qualification import run
          import os
          cache = Path("build-forms/CMakeCache.txt").read_text()
          llvm_dir = next(v.split("=",1)[1] for v in cache.splitlines() if v.startswith("LLVM_DIR:PATH="))
          sdk = (Path(llvm_dir).parents[2] / "BUILDINFO.txt").read_text()
          assert "llvm_commit: " + Path("evidence/llvm.txt").read_text().strip() in sdk
          Path("evidence/BUILDINFO.txt").write_text(sdk)
          select = "ARM32_Logic.*:ARM32_Mem.*:AArch64_Mem.*:X86_32_Setcc.*:X86_64_SetccCmov.*:MedSEHHandlerEntry.ARMRegisterZeroHoldsTheExceptionCode:MedSEHHandlerEntry.AJoinTakesWhatTheUnwinderLeftFromTheHandler"
          jobs = [("NeverDMIPSFlowTests","*",25),("NeverDMIPSIntegerTests","*",100),
                  ("NeverDX86APXSetccTests","*",3),("NeverDX86APXCFCmovTests","*",3),
                  ("NeverDX86APXNddCMovTests","*",3),("NeverDLiftTests",select,35)]
          exe = ".exe" if os.name == "nt" else ""
          for owner, pattern, minimum in jobs:
              result = run(Path("build-forms/bin",owner+exe),Path("evidence",owner+".xml"),pattern,minimum,1800)
              if owner == "NeverDLiftTests":
                  assert "AArch64_Mem.UnprivilegedTransfersUseTheirEncodedWidths" in result["outcome"]["tests"]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: '${{ !cancelled() }}'
        with:
          name: scalar-forms-${{ runner.os }}
          path: evidence
          if-no-files-found: warn
