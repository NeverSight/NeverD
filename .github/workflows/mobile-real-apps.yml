name: Mobile Real Applications

# GitHub gives workflow_run read-only access to default-branch caches. Keep
# third-party app builds out of push/workflow_dispatch cache-write contexts.
# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#cache-access-for-low-trust-workflow-triggers
# Schedule every required manifest case; the historical baseline never filters
# execution. Missing implementation and qualification evidence still fail.
on:
  workflow_run:
    workflows: [Mobile Decompilation]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: mobile-real-apps-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Verify the upstream run identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      consumer_commit: ${{ steps.source.outputs.consumer_commit }}
      producer_run_id: ${{ steps.source.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.source.outputs.producer_run_attempt }}
      producer_conclusion: ${{ steps.source.outputs.producer_conclusion }}
    steps:
      # workflow_run's github.sha names trusted default-branch code. Only this
      # verifier runs before the event and REST source identity are reconciled.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bind this run to the exact trusted dev revision and attempt
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/mobile_real_apps_trigger.py \
            --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/mobile-trigger.json"
      - name: Preserve the verified trigger identity
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-trigger
          path: ${{ runner.temp }}/mobile-trigger.json
          if-no-files-found: error
          retention-days: 14

  producer:
    name: Require the upstream regression result
    needs: trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A valid failed upstream run can still collect diagnostic app evidence.
      # Its failure is an independent required prerequisite of the final gate.
      - env:
          PRODUCER_CONCLUSION: ${{ needs.trigger.outputs.producer_conclusion }}
        run: test "$PRODUCER_CONCLUSION" = success

  guards:
    name: Acceptance integrity
    needs: trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      ios_matrix: ${{ steps.matrix.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate every required case from the pinned manifest
        id: matrix
        run: python scripts/mobile_real_apps_matrix.py --manifest scripts/mobile_real_apps.json --github-output "$GITHUB_OUTPUT"
      - name: Check omissions, partial output, provenance and behavior mutations
        run: |
          python -m unittest \
            scripts.tests.test_mobile_real_apps_android \
            scripts.tests.test_mobile_real_apps_android_build \
            scripts.tests.test_mobile_real_apps_android_recompile \
            scripts.tests.test_mobile_real_apps_common \
            scripts.tests.test_mobile_real_apps_ios \
            scripts.tests.test_mobile_swift_toolchain \
            scripts.tests.test_mobile_ios_sdk_declarations \
            scripts.tests.test_mobile_real_apps_objc_inventory \
            scripts.tests.test_mobile_real_apps_matrix \
            scripts.tests.test_mobile_real_apps_trigger \
            scripts.tests.test_mobile_release_gate \
            scripts.tests.test_mobile_ios_backend -v
      - name: Check documentation and localized mobile support contracts
        if: ${{ !cancelled() }}
        run: python scripts/check_docs_i18n.py

  # A matrix-level dependency waits for every host, including queued siblings.
  # Independent jobs let each platform use its CLI as soon as its build ends.
  build-linux:
    name: Build NeverD (linux-x86_64)
    needs: trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build zlib1g-dev
      - name: Configure current C++ recovery against the pinned LLVM
        run: |
          cmake -S . -B build-real-apps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DBUILD_TESTING=OFF
      - name: Build CLI
        run: cmake --build build-real-apps --target neverd --parallel 3
      - name: Bind binary artifact to this exact source
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          BUILD_HOST: linux-x86_64
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          binary = Path('build-real-apps/bin/neverd')
          receipt = {'schema_version': 1, 'consumer_commit': os.environ['CONSUMER_COMMIT'],
                     'host': os.environ['BUILD_HOST'],
                     'neverd_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'runtime_files': []}
          for path in sorted(binary.parent.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'Runtime artifact must be standalone: {path}')
              if path.is_file():
                  receipt['runtime_files'].append({
                      'path': path.relative_to(binary.parent).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          binary.with_name('consumer-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/neverd-host.tar.gz" -C build-real-apps bin
      - name: Publish native CLI and runtime libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neverd-real-apps-linux-x86_64
          path: ${{ runner.temp }}/neverd-host.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-build-linux-x86_64
          path: |
            build-real-apps/CMakeCache.txt
            build-real-apps/CMakeFiles/CMakeConfigureLog.yaml
            build-real-apps/compile_commands.json
            build-real-apps/bin/consumer-build.json
          retention-days: 7

  build-macos:
    name: Build NeverD (macos-arm64)
    needs: trigger
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: macOS dependencies and pinned compiler
        run: |
          brew install cmake ninja
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Configure current C++ recovery against the pinned LLVM
        run: |
          cmake -S . -B build-real-apps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DBUILD_TESTING=OFF
      - name: Build CLI
        run: cmake --build build-real-apps --target neverd --parallel 3
      - name: Bind binary artifact to this exact source
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          BUILD_HOST: macos-arm64
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          binary = Path('build-real-apps/bin/neverd')
          receipt = {'schema_version': 1, 'consumer_commit': os.environ['CONSUMER_COMMIT'],
                     'host': os.environ['BUILD_HOST'],
                     'neverd_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'runtime_files': []}
          for path in sorted(binary.parent.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'Runtime artifact must be standalone: {path}')
              if path.is_file():
                  receipt['runtime_files'].append({
                      'path': path.relative_to(binary.parent).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          binary.with_name('consumer-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/neverd-host.tar.gz" -C build-real-apps bin
      - name: Publish native CLI and runtime libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neverd-real-apps-macos-arm64
          path: ${{ runner.temp }}/neverd-host.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-build-macos-arm64
          path: |
            build-real-apps/CMakeCache.txt
            build-real-apps/CMakeFiles/CMakeConfigureLog.yaml
            build-real-apps/compile_commands.json
            build-real-apps/bin/consumer-build.json
          retention-days: 7

      - name: Collect actual iOS SDK declaration and import dependencies
        if: ${{ !cancelled() }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
        run: |
          python scripts/collect_mobile_ios_sdk_declarations.py \
            --sdk-version 26.5 --output "$RUNNER_TEMP/ios-sdk-declarations"
      - name: Preserve SDK declaration evidence for native source recovery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-sdk-declarations
          path: ${{ runner.temp }}/ios-sdk-declarations
          if-no-files-found: error
          retention-days: 7

  # Temporary diagnosis of the retained original WMF input. Remove this job
  # when that timeout is closed; the historical artifact expires. The event
  # message only schedules it: the checked-out commit is verified below.
  original-wmf:
    name: Diagnose the original WMF native timeout
    needs: [trigger, build-macos]
    if: ${{ !cancelled() && needs.trigger.result == 'success' && needs.build-macos.result == 'success' && contains(github.event.workflow_run.head_commit.message, '[original-wmf]') }}
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
      NEVERD_NATIVE_PHASES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - name: Verify the actual commit requested this temporary diagnosis
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CONSUMER_COMMIT"
          neverd_commit_message="$(git show -s --format=%B HEAD)"
          case "$neverd_commit_message" in
            *'[original-wmf]'*) ;;
            *) echo 'The verified consumer commit did not request this diagnosis' >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neverd-real-apps-macos-arm64
          path: ${{ runner.temp }}/original-wmf-runtime-download
      - name: Prepare the current producer runtime
        run: |
          mkdir -p "$RUNNER_TEMP/original-wmf-runtime"
          tar -xzf "$RUNNER_TEMP/original-wmf-runtime-download/neverd-host.tar.gz" -C "$RUNNER_TEMP/original-wmf-runtime"
      - name: Download the exact retained original input archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-wmf-download"
          gh api repos/NeverSight/NeverD/actions/artifacts/10309539118 > "$RUNNER_TEMP/original-wmf-download/artifact.json"
          curl -q --silent --show-error --fail --connect-timeout 15 --max-time 45 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --dump-header "$RUNNER_TEMP/original-wmf-download/location.headers" \
            --output /dev/null https://api.github.com/repos/NeverSight/NeverD/actions/artifacts/10309539118/zip
          neverd_archive_url="$(awk 'tolower($1) == "location:" {count++; value=$2; sub(/\r$/, "", value)} END {if (count != 1) exit 1; print value}' "$RUNNER_TEMP/original-wmf-download/location.headers")"
          # The signed blob request receives no GitHub Authorization header.
          curl -q --silent --show-error --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --url "$neverd_archive_url" \
            --output "$RUNNER_TEMP/original-wmf-download/original.zip"
      - name: Verify provenance and record the original native180 outcome
        env:
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/original-wmf-runtime/bin
        run: |
          python - <<'PY'
          import os, shutil, stat, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'scripts'))
          from mobile_real_apps_common import CaseContext, digest, load_json
          from mobile_real_apps_ios import Session, artifact_recovery

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          temporary = Path(os.environ['RUNNER_TEMP'])
          runtime = temporary / 'original-wmf-runtime' / 'bin'
          download = temporary / 'original-wmf-download'
          consumer = os.environ['CONSUMER_COMMIT']
          ctx = CaseContext(
              app={'source_commit': '86e78a9e5766d89f3d4c44abe9efce30b950d4d4'},
              variant={'id': 'wikipedia-original-wmf-native180', 'app': 'wikipedia', 'platform': 'ios'},
              source=Path.cwd(), work=temporary / 'original-wmf-evidence',
              neverd=runtime / 'neverd', timeout=600, consumer_commit=consumer,
              manifest_sha256='feeb40df05f410d29631bbfb20e5ea5555276c6f19bc46809ea443a04edbd955')
          exit_code = 1
          try:
              metadata = load_json(download / 'artifact.json')
              archive_hash = '6e1d100a3f0cc4ce0f2916745ff1e4cf195f02124516f2a7d112cf67218f2f07'
              require(metadata.get('id') == 10309539118
                      and metadata.get('name') == 'real-app-evidence-wikipedia-release-arm64-simulator'
                      and metadata.get('expired') is False
                      and metadata.get('size_in_bytes') == 229742769
                      and metadata.get('digest') == 'sha256:' + archive_hash,
                      'The retained artifact identity changed or expired')
              producer = metadata['workflow_run']
              require(producer.get('id') == 34730805274
                      and producer.get('repository_id') == 1244963310
                      and producer.get('head_repository_id') == 1244963310
                      and producer.get('head_branch') == 'dev'
                      and producer.get('head_sha') == '5686cade18f92824809d25a798dac7df3d126b6d',
                      'The retained input is not from the verified original producer')
              archive = download / 'original.zip'
              require(archive.stat().st_size == 229742769 and digest(archive) == archive_hash,
                      'The retained archive bytes changed')
              ctx.write_json('original-artifact.json', metadata)

              receipt = load_json(runtime / 'consumer-build.json')
              require(receipt.get('consumer_commit') == consumer and receipt.get('host') == 'macos-arm64',
                      'The native runtime does not belong to this consumer')
              rows = receipt['runtime_files']
              paths = [row['path'] for row in rows]
              require(len(paths) == 42 and len(set(paths)) == 42, 'Runtime inventory changed')
              actual = set()
              for path in runtime.rglob('*'):
                  require(not path.is_symlink(), 'Runtime contains a symlink')
                  if path.is_file() and path != runtime / 'consumer-build.json':
                      actual.add(path.relative_to(runtime).as_posix())
              require(set(paths) == actual and {'neverd', 'libneverd.dylib'} <= actual,
                      'Runtime inventory is incomplete')
              for row in rows:
                  name = row['path']
                  require(not Path(name).is_absolute() and '..' not in Path(name).parts and '\\' not in name,
                          'Unsafe runtime member')
                  path = runtime / name
                  require(path.is_file() and path.stat().st_size == row['size'] and digest(path) == row['sha256'],
                          'Runtime member bytes changed: ' + name)
              require(digest(ctx.neverd) == receipt['neverd_sha256'], 'CLI identity changed')
              ctx.write_json('consumer-build.json', receipt)

              member = 'original/Wikipedia.app/Frameworks/WMF.framework/WMF'
              original_hash = '0a8068bf1ced7991b99a86c81f57a7bae8064a2ae59c3c16311a15e37492483c'
              binary = ctx.work / member
              with zipfile.ZipFile(archive) as source:
                  require(source.namelist().count(member) == 1, 'Original input is missing or ambiguous')
                  info = source.getinfo(member)
                  require(stat.S_ISREG(info.external_attr >> 16) and info.file_size == 47081968
                          and not (info.flag_bits & 1), 'Original input is not the expected regular file')
                  binary.parent.mkdir(parents=True)
                  with source.open(info) as original, binary.open('xb') as output:
                      shutil.copyfileobj(original, output, 1024 * 1024)
              require(binary.stat().st_size == 47081968 and digest(binary) == original_hash,
                      'Original WMF bytes changed; a rebuilt variant cannot substitute for this input')
              ctx.stage('provenance', 'success', scope='retained-original-input-and-current-runtime',
                        input=member, input_sha256=original_hash,
                        evidence=['original-artifact.json', 'consumer-build.json', member])
              record = artifact_recovery(Session(ctx),
                  {'path': 'Frameworks/WMF.framework/WMF', 'resolved': binary}, 1, 'arm64')
              require(record['timeout_policy'].get('native_timeout_seconds') == 180
                      and record['timeout_policy'].get('planned_outer_timeout_seconds') == 195,
                      'Original timeout policy was not preserved')
              ctx.stage('recovery', record['status'], scope='original-native-timeout-diagnosis', artifacts=[record])
              # Coverage and independent source/behavior qualification remain
              # incomplete. Keep a nonzero native CLI outcome visible.
              exit_code = 0 if record.get('returncode') == 0 and record['status'] == 'incomplete' else 1
          except Exception as error:
              ctx.fail(str(error))
              raise
          finally:
              ctx.finish()
          sys.exit(exit_code)
          PY
      - name: Preserve the original input and native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-wmf-native180
          path: |
            ${{ runner.temp }}/original-wmf-evidence/
            ${{ runner.temp }}/original-wmf-download/artifact.json
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android ${{ matrix.case_id }}
    needs: [trigger, guards, build-linux]
    # Each platform waits only for its own host. A missing own-host artifact
    # still fails its download and case; both builds remain release gates.
    if: ${{ !cancelled() && needs.trigger.result == 'success' && needs.guards.outputs.android_matrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.guards.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_commit }}
          path: upstream-app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neverd-real-apps-linux-x86_64
          path: ${{ runner.temp }}/neverd-download
      - name: Prepare native CLI and independent SDK inventory tools
        env:
          SDK_PACKAGES: ${{ join(matrix.sdk_packages, ' ') }}
        run: |
          mkdir -p "$RUNNER_TEMP/neverd-host"
          tar -xzf "$RUNNER_TEMP/neverd-download/neverd-host.tar.gz" -C "$RUNNER_TEMP/neverd-host"
          read -r -a packages <<< "$SDK_PACKAGES"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${packages[@]}"
      - name: Build or fetch the pinned Android variant and collect acceptance evidence
        if: ${{ !cancelled() }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
          LD_LIBRARY_PATH: ${{ runner.temp }}/neverd-host/bin
        run: |
          python scripts/test_mobile_real_apps.py \
            --case "$CASE_ID" --source "$GITHUB_WORKSPACE/upstream-app" \
            --neverd "$RUNNER_TEMP/neverd-host/bin/neverd" \
            --consumer-commit "$CONSUMER_COMMIT" \
            --work-dir "$RUNNER_TEMP/real-app-evidence/$CASE_ID" --timeout 4200
      - name: Preserve all input, inventory, recovery and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-evidence-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-evidence/${{ matrix.case_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  ios:
    name: iOS ${{ matrix.case_id }}
    needs: [trigger, guards, build-macos]
    if: ${{ !cancelled() && needs.trigger.result == 'success' && needs.guards.outputs.ios_matrix != '' }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.guards.outputs.ios_matrix) }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_commit }}
          path: upstream-app
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neverd-real-apps-macos-arm64
          path: ${{ runner.temp }}/neverd-download
      - name: Prepare native CLI and fixed Xcode installation
        run: |
          test -d "$DEVELOPER_DIR"
          mkdir -p "$RUNNER_TEMP/neverd-host"
          tar -xzf "$RUNNER_TEMP/neverd-download/neverd-host.tar.gz" -C "$RUNNER_TEMP/neverd-host"
      - name: Independently install and verify the fixed comparison toolchain
        if: ${{ matrix.install_toolchain }}
        timeout-minutes: 50
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python scripts/qualify_mobile_swift_toolchain.py \
            --consumer-commit "$CONSUMER_COMMIT" --case-id "$CASE_ID" \
            --work-dir "$RUNNER_TEMP/real-app-toolchains/$CASE_ID"
      - name: Preserve this comparison runner's installation identity
        if: ${{ always() && matrix.install_toolchain }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-toolchain-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-toolchains/${{ matrix.case_id }}/evidence
          if-no-files-found: error
          retention-days: 14
      # Cross-compilation and analysis on this arm64 host do not establish
      # x86_64 simulator or device execution; runtime obligations remain open.
      - name: Build the pinned iOS variant and recover every bundled Mach-O
        if: ${{ !cancelled() }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
          TOOLCHAIN_ID: ${{ matrix.toolchain }}
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/neverd-host/bin
          NEVERD_NATIVE_PHASES: '1'
        run: |
          receipt_args=()
          if [[ "$TOOLCHAIN_ID" != XcodeDefault ]]; then
            receipt_args=(--toolchain-receipt "$RUNNER_TEMP/real-app-toolchains/$CASE_ID/evidence/qualification.json")
          fi
          python scripts/test_mobile_real_apps.py \
            --case "$CASE_ID" --source "$GITHUB_WORKSPACE/upstream-app" \
            --neverd "$RUNNER_TEMP/neverd-host/bin/neverd" \
            --consumer-commit "$CONSUMER_COMMIT" \
            "${receipt_args[@]}" \
            --work-dir "$RUNNER_TEMP/real-app-evidence/$CASE_ID" --timeout 4200
      - name: Preserve complete bundle, Apple inventory and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-evidence-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-evidence/${{ matrix.case_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release-gate:
    name: Complete mobile release qualification
    if: ${{ always() && needs.trigger.result == 'success' }}
    needs: [trigger, producer, guards, build-linux, build-macos, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Collect all case artifacts without merging their identities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: real-app-evidence-*
          path: ${{ runner.temp }}/real-app-results
      - name: Save actual prerequisite job results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/real-app-results"
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/real-app-needs.json"
      - name: Require the full matrix, independent rebuilt behavior and holdouts
        if: always()
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
        run: |
          python scripts/check_mobile_release_gate.py \
            --manifest scripts/mobile_real_apps.json \
            --results "$RUNNER_TEMP/real-app-results" \
            --consumer-commit "$CONSUMER_COMMIT" \
            --needs-json "$RUNNER_TEMP/real-app-needs.json" \
            --output "$RUNNER_TEMP/mobile-release-gate.json"
      - name: Preserve the release decision and missing obligations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-gate
          path: |
            ${{ runner.temp }}/mobile-release-gate.json
            ${{ runner.temp }}/real-app-needs.json
          if-no-files-found: error
          retention-days: 14
