name: Mobile Real Applications

# GitHub gives workflow_run read-only access to default-branch caches. Keep
# third-party app builds out of push/workflow_dispatch cache-write contexts.
# https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#cache-access-for-low-trust-workflow-triggers
# Schedule every required manifest case; the historical baseline never filters
# execution. Missing implementation and qualification evidence still fail.
on:
  workflow_run:
    workflows: [Mobile Decompilation]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: mobile-real-apps-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Verify the upstream run identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      consumer_commit: ${{ steps.source.outputs.consumer_commit }}
      producer_run_id: ${{ steps.source.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.source.outputs.producer_run_attempt }}
      producer_conclusion: ${{ steps.source.outputs.producer_conclusion }}
    steps:
      # workflow_run's github.sha names trusted default-branch code. Only this
      # verifier runs before the event and REST source identity are reconciled.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bind this run to the exact trusted dev revision and attempt
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/mobile_real_apps_trigger.py \
            --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT" \
            --output "$RUNNER_TEMP/mobile-trigger.json"
      - name: Preserve the verified trigger identity
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-trigger
          path: ${{ runner.temp }}/mobile-trigger.json
          if-no-files-found: error
          retention-days: 14

  producer:
    name: Require the upstream regression result
    needs: trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      # A valid failed upstream run can still collect diagnostic app evidence.
      # Its failure is an independent required prerequisite of the final gate.
      - env:
          PRODUCER_CONCLUSION: ${{ needs.trigger.outputs.producer_conclusion }}
        run: test "$PRODUCER_CONCLUSION" = success

  guards:
    name: Acceptance integrity
    needs: trigger
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      ios_matrix: ${{ steps.matrix.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate every required case from the pinned manifest
        id: matrix
        run: python scripts/mobile_real_apps_matrix.py --manifest scripts/mobile_real_apps.json --github-output "$GITHUB_OUTPUT"
      - name: Check omissions, partial output, provenance and behavior mutations
        run: |
          python -m unittest \
            scripts.tests.test_mobile_real_apps_android \
            scripts.tests.test_mobile_real_apps_android_build \
            scripts.tests.test_mobile_real_apps_android_recompile \
            scripts.tests.test_mobile_real_apps_common \
            scripts.tests.test_mobile_real_apps_ios \
            scripts.tests.test_mobile_swift_toolchain \
            scripts.tests.test_mobile_ios_sdk_declarations \
            scripts.tests.test_mobile_real_apps_objc_inventory \
            scripts.tests.test_mobile_real_apps_matrix \
            scripts.tests.test_mobile_real_apps_trigger \
            scripts.tests.test_mobile_release_gate \
            scripts.tests.test_mobile_ios_backend -v
      - name: Check documentation and localized mobile support contracts
        if: ${{ !cancelled() }}
        run: python scripts/check_docs_i18n.py

  build:
    name: Build NeverD (${{ matrix.host }})
    needs: trigger
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: macos-arm64
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build zlib1g-dev
      - name: macOS dependencies and pinned compiler
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
          test -d /Applications/Xcode_26.5.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Configure current C++ recovery against the pinned LLVM
        run: |
          cmake -S . -B build-real-apps -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNEVERD_LLVM_PREBUILT=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DBUILD_TESTING=OFF
      - name: Build CLI
        run: cmake --build build-real-apps --target neverd --parallel 3
      - name: Bind binary artifact to this exact source
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          BUILD_HOST: ${{ matrix.host }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          binary = Path('build-real-apps/bin/neverd')
          receipt = {'schema_version': 1, 'consumer_commit': os.environ['CONSUMER_COMMIT'],
                     'host': os.environ['BUILD_HOST'],
                     'neverd_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
                     'runtime_files': []}
          for path in sorted(binary.parent.rglob('*')):
              if path.is_symlink():
                  raise SystemExit(f'Runtime artifact must be standalone: {path}')
              if path.is_file():
                  receipt['runtime_files'].append({
                      'path': path.relative_to(binary.parent).as_posix(),
                      'size': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          binary.with_name('consumer-build.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          tar -czf "$RUNNER_TEMP/neverd-host.tar.gz" -C build-real-apps bin
      - name: Publish native CLI and runtime libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neverd-real-apps-${{ matrix.host }}
          path: ${{ runner.temp }}/neverd-host.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-build-${{ matrix.host }}
          path: |
            build-real-apps/CMakeCache.txt
            build-real-apps/CMakeFiles/CMakeConfigureLog.yaml
            build-real-apps/compile_commands.json
            build-real-apps/bin/consumer-build.json
          retention-days: 7

      - name: Collect actual iOS SDK declaration and import dependencies
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
        run: |
          python scripts/collect_mobile_ios_sdk_declarations.py \
            --sdk-version 26.5 --output "$RUNNER_TEMP/ios-sdk-declarations"
      - name: Preserve SDK declaration evidence for native source recovery
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-sdk-declarations
          path: ${{ runner.temp }}/ios-sdk-declarations
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android ${{ matrix.case_id }}
    needs: [trigger, guards, build]
    # A failed sibling host build does not discard the available host's app
    # evidence. A missing own-host artifact still fails its download and case.
    if: ${{ !cancelled() && needs.trigger.result == 'success' && needs.guards.outputs.android_matrix != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.guards.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_commit }}
          path: upstream-app
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neverd-real-apps-linux-x86_64
          path: ${{ runner.temp }}/neverd-download
      - name: Prepare native CLI and independent SDK inventory tools
        env:
          SDK_PACKAGES: ${{ join(matrix.sdk_packages, ' ') }}
        run: |
          mkdir -p "$RUNNER_TEMP/neverd-host"
          tar -xzf "$RUNNER_TEMP/neverd-download/neverd-host.tar.gz" -C "$RUNNER_TEMP/neverd-host"
          read -r -a packages <<< "$SDK_PACKAGES"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "${packages[@]}"
      - name: Build or fetch the pinned Android variant and collect acceptance evidence
        if: ${{ !cancelled() }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
          LD_LIBRARY_PATH: ${{ runner.temp }}/neverd-host/bin
        run: |
          python scripts/test_mobile_real_apps.py \
            --case "$CASE_ID" --source "$GITHUB_WORKSPACE/upstream-app" \
            --neverd "$RUNNER_TEMP/neverd-host/bin/neverd" \
            --consumer-commit "$CONSUMER_COMMIT" \
            --work-dir "$RUNNER_TEMP/real-app-evidence/$CASE_ID" --timeout 4200
      - name: Preserve all input, inventory, recovery and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-evidence-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-evidence/${{ matrix.case_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  ios:
    name: iOS ${{ matrix.case_id }}
    needs: [trigger, guards, build]
    if: ${{ !cancelled() && needs.trigger.result == 'success' && needs.guards.outputs.ios_matrix != '' }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.guards.outputs.ios_matrix) }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_commit }}
          path: upstream-app
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: neverd-real-apps-macos-arm64
          path: ${{ runner.temp }}/neverd-download
      - name: Prepare native CLI and fixed Xcode installation
        run: |
          test -d "$DEVELOPER_DIR"
          mkdir -p "$RUNNER_TEMP/neverd-host"
          tar -xzf "$RUNNER_TEMP/neverd-download/neverd-host.tar.gz" -C "$RUNNER_TEMP/neverd-host"
      - name: Independently install and verify the fixed comparison toolchain
        if: ${{ matrix.install_toolchain }}
        timeout-minutes: 50
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python scripts/qualify_mobile_swift_toolchain.py \
            --consumer-commit "$CONSUMER_COMMIT" --case-id "$CASE_ID" \
            --work-dir "$RUNNER_TEMP/real-app-toolchains/$CASE_ID"
      - name: Preserve this comparison runner's installation identity
        if: ${{ always() && matrix.install_toolchain }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-toolchain-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-toolchains/${{ matrix.case_id }}/evidence
          if-no-files-found: error
          retention-days: 14
      # Cross-compilation and analysis on this arm64 host do not establish
      # x86_64 simulator or device execution; runtime obligations remain open.
      - name: Build the pinned iOS variant and recover every bundled Mach-O
        if: ${{ !cancelled() }}
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
          CASE_ID: ${{ matrix.case_id }}
          TOOLCHAIN_ID: ${{ matrix.toolchain }}
          DYLD_LIBRARY_PATH: ${{ runner.temp }}/neverd-host/bin
        run: |
          receipt_args=()
          if [[ "$TOOLCHAIN_ID" != XcodeDefault ]]; then
            receipt_args=(--toolchain-receipt "$RUNNER_TEMP/real-app-toolchains/$CASE_ID/evidence/qualification.json")
          fi
          python scripts/test_mobile_real_apps.py \
            --case "$CASE_ID" --source "$GITHUB_WORKSPACE/upstream-app" \
            --neverd "$RUNNER_TEMP/neverd-host/bin/neverd" \
            --consumer-commit "$CONSUMER_COMMIT" \
            "${receipt_args[@]}" \
            --work-dir "$RUNNER_TEMP/real-app-evidence/$CASE_ID" --timeout 4200
      - name: Preserve complete bundle, Apple inventory and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-app-evidence-${{ matrix.case_id }}
          path: ${{ runner.temp }}/real-app-evidence/${{ matrix.case_id }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  release-gate:
    name: Complete mobile release qualification
    if: ${{ always() && needs.trigger.result == 'success' }}
    needs: [trigger, producer, guards, build, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trigger.outputs.consumer_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Collect all case artifacts without merging their identities
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: real-app-evidence-*
          path: ${{ runner.temp }}/real-app-results
      - name: Save actual prerequisite job results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          mkdir -p "$RUNNER_TEMP/real-app-results"
          printf '%s\n' "$NEEDS_JSON" > "$RUNNER_TEMP/real-app-needs.json"
      - name: Require the full matrix, independent rebuilt behavior and holdouts
        if: always()
        env:
          CONSUMER_COMMIT: ${{ needs.trigger.outputs.consumer_commit }}
        run: |
          python scripts/check_mobile_release_gate.py \
            --manifest scripts/mobile_real_apps.json \
            --results "$RUNNER_TEMP/real-app-results" \
            --consumer-commit "$CONSUMER_COMMIT" \
            --needs-json "$RUNNER_TEMP/real-app-needs.json" \
            --output "$RUNNER_TEMP/mobile-release-gate.json"
      - name: Preserve the release decision and missing obligations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-release-gate
          path: |
            ${{ runner.temp }}/mobile-release-gate.json
            ${{ runner.temp }}/real-app-needs.json
          if-no-files-found: error
          retention-days: 14
