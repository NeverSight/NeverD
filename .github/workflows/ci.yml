                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("ObjCCallHints.FrameworkProvidersRequireExactActivationAndAgreement",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("ObjCCallHints.FrameworkDeclarationsKeepMissingAndConflictingEvidence",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("ObjCCallHints.FrameworkVariadicAndUnsupportedRecordsRemainUnbound",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("ObjCCallHints.FrameworkABIIsArchitectureSpecificAndRevalidated",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("ObjCCallHints.StackGuardAddressRequiresExactRuntimeIdentity",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("HighCSourceCalls.ConditionalEntryEvaluatesBeforeItsTakenEdgeCopies",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("HighCSourceCalls.ConditionalEntryDoesNotHideOtherNestedInstructions",
                   "NeverDLiftTests", "NeverDObjCSourceCallTests"),
                  ("HighCIntegerWidths.ArithmeticWrapsBeforeWideningWithoutSignedOverflow",
                   "NeverDLiftTests"),
                  ("AArch64_RoundTrip.ParameterWidthFlowsThroughBranchPhi",
                   "NeverDLiftTests"),
                  ("AArch64_RoundTrip.LiveInIdentityAndCallClobbersStayExact",
                   "NeverDLiftTests"),
              )
          )
          runner_os = os.environ["RUNNER_OS"]
          expected_count = {
              ("Linux", "linux-semantic"): 522,
              ("macOS", "macos-patch"): 577,
              ("Windows", "windows-focused"): 518,
          }[(runner_os, os.environ["TEST_PROFILE"])]
          if runner_os == "macOS":
              expected += tuple(TestRecord(name, frozenset({"NeverDObjCRuntimeSourceTests"}))
                  for name in (
                      "ObjCRuntimeSource.SwiftIntegerRuntimeCallsPreserveCastsAndRetainCounts",
                      "ObjCRuntimeSource.VoidNativeFramesPreserveReleasesAndRejectUnknownResults",
                      "ObjCRuntimeSource.VoidNativeTailCallsPreserveLifetimesAndRejectResultUses",
                      "ObjCRuntimeSource.NativeFloatingHelpersPreserveLanesAndMemoryEffects",
                      "ObjCRuntimeSource.NativeRecordMembersPreserveScalarResultsAndEffects",
                      "ObjCRuntimeSource.SwiftRuntimeRecordResultsPreserveBoxesAndMetadata",
                      "ObjCRuntimeSource.RuntimeIvarOffsetsPreserveSwiftPropertiesAndOpaqueFields",
                      "ObjCRuntimeSource.AuxiliaryNativeInputsPreserveBuffersAndScalarResults",
                      "ObjCRuntimeSource.NativeContextParametersPreserveRegisterInputsAndBits",
                      "ObjCRuntimeSource.IncomingNativeResultsPreserveWordBitsAndMemoryReads",
                      "ObjCRuntimeSource.ReadOnlyTablesPreserveIntegerFloatingBitsAndIndexBounds",
                      "ObjCRuntimeSource.PrivateFramePaddingPreservesScalarValuesAndGetterEffects",
                      "ObjCRuntimeSource.SwiftFixedRuntimeCallsPreserveMetadataIdentityAndByteLength",
                      "ObjCRuntimeSource.NativeReturnPathsPreserveBranchResultsAndStores",
                      "ObjCRuntimeSource.RecompiledFrameworkFetchesPreserveContextObjects",
                      "ObjCRuntimeSource.RecompiledImmutableScalarsPreserveFloatingBitPatterns",
                      "ObjCRuntimeSource.RecompiledGraphicsCallsPreserveValuesAndImageIdentity",
                      "ObjCRuntimeSource.RecompiledSwiftLiteralsPreserveUTF8AndObjectLifetimes",
                      "ObjCRuntimeSource.RecompiledStoredStringsPreserveCollectionsAndIdentity",
                      "ObjCRuntimeSource.RecompiledSystemDataPreservesRuntimeSingletonIdentity",
                      "ObjCRuntimeSource.RecompiledIndirectFieldsPreserveRuntimeOffsetsAndOwnership",
                      "ObjCRuntimeSource.RecompiledProtocolReferencesPreserveRegisteredIdentity",
                      "ObjCRuntimeSource.RecompiledSwiftAllocationPreservesAlignmentMetadataAndDestruction",
                      "ObjCRuntimeSource.RecompiledFloatingValuesSurviveRuntimeCalls",
                      "ObjCRuntimeSource.EqualityProjectionPreservesOwnershipOrRejectsMissingCallEvidence",
                      "ObjCRuntimeSource.NarrowSavedParametersPreserveValuesAndCallEffects",
                      "ObjCRuntimeSource.ReceiverResultTypesPreserveFactoryAndPropertyBehavior",
                      "ObjCRuntimeSource.SharedFrameworkCallsPreserveScalarsRecordsAndObjects",
                      "ObjCRuntimeSource.RuntimeReceiverAliasesPreserveValuesAndObjectLifetimes",
                      "ObjCRuntimeSource.TypedReceiverFieldsPreserveNestedAndNilObjectCalls",
                      "ObjCRuntimeSource.HomogeneousRecordsPreserveFieldsCallsAndStackArguments",
                      "ObjCRuntimeSource.WordRecordsPreserveBitsPointersCallsAndStackArguments",
                      "ObjCRuntimeSource.PredicateFormatsPreserveValuesAndQuotedPlaceholders",
                      "ObjCRuntimeSource.FixedCRecordsPreserveValuesAndBitmapEffects",
                      "ObjCRuntimeSource.SystemCallsPreserveFileAttributesObjectsAndDigests",
                      "ObjCRuntimeSource.SwiftMetadataCallsPreserveIdentityAndResponseState",
                      "ObjCRuntimeSource.InvariantLoopValuesPreserveClassChecksAndGetterEffects",
                      "ObjCRuntimeSource.SwitchSuccessorsPreserveStoresCallsAndSharedExits",
                      "ObjCRuntimeSource.LoopContinuationsPreserveExitCopiesAndStores",
                      "ObjCRuntimeSource.PrivateFrameSelectorsPreserveStringsAndIdentity",
                      "ObjCRuntimeSource.ReceiverDeclarationsPreserveClassInstanceAndInheritedABI",
                      "ObjCRuntimeSource.DynamicPropertyAccessorsExecuteAgainstCoreData",
                      "ObjCRuntimeSource.RecompiledBlocksPreserveEscapingCapturesAndOwnershipHelpers",
                      "ObjCRuntimeSource.RecompiledDarwinDeclarationsPreserveIdentitySynchronizationAndScalars",
                      "ObjCRuntimeSource.RecompiledFrameworkCallsPreserveValuesAndObjectIdentity",
                      "ObjCRuntimeSource.RecompiledProtocolCallsPreserveEnumerationState",
                      "ObjCRuntimeSource.RecompiledARCMethodsPreserveActualObjectLifetimes",
                      "ObjCRuntimeSource.RecompiledAssociatedObjectsPreserveLifetimeAndPolicy",
                      "ObjCRuntimeSource.RecompiledProfiledMethodsKeepSharedCounterStorage",
                      "ObjCRuntimeSource.RecompiledSwiftRuntimeCallsPreserveWeakObjectLifetimes",
                      "ObjCRuntimeSource.RecompiledConstantObjectsPreserveGraphsAndConcurrentIdentity",
                      "ObjCRuntimeSource.RecompiledConstantStringsPreserveContentsAndIdentity",
                      "ObjCRuntimeSource.NativePointerForwardingPreservesStringsAndOwnership",
                      "ObjCRuntimeSource.RecompiledUnfairLocksPreserveOwnershipAndConcurrentUpdates",
                      "ObjCRuntimeSource.RecompiledSwiftStringBridgePreservesContentsAndLifetime",
                      "ObjCRuntimeSource.RecompiledDiagnosticsPreserveMessagesAndTerminalTrap",
                      "ObjCRuntimeSource.RecompiledSwiftStoredPropertiesUseRuntimeIvarOffsets",
                  ))
          if runner_os in ("Linux", "macOS"):
              expected += (TestRecord(
                  "SessionCAPITest.NativePhaseTraceClosedStderrPreservesActualLoadContract",
                  frozenset({"NeverDSessionCAPITests"}),
              ),)
          if runner_os == "Linux":
              expected += (TestRecord(
                  "SessionCAPITest.NativePhaseTraceFullStderrPreservesActualLoadContract",
                  frozenset({"NeverDSessionCAPITests"}),
              ),)
          if runner_os in ("Linux", "macOS"):
              expected += (TestRecord(
                  "PipelineStageTrace.ClosedStderrPreservesNativeResult",
                  frozenset({"NeverDPipelineOutcomeTests"}),
              ),)
          if runner_os == "Linux":
              expected += (TestRecord(
                  "PipelineStageTrace.FullStderrPreservesNativeResult",
                  frozenset({"NeverDPipelineOutcomeTests"}),
              ),)
          if (len(expected) != expected_count or len(set(expected)) != expected_count
                  or len({item.name for item in expected}) != expected_count):
              raise RuntimeError("focused contract has missing or duplicate identities")
          evidence = Path("build-ci/mobile-native-focused").resolve()
          evidence.mkdir()
          errors = []
          statuses = {}

          def write_json(name, value):
              (evidence / name).write_text(
                  json.dumps(value, indent=2) + "\n", encoding="utf-8"
              )

          def identities(records):
              return [
                  {"name": item.name, "labels": sorted(item.labels)}
                  for item in records
              ]

          # A regex of every expected name exceeds the Windows command-line
          # limit, so pass the exact names through a file instead.
          tests_file = evidence / "tests.txt"
          tests_file.write_text(
              "".join(item.name + "\n" for item in expected), encoding="utf-8"
          )
          # CTest accepts any matching label. Select the owning aggregates;
          # additional labels remain part of each exact expected identity.
          owners = (
              "NeverDLanguageEHTests", "NeverDLibCTests", "NeverDLiftTests",
              "NeverDMetadataJSONTests",
              "NeverDMobileTests", "NeverDSessionCAPITests",
              "NeverDObjCRuntimeSourceTests",
              "NeverDPipelineOutcomeTests",
          )
          owner_regex = "^(" + "|".join(re.escape(owner) for owner in owners) + ")$"
          common = [
              "ctest", "--test-dir", "build-ci", "--build-config", "Release",
              "--label-regex", owner_regex,
              "--tests-from-file", str(tests_file),
          ]
          discovery = common + ["--show-only=json-v1"]
          execution = common + [
              "--no-tests=error", "--output-on-failure", "--verbose", "--parallel", "1",
              "--test-output-size-passed", "1048576",
              "--test-output-size-failed", "1048576",
              "--test-output-truncation", "middle",
              "--output-junit", str(evidence / "results.xml"),
              "--output-log", str(evidence / "ctest.log"),
          ]
          write_json("expected.json", identities(expected))
          write_json("commands.json", {
              "head_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "profile": os.environ["TEST_PROFILE"],
              "runner_os": runner_os,
              "cwd": str(Path.cwd()),
              "discovery": discovery,
              "execution": execution,
          })

          def run(name, command, stdout_name):
              status = {"returncode": None}
              try:
                  with (evidence / stdout_name).open("wb") as stdout, \
                       (evidence / (name + ".stderr")).open("wb") as stderr:
                      result = subprocess.run(command, stdout=stdout, stderr=stderr, check=False)
                  status["returncode"] = result.returncode
              except OSError as error:
                  status["error"] = str(error)
              statuses[name] = status
              write_json("exit-status.json", statuses)
              if status["returncode"] != 0:
                  errors.append(f"{name} command failed: {status}")

          run("discovery", discovery, "inventory.json")
          # Still attempt every selected test when discovery reports an error.
          run("execution", execution, "execution.stdout")

          def check_identities(name, records):
              actual = set(records)
              required = set(expected)
              order = lambda item: (item.name, tuple(sorted(item.labels)))
              if len(records) != expected_count or actual != required:
                  errors.append(
                      f"{name} identities differ: count={len(records)}, "
                      f"missing={identities(sorted(required - actual, key=order))}, "
                      f"unexpected={identities(sorted(actual - required, key=order))}"
                  )

          selected = None
          outcomes = None
          gtest_receipts = []
          try:
              selected = parse_inventory(json.loads(
                  (evidence / "inventory.json").read_text(encoding="utf-8")
              ))
              check_identities("discovery", selected)
          except Exception as error:
              errors.append(f"inventory audit failed: {type(error).__name__}: {error}")
          try:
              outcomes = parse_junit(ET.parse(evidence / "results.xml").getroot())
              check_identities("execution", tuple(item.test for item in outcomes))
              for item in outcomes:
                  lines = item.output.splitlines()
                  started = lines.count(f"[ RUN      ] {item.test.name}")
                  passed_pattern = re.escape(f"[       OK ] {item.test.name}") + r"(?: \([0-9]+ ms\))?"
                  passed = sum(re.fullmatch(passed_pattern, line) is not None for line in lines)
                  gtest_receipts.append({
                      "name": item.test.name, "labels": sorted(item.test.labels),
                      "started": started, "passed": passed,
                  })
                  if started != 1 or passed != 1:
                      errors.append(
                          f"{item.test.name} {sorted(item.test.labels)}: "
                          f"expected one actual GTest start and pass, got {started}/{passed}"
                      )
                  if item.outcome != "passed":
                      errors.append(
                          f"{item.test.name} {sorted(item.test.labels)}: "
                          f"{item.outcome}: {item.message}"
                      )
          except Exception as error:
              errors.append(f"JUnit audit failed: {type(error).__name__}: {error}")
          report = {
              "status": "failed" if errors else "passed",
              "expected_count": expected_count,
              "selected_count": None if selected is None else len(selected),
              "reported_count": None if outcomes is None else len(outcomes),
              "passed_count": None if outcomes is None else sum(
                  item.outcome == "passed" for item in outcomes
              ),
              "started_count": sum(item["started"] == 1 for item in gtest_receipts),
              "gtest_passed_count": sum(item["passed"] == 1 for item in gtest_receipts),
              "gtest_receipts": gtest_receipts,
              "selected": None if selected is None else identities(selected),
              "outcomes": None if outcomes is None else [
                  {"name": item.test.name, "labels": sorted(item.test.labels),
                   "outcome": item.outcome, "message": item.message}
                  for item in outcomes
              ],
              "command_statuses": statuses,
              "errors": errors,
          }
          write_json("outcomes.json", report)
          print(json.dumps(report, indent=2))
          raise SystemExit(1 if errors else 0)
          PY
        env:
          PYTHON: ${{ matrix.python }}
          TEST_PROFILE: ${{ matrix.test_profile }}
          NEVERD_HIGH_TRACE_FUNCTION: 'test_post_call_x1'
          NEVERD_TEST_ARTIFACT_DIR: ${{ github.workspace }}/build-ci/mobile-native-focused/fixtures

      - name: Upload mobile native regression evidence
        if: ${{ always() && steps.default_build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-native-focused-${{ matrix.test_profile }}
          path: build-ci/mobile-native-focused/
          if-no-files-found: error

      # The C++ side alone cannot prove agreement with the implementation that
      # validators execute. Build the process-isolated oracle from the exact
      # source object and Cargo.lock named by NeverD's typed provenance table,
      # then make the Linux semantic leg treat every skipped oracle case as a
      # configured, executable differential test.
      - name: Build the pinned Anza SBF oracle
        id: sbf_oracle
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-pinned-revision)"
          toolchain="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-toolchain)"
          oracle_source="$RUNNER_TEMP/neverd-sbpf-oracle-source"
          oracle_binary="$GITHUB_WORKSPACE/build-ci/bin/neverd-sbpf-official-oracle"
          git init "$oracle_source"
          git -C "$oracle_source" remote add origin https://github.com/anza-xyz/sbpf.git
          git -C "$oracle_source" fetch --depth=1 origin "$revision"
          git -C "$oracle_source" checkout --detach FETCH_HEAD
          rustup toolchain install "$toolchain" --profile minimal
          "$PYTHON" scripts/build_sbf_official_oracle.py \
            --sbpf-root "$oracle_source" \
            --output "$oracle_binary" \
            --toolchain "$toolchain"
          {
            echo "NEVERD_SBPF_ROOT=$oracle_source"
            echo "NEVERD_SBPF_ORACLE=$oracle_binary"
            echo "NEVERD_REQUIRE_SBPF_ORACLE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      # The loader corpus is large enough that CI should fetch only its one
      # audited fixture directory.  Both the checkout and the C++ gate derive
      # the object identity from SBFUpstreamSources.def, and the required flag
      # turns a missing, partial, or wrong checkout into a hard failure.
      - name: Fetch the pinned Agave ELF-loader corpus
        id: agave_corpus
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && runner.os == 'Linux' && steps.sbf_oracle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-test-vectors-revision)"
          fixture_root="$RUNNER_TEMP/neverd-firedancer-test-vectors"
          git init "$fixture_root"
          git -C "$fixture_root" remote add origin https://github.com/firedancer-io/test-vectors.git
          git -C "$fixture_root" sparse-checkout init --cone
          git -C "$fixture_root" sparse-checkout set elf_loader/fixtures
          git -C "$fixture_root" fetch --depth=1 origin "$revision"
          git -C "$fixture_root" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture_root" rev-parse HEAD)" = "$revision"
          {
            echo "NEVERD_AGAVE_CONFORMANCE_ROOT=$fixture_root"
            echo "NEVERD_AGAVE_CONFORMANCE_REVISION=$revision"
            echo "NEVERD_REQUIRE_AGAVE_CONFORMANCE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      - name: Run native and Python plugin examples
        id: plugin_examples
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && (runner.os != 'Linux' || (steps.sbf_oracle.outcome == 'success' && steps.agave_corpus.outcome == 'success')) }}
        shell: bash
        run: |
          set -o pipefail
          build-ci/bin/neverd plugins --list --json |
            "$PYTHON" -c 'import json, sys; plugins = json.load(sys.stdin); assert any(plugin.get("name") == "Example Plugin" and plugin.get("kind") == "native" for plugin in plugins), plugins'
          build-ci/bin/neverd plugins --run "Example Plugin"
          build-ci/bin/neverd plugins --run "Semantic Optimizer"
          build-ci/bin/neverd plugins \
            --plugin-dir build-ci/bin/sdk/python/examples \
            --run "Python Semantic Optimizer"
        env:
          PYTHON: ${{ matrix.python }}

      - name: Audit and select test profile
        id: inventory
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && steps.plugin_examples.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-ci --build-config Release --show-only=json-v1 |
            tee build-ci/ctest-inventory.json |
            "$PYTHON" scripts/audit_ci_test_inventory.py \
              --profile "$TEST_PROFILE" \
              --exclude-label-regex "$EXCLUDE_LABELS" \
              --matrix-name "$MATRIX_NAME"
        env:
          EXCLUDE_LABELS: ${{ matrix.exclude_labels }}
          MATRIX_NAME: ${{ matrix.name }}
          PYTHON: ${{ matrix.python }}
          TEST_PROFILE: ${{ matrix.test_profile }}

      - name: Run selected test profile
        id: ctest
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cmake -E rm -f build-ci/ctest-results.xml \
            build-ci/ctest-exit-status.txt build-ci/ctest-outcomes.json ctest.log
          set +e
          ctest --test-dir build-ci \
            --build-config Release \
            --label-exclude "$EXCLUDE_LABELS" \
            --output-junit "$PWD/build-ci/ctest-results.xml" \
            --output-log "$PWD/ctest.log" \
            --no-tests=error \
            --stop-on-failure \
            --output-on-failure \
            --progress \
            --parallel "$TEST_PARALLEL"
          ctest_status="$?"
          set -e
          printf '%s\n' "$ctest_status" > build-ci/ctest-exit-status.txt
          exit "$ctest_status"
        env:
          EXCLUDE_LABELS: ${{ steps.inventory.outputs.label_exclude }}
          TEST_PARALLEL: ${{ matrix.parallel }}

      - name: Audit selected test outcomes
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" scripts/audit_ci_test_results.py audit \
            --inventory build-ci/ctest-inventory.json \
            --junit build-ci/ctest-results.xml \
            --ctest-status build-ci/ctest-exit-status.txt \
            --profile "$TEST_PROFILE" \
            --exclude-label-regex "$EXCLUDE_LABELS" \
            --matrix-name "$MATRIX_NAME" \
            --output build-ci/ctest-outcomes.json
        env:
          EXCLUDE_LABELS: ${{ steps.inventory.outputs.label_exclude }}
          TEST_PROFILE: ${{ matrix.test_profile }}
          MATRIX_NAME: ${{ matrix.name }}
          PYTHON: ${{ matrix.python }}

      - name: Upload CTest execution evidence
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-evidence-${{ matrix.test_profile }}
          path: |
            build-ci/ctest-inventory.json
            build-ci/ctest-results.xml
            build-ci/ctest-exit-status.txt
            build-ci/ctest-outcomes.json
            build-ci/source-dialects/
            ctest.log
          if-no-files-found: error

      - name: Capture the existing first-fatal semantic failures
        id: first_fatal_snapshot
        # Two bounded discovery/execution pairs need up to 60 minutes, with
        # additional room for process cleanup and retained artifact checks.
        timeout-minutes: 65
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" scripts/collect_first_fatal_snapshots.py \
            --build-dir build-ci \
            --inventory build-ci/ctest-inventory.json \
            --output-dir build-ci/first-fatal-snapshots
        env:
          PYTHON: ${{ matrix.python }}

      - name: Upload first-fatal semantic evidence
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-fatal-snapshots-${{ matrix.test_profile }}
          path: build-ci/first-fatal-snapshots
          if-no-files-found: error

      - name: Audit configured and executable capability evidence
        shell: bash
        run: |
          "$PYTHON" scripts/check_capabilities.py \
            --build-dir build-ci --build-config Release \
            --ctest-inventory build-ci/ctest-inventory.json
        env:
          PYTHON: ${{ matrix.python }}

      # The CLI, the typed C entry point and the JSON one are three surfaces
      # over one implementation, and nothing that tests any of them alone would
      # notice them drifting apart.  This needs the built tool and library, so
      # it runs here rather than with the source checks.
      - name: Check the simplifier's surfaces agree
        shell: bash
        run: |
          "$PYTHON" -m unittest scripts.tests.test_simplify_surfaces -v
        env:
          NEVERD_BUILD_DIR: build-ci
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python

  native-cpu:
    name: Native CPU (${{ inputs.native_cpu_backend == 'kvm' && 'Linux x64 KVM' || 'Windows x64 WHP' }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_cpu_only && !inputs.native_arm64_only && !inputs.windows_eh_only }}
    runs-on: ${{ inputs.native_cpu_backend == 'kvm' && 'ubuntu-24.04' || 'windows-latest' }}
    # A cold Windows build plus the full driver inventory can exceed one hour.
    # Per-test execution deadlines remain independently bounded.
    timeout-minutes: 90
    env:
      NEVERD_NATIVE_CPU_BACKEND: ${{ inputs.native_cpu_backend }}
      NEVERD_NATIVE_DRIVER_TESTS: ${{ inputs.native_driver_tests && 'ON' || 'OFF' }}
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Checkout native CPU sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: false

      - name: Initialize pinned native test dependencies
        shell: bash
        run: git submodule update --init --depth 1 third_party/capstone

      - name: Enable the native compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'

      - name: Set up native CPU evidence tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Windows native CPU build tooling
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Install Linux native CPU build tooling
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          # Match validated GoogleTest discovery: Ubuntu's CMake 3.28 includes
          # GetParam() comments in test names for the pinned GoogleTest.
          python -m pip install cmake==4.2.3
          cmake --version
          # The pinned WDK uses 64-bit CR8 intrinsics; Clang 18/19 declare
          # incompatible signatures. Use the signed upstream LLVM packages.
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            --output "$RUNNER_TEMP/neverd-llvm.asc"
          sudo install -m 0644 "$RUNNER_TEMP/neverd-llvm.asc" \
            /usr/share/keyrings/neverd-llvm.asc
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/neverd-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/neverd-llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 ninja-build
          printf '%s\n' /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Enable the native CPU MSVC toolchain
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Prepare native KVM device access
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          python scripts/prepare_kvm_ci.py \
            --output build-ci-native/native-evidence/device-access.json

      - name: Configure the native CPU profile
        shell: bash
        run: |
          python -m unittest scripts.tests.test_run_native_cpu_ci \
            scripts.tests.test_build_wdk_driver_fixtures \
            scripts.tests.test_probe_native_host -q
          python scripts/check_capabilities.py
          python scripts/check_docs_i18n.py
          python scripts/audit_ci_test_results.py check-tool
          fixture_args=()
          if [[ "$NEVERD_NATIVE_DRIVER_TESTS" == "ON" ]]; then
            python scripts/build_wdk_driver_fixtures.py \
              --output build-ci-native/driver-fixtures \
              --cache build-ci-native/driver-packages
            fixture_args+=(-C build-ci-native/driver-fixtures/fixtures.cmake)
          fi
          cmake -S . -B build-ci-native -G Ninja \
            "${fixture_args[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ inputs.native_cpu_backend == 'kvm' && 'clang' || 'cl' }} \
            -DCMAKE_CXX_COMPILER=${{ inputs.native_cpu_backend == 'kvm' && 'clang++' || 'cl' }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON -DNEVERD_BUILD_SHARED=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF \
            -DNEVERD_ENABLE_CPU_EMULATION=ON \
            -DNEVERD_ENABLE_DRIVER_EMULATION="$NEVERD_NATIVE_DRIVER_TESTS" \
            -DNEVERD_EMULATION_BACKEND_UNICORN=OFF \
            -DNEVERD_LLVM_PREBUILT=ON

      - name: Check native compiler cache availability
        shell: bash
        run: |
          # --zero-stats connects to or starts the server; --show-stats can
          # succeed without one. Startup errors may contain signed cache URLs.
          if ! sccache --zero-stats > "$RUNNER_TEMP/neverd-sccache-probe.log" 2>&1; then
            echo "::warning::Compiler cache unavailable; continuing with the configured compiler."
            cmake -S . -B build-ci-native \
              -DCMAKE_C_COMPILER_LAUNCHER= \
              -DCMAKE_CXX_COMPILER_LAUNCHER=
          fi

      - name: Build and verify native CPU owners
        shell: bash
        run: |
          driver_args=()
          if [[ "$NEVERD_NATIVE_DRIVER_TESTS" == "ON" ]]; then
            driver_args+=(--with-drivers)
          fi
          python scripts/run_native_cpu_ci.py \
            --build build-ci-native \
            --evidence build-ci-native/native-evidence \
            --parallel 4 --require-"$NEVERD_NATIVE_CPU_BACKEND" "${driver_args[@]}"

      - name: Preserve native CPU evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-cpu-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64-${{ inputs.native_cpu_backend }}
          path: |
            build-ci-native/native-evidence/
            build-ci-native/driver-fixtures/build-manifest.json
            build-ci-native/driver-fixtures/*.log
          if-no-files-found: warn
          retention-days: 14

  arm64-native-build:
    name: ARM64 native backend build (${{ matrix.backend }})
    if: ${{ github.event.action != 'closed' && !inputs.windows_eh_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: kvm
            runner: ubuntu-24.04-arm
          - backend: whp
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Initialize pinned component dependencies
        shell: bash
        run: git -c core.longpaths=true submodule update --init --depth 1 third_party/llvm-project third_party/capstone
      - name: Install Linux component build tooling
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Install Windows component build tooling
        if: ${{ runner.os == 'Windows' }}
        run: choco install ninja --yes --no-progress
      - name: Select the native ARM64 MSVC compiler
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - name: Build actual ARM64 backend components
        shell: bash
        run: |
          python -m unittest scripts.tests.test_audit_native_backend_build -q
          cmake -S . -B build-ci-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DNEVERD_BUILD_SHARED=OFF \
            -DNEVERD_BUILD_GUI=OFF -DNEVERD_ENABLE_Z3=OFF \
            -DNEVERD_ENABLE_CPU_EMULATION=ON \
            -DNEVERD_ENABLE_DRIVER_EMULATION=OFF \
            -DNEVERD_EMULATION_BACKEND_UNICORN=OFF \
            -DNEVERD_EMULATION_BACKEND_KVM=${{ matrix.backend == 'kvm' && 'ON' || 'OFF' }} \
            -DNEVERD_EMULATION_BACKEND_WHP=${{ matrix.backend == 'whp' && 'ON' || 'OFF' }} \
            -DNEVERD_LLVM_PREBUILT=OFF
          cmake --build build-ci-arm64 --target NeverDEmulationNative --parallel 4
          python scripts/audit_native_backend_build.py \
            --backend ${{ matrix.backend }} --build build-ci-arm64 \
            --output build-ci-arm64/evidence/build.json
      - name: Observe ARM64 host setup availability
        shell: bash
        run: |
          python scripts/probe_native_host.py \
            --backend ${{ matrix.backend }} --arch ARM64 \
            --output build-ci-arm64/host-probe
      - name: Preserve ARM64 compilation and host setup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-backend-arm64-${{ matrix.backend }}
          path: |
            build-ci-arm64/evidence/
            build-ci-arm64/host-probe/
            build-ci-arm64/CMakeCache.txt
            build-ci-arm64/compile_commands.json
            build-ci-arm64/lib/emulation/CMakeFiles/NeverDEmulationNative.dir/backends/
          if-no-files-found: error
          retention-days: 14

  windows-context-oracle:
    name: Windows caller context (${{ matrix.arch }})
    if: ${{ github.event.action != 'closed' && !inputs.windows_eh_only }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            runner: windows-latest
          - arch: AArch64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile and observe the original Windows caller context
        run: python scripts/check_windows_context.py --arch ${{ matrix.arch }} --output build-context-oracle
      - name: Observe original Windows cross-page process writes
        run: |
          python -m unittest scripts.tests.test_check_windows_memory_write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_windows_memory_write.py --arch ${{ matrix.arch }} --output build-memory-write-oracle
      - name: Verify original nonempty x87 capture
        if: ${{ matrix.arch == 'X64' }}
        run: python scripts/check_windows_context.py --arch X64 --floating-point --output build-context-fp
      - name: Verify original ARM64 exclusive loops
        if: ${{ matrix.arch == 'AArch64' }}
        run: python scripts/check_aarch64_exclusives.py --output build-exclusive-oracle
      - name: Observe original SIMD exception masks and sticky status
        if: ${{ matrix.arch == 'X64' }}
        run: |
          python -m unittest scripts.tests.test_check_windows_simd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_windows_simd.py --output build-simd-oracle
      - name: Preserve caller context observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-context-${{ matrix.arch }}
          path: |
            build-context-oracle/
            build-context-fp/
            build-simd-oracle/
            build-exclusive-oracle/
            build-memory-write-oracle/
          if-no-files-found: error
          retention-days: 14

  windows-eh-cxx-fixtures:
    name: Windows EH (MSVC PE32 C++ source fixtures)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_eh_only && inputs.windows_eh_replay_artifact_run == '' && inputs.windows_eh_llvm_artifact_run != '' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Select the native x86 MSVC compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x86
      - name: Build and execute genuine value/reference source images
        run: python scripts/check_windows_registration_cxx.py --output build-windows-eh/cxx-source-inputs --capture-runtime-libraries
      - name: Preserve the exact native MSVC source inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-eh-msvc-pe32-cxx-sources
          path: build-windows-eh/cxx-source-inputs/
          if-no-files-found: error
          retention-days: 14

  windows-eh-focused:
    name: Windows EH (x86 Wine and ARM32 PE contracts)
    needs: windows-eh-cxx-fixtures
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.windows_eh_only && inputs.windows_eh_replay_artifact_run == '' && (inputs.windows_eh_llvm_artifact_run == '' || needs.windows-eh-cxx-fixtures.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'
      - name: Initialize pinned compiler, decoder, signatures and binary corpus
        run: git submodule update --init --depth 1 third_party/llvm-project third_party/capstone signatures unittests/corpus
      - name: Install cross-target tooling and the PE32 Wine runtime
        timeout-minutes: 25
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=40 \
            install --yes --no-install-recommends lld wine wine32:i386
      - name: Verify runtime evidence admission
        run: python -m unittest scripts.tests.test_check_windows_registration_eh scripts.tests.test_check_windows_registration_frame scripts.tests.test_check_windows_registration_cookie scripts.tests.test_check_windows_registration_cxx_rewrite scripts.tests.test_check_windows_registration_realigned scripts.tests.test_check_windows_registration_realigned_rewrite scripts.tests.test_check_windows_registration_multiple_catch scripts.tests.test_check_windows_registration_nested_try scripts.tests.test_check_windows_registration_entry scripts.tests.test_check_windows_registration_relift scripts.tests.test_windows_registration_libraries scripts.tests.test_windows_registration_runtime -v
      - name: Fetch genuine MSVC C++ source inputs
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-eh-msvc-pe32-cxx-sources
          path: build-windows-eh/cxx-source-inputs
      - name: Observe original x86 SEH and C++ EH across GS and optimization modes
        run: python scripts/check_windows_registration_eh.py --output build-windows-eh/evidence/original-runtime --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Fetch the exact compiler build for native registration reconstruction
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_BUILD_RUN: ${{ inputs.windows_eh_llvm_artifact_run }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess, tarfile
          from pathlib import Path
          run = os.environ['LLVM_BUILD_RUN']
          assert re.fullmatch(r'[1-9][0-9]*', run), 'invalid compiler run ID'
          repo = 'NeverSight/llvm-project'
          info = json.loads(subprocess.check_output([
              'gh', 'run', 'view', run, '--repo', repo,
              '--json', 'headSha,status,conclusion']))
          revision = subprocess.check_output([
              'git', '-C', 'third_party/llvm-project', 'rev-parse', 'HEAD'], text=True).strip()
          assert info == {'headSha': revision, 'status': 'completed',
                          'conclusion': 'success'}, info
          destination = Path(os.environ['RUNNER_TEMP']) / 'registration-llvm'
          destination.mkdir()
          subprocess.run(['gh', 'run', 'download', run, '--repo', repo,
                          '--name', 'neverd-llvm-linux-x86_64',
                          '--dir', str(destination)], check=True)
          archive = destination / 'neverd-llvm-linux-x86_64.tar.xz'
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = archive.with_suffix('.xz.sha256').read_text().split()[0]
          assert digest == expected, 'compiler archive hash differs'
          with tarfile.open(archive) as package:
              buildinfo = package.extractfile('neverd-llvm-linux-x86_64/BUILDINFO.txt').read().decode()
              assert re.findall(r'^llvm_commit: (.+)$', buildinfo, re.M) == [revision], buildinfo
              header = package.extractfile('neverd-llvm-linux-x86_64/include/llvm/MC/BinaryRewrite.h').read()
              assert b'#define LLVM_NEVERD_X86_REGISTRATION_EH 1' in header
              assert b'#define LLVM_NEVERD_X86_REGISTRATION_COOKIES 1' in header
              assert b'#define LLVM_NEVERD_X86_REGISTRATION_GS 1' in header
              assert b'#define LLVM_NEVERD_X86_CXX_HANDLER_RECEIPTS 1' in header
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'REGISTRATION_LLVM_ARCHIVE_DIR={destination}\n')
              output.write(f'REGISTRATION_LLVM_ARCHIVE_SHA256={digest}\n')
          PY
      - name: Configure focused loader, IR and rewrite checks
        run: |
          compiler_args=()
          if [[ -n "${REGISTRATION_LLVM_ARCHIVE_DIR:-}" ]]; then
            compiler_args+=(
              "-DNEVERD_LLVM_PREBUILT_TAG=registration-ci-${GITHUB_RUN_ID}"
              "-DNEVERD_LLVM_PREBUILT_BASE_URL=file://${REGISTRATION_LLVM_ARCHIVE_DIR}"
              "-DNEVERD_LLVM_PREBUILT_SHA256=${REGISTRATION_LLVM_ARCHIVE_SHA256}"
              "-DNEVERD_LLVM_PREBUILT_CACHE_DIR=${RUNNER_TEMP}/registration-llvm-cache")
          fi
          cmake -S . -B build-windows-eh -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_GUI=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_CPU_EMULATION=OFF -DNEVERD_ENABLE_DRIVER_EMULATION=OFF \
            -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=ON \
            "${compiler_args[@]}"
      - name: Build x86 and ARM32 exception owners
        run: |
          cmake --build build-windows-eh --parallel 4 --target \
            NeverDRegistrationStateTests NeverDRegistrationEHTests NeverDLiftTests \
            NeverDMedStackAlignmentTests NeverDNoReturnTests \
            NeverDWindowsRegistrationFrameTests NeverDWindowsRegistrationRealignedTests \
            NeverDWindowsEHMetadataEncoderTests NeverDWindowsEHCorpusTests \
            NeverDCOFFExceptionPatchTests NeverDWindowsRegistrationNativeTests neverd
      - name: Verify registration state and canonical LLVM metadata
        env:
          NEVERD_REGISTRATION_RUNTIME_OBJECT: build-windows-eh/evidence/frame-runtime.obj
          NEVERD_REGISTRATION_EH4_RUNTIME_OBJECT: build-windows-eh/evidence/eh4-cookie-frame.obj
          NEVERD_REGISTRATION_EH4_GS_RUNTIME_OBJECT: build-windows-eh/evidence/eh4-gs-cookie-frame.obj
          NEVERD_REGISTRATION_CXX_RUNTIME_OBJECT: build-windows-eh/evidence/cxx-catch-frame.obj
        run: |
          build-windows-eh/bin/NeverDRegistrationStateTests --gtest_output=xml:build-windows-eh/evidence/state.xml
          build-windows-eh/bin/NeverDRegistrationEHTests --gtest_output=xml:build-windows-eh/evidence/registration.xml
          build-windows-eh/bin/NeverDMedStackAlignmentTests --gtest_output=xml:build-windows-eh/evidence/stack.xml
          build-windows-eh/bin/NeverDNoReturnTests --gtest_output=xml:build-windows-eh/evidence/noreturn.xml
          build-windows-eh/bin/NeverDWindowsRegistrationFrameTests --gtest_output=xml:build-windows-eh/evidence/frame.xml
          build-windows-eh/bin/NeverDWindowsEHMetadataEncoderTests --gtest_output=xml:build-windows-eh/evidence/metadata.xml
          build-windows-eh/bin/NeverDCOFFExceptionPatchTests --gtest_output=xml:build-windows-eh/evidence/planner.xml
          build-windows-eh/bin/NeverDWindowsRegistrationRealignedTests \
            --gtest_filter=RegistrationRethrowHighC.*:RegistrationThrowHighC.* \
            --gtest_output=xml:build-windows-eh/evidence/rethrow-source.xml
      - name: Execute generated x86 callback frames with real exceptions
        run: |
          python scripts/check_windows_registration_frame.py \
            --object build-windows-eh/evidence/frame-runtime.obj \
            --output build-windows-eh/evidence/callback-runtime \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Execute and relift realigned x86 catch callbacks
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          python scripts/check_windows_registration_realigned.py \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationRealignedTests \
            --runtime-libs build-windows-eh/cxx-source-inputs/runtime-libs \
            --output build-windows-eh/evidence/realigned-callback \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Verify x86 recovery and ARM32 cross-target PE reconstruction
        run: |
          build-windows-eh/bin/NeverDLiftTests \
            --gtest_filter='COFFException*:*ARM32*:PatchCOFF_ARM32.*:MedSSAMultiRoot.*:MedTempIdentity.*:MedSEHEstablisherFrame.*:MedSEHHandlerEntry.*:Win64Forwarder.*' \
            --gtest_output=xml:build-windows-eh/evidence/ir-pe.xml
          build-windows-eh/bin/NeverDWindowsEHCorpusTests \
            --gtest_filter='WindowsEHCorpus.RecoversX86RegistrationChains:WindowsEHCorpus.MasksThumbBitInARM32LanguageTables:WindowsEHCorpus.DecodesARMUnwindOperations:WindowsEHCorpus.ParsesDeclaredExceptionMetadata' \
            --gtest_output=xml:build-windows-eh/evidence/corpus.xml
      - name: Reconstruct and execute realigned value and reference catches
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          python scripts/check_windows_registration_realigned_rewrite.py \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationRealignedTests \
            --patch-binary build-windows-eh/bin/neverd \
            --runtime-libs build-windows-eh/cxx-source-inputs/runtime-libs \
            --output build-windows-eh/evidence/realigned-rewrite \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Reconstruct ordered value, reference and catch-all clauses
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        env:
          WINEARCH: win32
        run: |
          WINEPREFIX="$RUNNER_TEMP/neverd-wine32" \
          python scripts/check_windows_registration_multiple_catch.py \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationRealignedTests \
            --patch-binary build-windows-eh/bin/neverd \
            --runtime-libs build-windows-eh/cxx-source-inputs/runtime-libs \
            --output build-windows-eh/evidence/multiple-catch-rewrite
      - name: Reconstruct nested x86 tries, direct scalar throws and rethrows
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        env:
          WINEARCH: win32
        run: |
          WINEPREFIX="$RUNNER_TEMP/neverd-wine32" \
          python scripts/check_windows_registration_nested_try.py \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationRealignedTests \
            --patch-binary build-windows-eh/bin/neverd \
            --runtime-libs build-windows-eh/cxx-source-inputs/runtime-libs \
            --output build-windows-eh/evidence/nested-try-rewrite
      - name: Reconstruct x86 C++ entries across Microsoft calling conventions
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        env:
          WINEARCH: win32
        run: |
          WINEPREFIX="$RUNNER_TEMP/neverd-wine32" \
          python scripts/check_windows_registration_entry.py \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
            --patch-binary build-windows-eh/bin/neverd \
            --runtime-libs build-windows-eh/cxx-source-inputs/runtime-libs \
            --output build-windows-eh/evidence/entry-rewrite
      - name: Re-lift and reconstruct generated x86 C++ entries
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        env:
          WINEARCH: win32
        run: |
          WINEPREFIX="$RUNNER_TEMP/neverd-wine32" \
          python scripts/check_windows_registration_relift.py \
            --input-root build-windows-eh/evidence/entry-rewrite \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
            --patch-binary build-windows-eh/bin/neverd \
            --output build-windows-eh/evidence/relift-rewrite
      - name: Execute strict generated EH4 and GS cookie contracts
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          python scripts/check_windows_registration_cookie.py \
            --object build-windows-eh/evidence/eh4-cookie-frame.obj \
            --output build-windows-eh/evidence/eh4-cookie-runtime \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
          python scripts/check_windows_registration_cookie.py --gs \
            --object build-windows-eh/evidence/eh4-gs-cookie-frame.obj \
            --output build-windows-eh/evidence/eh4-gs-cookie-runtime \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Execute reconstructed SEH3 and EH4 source through both CLI modes and rebasing
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
            --gtest_filter=-WindowsRegistrationNative.InputPE32PreservesItsCheckedSourceContract:WindowsRegistrationCxxSource.*:RegistrationEntryABI.InputPE32*:RegistrationRelift.InputPE32* \
            --gtest_output=xml:build-windows-eh/evidence/native.xml
          for registration_case in filter nested-finally continue-search continue-execution normal-finally cdecl-parameter cdecl-parameter-write eh4-filter eh4-nested-finally eh4-continue-search eh4-continue-execution eh4-normal-finally eh4-cdecl-parameter eh4-cdecl-parameter-write eh4-gs-filter eh4-gs-nested-finally eh4-gs-continue-search eh4-gs-continue-execution eh4-gs-normal-finally eh4-gs-cdecl-parameter eh4-gs-cdecl-parameter-write; do
            python scripts/check_windows_registration_rewrite.py \
              --test-binary build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
              --patch-binary build-windows-eh/bin/neverd --case "$registration_case" \
              --output "build-windows-eh/evidence/source-${registration_case}" \
              --wine-prefix "$RUNNER_TEMP/neverd-wine32"
          done
      - name: Execute actual source C++ reconstruction with ordered cleanups and reference effects
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          python scripts/check_windows_registration_cxx_rewrite.py \
            --input-root build-windows-eh/cxx-source-inputs \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
            --patch-binary build-windows-eh/bin/neverd \
            --output build-windows-eh/evidence/source-cxx \
            --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Execute catch SavedESP overwrite and continuation-read probes
        if: ${{ inputs.windows_eh_llvm_artifact_run != '' }}
        run: |
          python scripts/check_windows_registration_cxx_rewrite.py \
            --input-root build-windows-eh/cxx-source-inputs \
            --test-binary build-windows-eh/bin/NeverDWindowsRegistrationNativeTests \
            --patch-binary build-windows-eh/bin/neverd \
            --output build-windows-eh/evidence/source-cxx-snapshot \
            --saved-stack-probe --wine-prefix "$RUNNER_TEMP/neverd-wine32"
      - name: Require executed checks without missing-fixture skips
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('build-windows-eh/evidence')
          for name in ('state', 'registration', 'stack', 'noreturn', 'frame', 'metadata', 'planner', 'rethrow-source', 'ir-pe', 'corpus'):
              result = ET.parse(root / (name + '.xml')).getroot()
              assert int(result.get('tests', '0')) > 0, name
              assert not result.findall('.//skipped'), name
          if '${{ inputs.windows_eh_llvm_artifact_run }}':
              for profile in ('source-cxx', 'source-cxx-snapshot'):
                  for case in ('value', 'reference'):
                      result = ET.parse(root / profile / case / 'rewrite.xml').getroot()
                      assert int(result.get('tests', '0')) == 1, (profile, case)
                      assert not result.findall('.//skipped'), (profile, case)
                      assert not int(result.get('failures', '0')), (profile, case)
                      assert not int(result.get('errors', '0')), (profile, case)
          PY
      - name: Preserve runtime and cross-target evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-eh-x86-runtime-arm32-contracts
          path: |
            build-windows-eh/evidence/
            build-windows-eh/CMakeCache.txt
            build-windows-eh/unittests/lift/test_patch_coff_arm_seh.exe
          if-no-files-found: error
          retention-days: 14

  windows-eh-native-replay:
    name: Windows EH (native PE32 replay)
    needs: windows-eh-focused
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.windows_eh_only && (inputs.windows_eh_replay_artifact_run != '' || (needs.windows-eh-focused.result == 'success' && inputs.windows_eh_llvm_artifact_run != '')) }}
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_eh_replay_artifact_run || github.run_id }}
          name: windows-eh-x86-runtime-arm32-contracts
          path: build-windows-eh
      - name: Diagnose an existing original-image baseline
        if: ${{ inputs.windows_eh_replay_artifact_run != '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/check_windows_registration_native_diagnostics.py --root build-windows-eh
      - name: Select the native x86 MSVC compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Establish genuine C++ cleanup and catch-object ABI baselines
        shell: pwsh
        run: |
          $frame = "build-windows-eh/evidence/cxx-catch-frame.obj"
          if (Test-Path $frame) {
            python scripts/check_windows_registration_cxx.py --output build-windows-eh/cxx-original --frame-object $frame
          } elseif ("${{ inputs.windows_eh_replay_artifact_run }}" -ne "" -and "${{ inputs.windows_eh_cxx_frame_only }}" -ne "true") {
            python scripts/check_windows_registration_cxx.py --output build-windows-eh/cxx-original
          } else {
            throw "The exact compiler build did not produce the required C++ catch-frame object"
          }
      - name: Execute the exact original and reconstructed images with the Windows CRT
        if: ${{ !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration.py --evidence-root build-windows-eh/evidence --source-profile ${{ inputs.windows_eh_replay_artifact_run != '' && 'seh3-eh4' || 'all' }} --output build-windows-eh/native-replay.json
      - name: Execute the exact installed C++ source images with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_cxx.py --evidence-root build-windows-eh/evidence/source-cxx --output build-windows-eh/native-cxx-replay.json
      - name: Replay the identical catch SavedESP probes with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_cxx.py --evidence-root build-windows-eh/evidence/source-cxx-snapshot --output build-windows-eh/native-cxx-snapshot-replay.json
      - name: Replay the identical realigned callback probes with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_realigned.py --evidence-root build-windows-eh/evidence/realigned-callback --output build-windows-eh/native-realigned-replay.json
      - name: Replay identical realigned source reconstructions with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_realigned_rewrite.py --evidence-root build-windows-eh/evidence/realigned-rewrite --output build-windows-eh/native-realigned-rewrite-replay.json
      - name: Replay identical ordered catch reconstructions with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_multiple_catch.py --evidence-root build-windows-eh/evidence/multiple-catch-rewrite --output build-windows-eh/native-multiple-catch-replay.json
      - name: Replay identical nested try reconstructions with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_nested_try.py --evidence-root build-windows-eh/evidence/nested-try-rewrite --output build-windows-eh/native-nested-try-replay.json

      - name: Replay identical entry ABI reconstructions with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_entry.py --evidence-root build-windows-eh/evidence/entry-rewrite --output build-windows-eh/native-entry-replay.json

      - name: Replay both x86 C++ rewrite generations with the Windows CRT
        if: ${{ inputs.windows_eh_replay_artifact_run == '' && !inputs.windows_eh_cxx_frame_only }}
        run: python scripts/replay_windows_registration_relift.py --evidence-root build-windows-eh/evidence/relift-rewrite --output build-windows-eh/native-relift-replay.json

      - name: Preserve native loader evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-eh-native-pe32-runtime
          path: |
            build-windows-eh/native-replay.json
            build-windows-eh/native-cxx-replay.json
            build-windows-eh/native-cxx-snapshot-replay.json
            build-windows-eh/native-realigned-replay.json
            build-windows-eh/native-realigned-rewrite-replay.json
            build-windows-eh/native-multiple-catch-replay.json
            build-windows-eh/native-nested-try-replay.json
            build-windows-eh/native-entry-replay.json
            build-windows-eh/native-relift-replay.json
            build-windows-eh/runtime-diagnostics.json
            build-windows-eh/cxx-original/
          if-no-files-found: error
          retention-days: 14
