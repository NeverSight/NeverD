name: CI
run-name: Native Linux x87 and 32-bit HighC boundary qualification / ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      NEVERD_THREADS: '1'
      NEVERD_SIGNATURE_CACHE: 'off'
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - run: git submodule update --init --recursive --depth 1 third_party/capstone third_party/unicorn
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: 'v0.16.0'
      - name: Install the original native fixture toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build lld llvm python3-dev g++-multilib libc6-dev-i386
          mkdir -p build-linux-boundaries/evidence
          clang --version > build-linux-boundaries/evidence/toolchain.txt
          cmake --version >> build-linux-boundaries/evidence/toolchain.txt
          uname -a >> build-linux-boundaries/evidence/toolchain.txt
      - name: Configure and build only the actual owning targets
        run: |
          cmake -S . -B build-linux-boundaries -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_SHARED=ON -DNEVERD_ENABLE_CPU_EMULATION=ON -DNEVERD_EMULATION_BACKEND_UNICORN=ON -DNEVERD_ENABLE_DRIVER_EMULATION=OFF -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_BUILD_PLUGINS=OFF -DNEVERD_BUILD_GUI=OFF -DNEVERD_BUILD_WORKER=OFF -DNEVERD_BUILD_WEB_MCP=OFF
          cmake --build build-linux-boundaries --target NeverDARM32ObjectImmediateTests NeverDX87CallGraphTests NeverDLLVMScalarEquivalenceTests neverd unittests/lift/test_x87_fpu32.o --parallel 4
      - name: Execute the complete native x87 and 32-bit HighC owners
        run: python scripts/linux-boundary-qualification.py
      - name: Preserve all completed and failed native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-native-boundary-evidence
          path: |
            build-linux-boundaries/evidence/
            build-linux-boundaries/CMakeCache.txt
          if-no-files-found: error
          retention-days: 14
