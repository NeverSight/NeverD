                  ("HighPrivateFrameStores.DiscardsUnreadPaddingAndPreservesBranchEntry",
                   "NeverDLiftTests", "NeverDHighControlFlowTests"),
                  ("HighPrivateFrameStores.KeepsReadsEscapesEffectsAndUnprovenRanges",
