name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dll-native-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - shell: pwsh
        run: |
          cl /nologo /W4 scripts/diagnostics/unpack_dll_native.c /Fe:probe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = [Convert]::FromBase64String([IO.File]::ReadAllText("scripts/diagnostics/public-fixtures.zip.b64"))
          [IO.File]::WriteAllBytes("public-fixtures.zip", $data)
          Expand-Archive public-fixtures.zip -DestinationPath cases
          New-Item -ItemType Directory evidence | Out-Null
          foreach ($dir in Get-ChildItem cases -Directory) {
            Copy-Item probe.exe $dir.FullName
            Push-Location $dir.FullName
            & .\host.exe *> "../../evidence/$($dir.Name)-host.txt"
            $status = $LASTEXITCODE
            "host status=$status" | Add-Content "../../evidence/$($dir.Name)-host.txt"
            & .\probe.exe *> "../../evidence/$($dir.Name)-probe.txt"
            $status = $LASTEXITCODE
            "probe status=$status" | Add-Content "../../evidence/$($dir.Name)-probe.txt"
            Pop-Location
          }
          Get-Content evidence/*.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-dll-native-diagnostic
          path: evidence/
