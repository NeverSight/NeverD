name: CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/*.md'
  pull_request:
    # closed cancels this PR's run through its concurrency group; no job runs.
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      use_prebuilt_llvm:
        description: 'Use the published prebuilt NeverD LLVM packages'
        required: true
        type: boolean
        default: false
      native_cpu_only:
        description: 'Run focused native CPU regressions with prebuilt LLVM'
        required: true
        type: boolean
        default: false
      native_arm64_only:
        description: 'Run ARM64 backend component builds and host setup probes'
        required: true
        type: boolean
        default: false
      windows_eh_only:
        description: 'Run x86 registration EH/Wine probes and ARM32 PE exception contracts'
        required: true
        type: boolean
        default: false
      windows_eh_llvm_artifact_run:
        description: 'Optional exact-revision LLVM build run for native PE32 rewrite execution'
        required: false
        type: string
        default: ''
      windows_eh_replay_artifact_run:
        description: 'Replay existing Windows EH evidence without rebuilding it'
        required: false
        type: string
        default: ''
      windows_eh_cxx_frame_only:
        description: 'Validate only an existing generated C++ frame object with the native MSVC CRT'
        required: true
        type: boolean
        default: false
      native_cpu_backend:
        description: 'Native x64 transport for the native_cpu_only profile'
        required: true
        type: choice
        default: whp
        options:
          - whp
          - kvm
      native_driver_tests:
        description: 'Include original driver outcomes in the native_cpu_only profile'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ inputs.windows_eh_cxx_frame_only && '-cxx-frame' || '' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    if: ${{ github.event.action != 'closed' && !inputs.native_cpu_only && !inputs.native_arm64_only && !inputs.windows_eh_only }}
    runs-on: ${{ matrix.runner }}
    env:
      NEVERD_LLVM_PREBUILT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.use_prebuilt_llvm && 'ON' || 'OFF' }}
      SCCACHE_GHA_ENABLED: 'true'
      GOTOOLCHAIN: local
      NEVERD_SOURCE_DIALECT_CORPUS: ${{ github.workspace }}/build-ci/source-dialects/corpus
      NEVERD_SOURCE_DIALECT_FILE: ${{ github.workspace }}/build-ci/source-dialects/corpus/x64-c.c
      NEVERD_SOURCE_DIALECT: go

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            parallel: 4
            test_profile: linux-semantic
            exclude_labels: '^NeverDPatchFullTests$'
            python: python3
            python_version: '3.12'
          - name: macOS arm64
            runner: macos-15
            cc: clang
            cxx: clang++
            parallel: 3
            test_profile: macos-patch
            exclude_labels: '^NeverDSemanticTests$'
            python: python3
            python_version: '3.12'
          - name: Windows x64
            runner: windows-latest
            cc: cl
            cxx: cl
            parallel: 4
            test_profile: windows-focused
            exclude_labels: '^NeverD(Semantic|PatchFull)Tests$'
            python: python
            python_version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Go for source differential tests
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up and verify source dialect compilers
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustc_path="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          echo "NEVERD_TEST_RUSTC=$rustc_path" >> "$GITHUB_ENV"
          mkdir -p build-ci/source-dialects
          rustup run "$RUST_TOOLCHAIN" rustc --version > build-ci/source-dialects/toolchains.txt
          go version >> build-ci/source-dialects/toolchains.txt
          cat build-ci/source-dialects/toolchains.txt
        env:
          RUST_TOOLCHAIN: '1.93.1'

      # Keep the default source-built LLVM contract while avoiding recompiling
      # unchanged LLVM and NeverD translation units on every runner.  The GHA
      # backend is content-addressed, so compiler flags and source changes
      # naturally miss instead of reusing an incompatible object.
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Prepare current hosted account KVM access
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/prepare_kvm_ci.py --output build-ci/emulation-focused/device-access.json

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify Unix toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --version
          ninja --version
          "$CC" --version
          ld.lld --version
        env:
          CC: ${{ matrix.cc }}

      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          where.exe cl
          where.exe clang
          where.exe ld.lld
          where.exe lld-link

      - name: Verify CTest outcome tooling
        shell: bash
        run: '"$PYTHON" scripts/audit_ci_test_results.py check-tool'
        env:
          PYTHON: ${{ matrix.python }}

      - name: Verify Debug and Release target flags
        shell: bash
        run: |
          "$PYTHON" -m unittest \
            scripts.tests.test_debug_build_configuration \
            scripts.tests.test_ci_configuration \
            scripts.tests.test_audit_ci_test_inventory \
            scripts.tests.test_audit_ci_test_results \
            scripts.tests.test_prepare_source_dialect_corpus \
            scripts.tests.test_run_native_cpu_ci \
            scripts.tests.test_probe_native_host \
            scripts.tests.test_run_native_cpu_methods \
            scripts.tests.test_first_fatal_snapshots \
            scripts.tests.test_neverd_bench_harness \
            scripts.tests.test_audit_evm_opcode_metadata \
            scripts.tests.test_eh_signature_generation \
            scripts.tests.test_msvc_signature_generation \
            scripts.tests.test_generate_rich_comp_ids \
            scripts.tests.test_generate_objc_declarations \
            scripts.tests.test_generate_objc_framework_declarations \
            scripts.tests.test_generate_objc_receiver_declarations \
            scripts.tests.test_generate_objc_format_declarations \
            scripts.tests.test_generate_objc_predicate_declarations \
            scripts.tests.test_generate_darwin_format_declarations \
            scripts.tests.test_generate_darwin_block_declarations \
            scripts.tests.test_generate_darwin_declarations \
            scripts.tests.test_generate_darwin_data_declarations \
            scripts.tests.test_generate_swift_runtime_declarations \
            scripts.tests.test_generate_swift_metadata_declarations \
            -v
          "$PYTHON" -m unittest discover \
            -s pluginsdk/python/tests -v
          "$PYTHON" -m unittest \
            scripts.tests.test_check_capabilities \
            scripts.tests.test_check_docs_i18n \
            scripts.tests.test_check_python_plugin_sdk \
            scripts.tests.test_check_source_provenance -v
          "$PYTHON" scripts/check_capabilities.py
          "$PYTHON" scripts/check_python_plugin_sdk.py
          "$PYTHON" scripts/check_source_provenance.py --history-commits 16
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python

      # Ten locales plus the English source is one shared set of files, and
      # which host reads them cannot change the answer, so one leg settles it
      # for all three.  It runs before the configure below because a broken
      # link is worth hearing about in seconds rather than after a build.
      - name: Check the localized documentation matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$PYTHON" scripts/check_docs_i18n.py
        env:
          PYTHON: ${{ matrix.python }}

      # The corpus is a submodule of pinned real binaries, and the configure
      # below turns its tests on unconditionally so that a checkout which did
      # not bring it fails here rather than quietly running without it.  What
      # that costs is a clear message when it is the network and not the code
      # that went wrong.
      - name: Verify the pinned binary corpus
        shell: bash
        run: |
          missing=0
          for line in windows-eh rust-eh go-eh cxx-itanium-eh objc-eh ada-d-eh; do
            manifest="unittests/corpus/manifests/$line.json"
            if [[ ! -f "$manifest" ]]; then
              echo "missing $manifest" >&2
              missing=1
              continue
            fi
            count="$("$PYTHON" -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["artifacts"]))' "$manifest")"
            echo "$line: $count pinned artifacts"
          done
          if [[ "$missing" != 0 ]]; then
            echo "the unittests/corpus submodule did not check out" >&2
            exit 1
          fi
        env:
          PYTHON: ${{ matrix.python }}

      - name: Configure Release build
        shell: bash
        run: |
          PYTHON_EXECUTABLE="$("$PYTHON" -c 'import sys; print(sys.executable)')"
          cmake -E make_directory build-ci/.cmake/api/v1/query
          cmake -E touch build-ci/.cmake/api/v1/query/codemodel-v2
          cmake -E touch build-ci/.cmake/api/v1/query/cmakeFiles-v1
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=ON \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=ON \
            -DNEVERD_ENABLE_DRIVER_EMULATION=ON \
            -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DNEVERD_LLVM_PREBUILT="$NEVERD_LLVM_PREBUILT_MODE"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}

      - name: Build default targets
        id: default_build
        shell: bash
        run: |
          cmake --build build-ci --config Release --parallel "$BUILD_PARALLEL"
          cmake -E touch build-ci/.neverd-capability-build-complete
        env:
          BUILD_PARALLEL: ${{ matrix.parallel }}

      - name: Generate native source dialect corpus
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" scripts/prepare_source_dialect_corpus.py \
            --neverd build-ci/bin/neverd \
            --output build-ci/source-dialects
        env:
          PYTHON: ${{ matrix.python }}

      - name: Run emulation regressions
        id: emulation
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          evidence="$PWD/build-ci/emulation-focused"
          cmake -E make_directory "$evidence"
          ctest --test-dir build-ci/unittests/emulation \
            --build-config Release --show-only=json-v1 > "$evidence/inventory.json"
          ctest --test-dir build-ci/unittests/emulation \
            --build-config Release --no-tests=error \
            --parallel "$TEST_PARALLEL" --output-on-failure \
            --output-junit "$evidence/results.xml" \
            --output-log "$evidence/ctest.log"
        env:
          TEST_PARALLEL: ${{ matrix.parallel }}

      - name: Upload emulation regression evidence
        if: ${{ always() && steps.emulation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: emulation-focused-${{ matrix.test_profile }}
          path: build-ci/emulation-focused/
          if-no-files-found: error
          retention-days: 14

      - name: Run and audit mobile native regressions
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          from scripts.audit_ci_test_inventory import TestRecord, parse_inventory
          from scripts.audit_ci_test_results import parse_junit

          expected = tuple(
