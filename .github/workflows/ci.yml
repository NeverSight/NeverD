name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      use_prebuilt_llvm:
        description: 'Use the published prebuilt NeverD LLVM packages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      NEVERD_LLVM_PREBUILT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.use_prebuilt_llvm && 'ON' || 'OFF' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            parallel: 4
            test_profile: linux-semantic
            exclude_labels: '^NeverDPatchFullTests$'
            python: python3
            python_version: '3.12'
          - name: macOS arm64
            runner: macos-15
            cc: clang
            cxx: clang++
            parallel: 3
            test_profile: macos-patch
            exclude_labels: '^NeverDSemanticTests$'
            python: python3
            python_version: '3.12'
          - name: Windows x64
            runner: windows-latest
            cc: cl
            cxx: cl
            parallel: 4
            test_profile: windows-focused
            exclude_labels: '^NeverD(Semantic|PatchFull)Tests$'
            python: python
            python_version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify Unix toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --version
          ninja --version
          "$CC" --version
          ld.lld --version
        env:
          CC: ${{ matrix.cc }}

      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          where.exe cl
          where.exe clang
          where.exe ld.lld
          where.exe lld-link

      - name: Verify Debug and Release target flags
        shell: bash
        run: |
          "$PYTHON" -m unittest \
            scripts.tests.test_debug_build_configuration \
            scripts.tests.test_audit_evm_opcode_metadata \
            scripts.tests.test_eh_signature_generation \
            -v
          "$PYTHON" -m unittest discover \
            -s pluginsdk/python/tests -v
          "$PYTHON" -m unittest \
            scripts.tests.test_check_capabilities \
            scripts.tests.test_check_docs_i18n \
            scripts.tests.test_check_python_plugin_sdk \
            scripts.tests.test_check_source_provenance -v
          "$PYTHON" scripts/check_capabilities.py
          "$PYTHON" scripts/check_python_plugin_sdk.py
          "$PYTHON" scripts/check_source_provenance.py --history-commits 16
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python

      # Ten locales plus the English source is one shared set of files, and
      # which host reads them cannot change the answer, so one leg settles it
      # for all three.  It runs before the configure below because a broken
      # link is worth hearing about in seconds rather than after a build.
      - name: Check the localized documentation matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$PYTHON" scripts/check_docs_i18n.py
        env:
          PYTHON: ${{ matrix.python }}

      # The corpus is a submodule of pinned real binaries, and the configure
      # below turns its tests on unconditionally so that a checkout which did
      # not bring it fails here rather than quietly running without it.  What
      # that costs is a clear message when it is the network and not the code
      # that went wrong.
      - name: Verify the pinned binary corpus
        shell: bash
        run: |
          missing=0
          for line in windows-eh rust-eh go-eh cxx-itanium-eh objc-eh ada-d-eh; do
            manifest="unittests/corpus/manifests/$line.json"
            if [[ ! -f "$manifest" ]]; then
              echo "missing $manifest" >&2
              missing=1
              continue
            fi
            count="$("$PYTHON" -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["artifacts"]))' "$manifest")"
            echo "$line: $count pinned artifacts"
          done
          if [[ "$missing" != 0 ]]; then
            echo "the unittests/corpus submodule did not check out" >&2
            exit 1
          fi
        env:
          PYTHON: ${{ matrix.python }}

      - name: Configure Release build
        shell: bash
        run: |
          PYTHON_EXECUTABLE="$("$PYTHON" -c 'import sys; print(sys.executable)')"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=ON \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=ON \
            -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DNEVERD_LLVM_PREBUILT="$NEVERD_LLVM_PREBUILT_MODE"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}

      - name: Build default targets
        shell: bash
        run: cmake --build build-ci --config Release --parallel "$BUILD_PARALLEL"
        env:
          BUILD_PARALLEL: ${{ matrix.parallel }}

      # The C++ side alone cannot prove agreement with the implementation that
      # validators execute. Build the process-isolated oracle from the exact
      # source object and Cargo.lock named by NeverD's typed provenance table,
      # then make the Linux semantic leg treat every skipped oracle case as a
      # configured, executable differential test.
      - name: Build the pinned Anza SBF oracle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-pinned-revision)"
          toolchain="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-toolchain)"
          oracle_source="$RUNNER_TEMP/neverd-sbpf-oracle-source"
          oracle_binary="$GITHUB_WORKSPACE/build-ci/bin/neverd-sbpf-official-oracle"
          git init "$oracle_source"
          git -C "$oracle_source" remote add origin https://github.com/anza-xyz/sbpf.git
          git -C "$oracle_source" fetch --depth=1 origin "$revision"
          git -C "$oracle_source" checkout --detach FETCH_HEAD
          rustup toolchain install "$toolchain" --profile minimal
          "$PYTHON" scripts/build_sbf_official_oracle.py \
            --sbpf-root "$oracle_source" \
            --output "$oracle_binary" \
            --toolchain "$toolchain"
          {
            echo "NEVERD_SBPF_ROOT=$oracle_source"
            echo "NEVERD_SBPF_ORACLE=$oracle_binary"
            echo "NEVERD_REQUIRE_SBPF_ORACLE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      # The loader corpus is large enough that CI should fetch only its one
      # audited fixture directory.  Both the checkout and the C++ gate derive
      # the object identity from SBFUpstreamSources.def, and the required flag
      # turns a missing, partial, or wrong checkout into a hard failure.
      - name: Fetch the pinned Agave ELF-loader corpus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-test-vectors-revision)"
          fixture_root="$RUNNER_TEMP/neverd-firedancer-test-vectors"
          git init "$fixture_root"
          git -C "$fixture_root" remote add origin https://github.com/firedancer-io/test-vectors.git
          git -C "$fixture_root" sparse-checkout init --cone
          git -C "$fixture_root" sparse-checkout set elf_loader/fixtures
          git -C "$fixture_root" fetch --depth=1 origin "$revision"
          git -C "$fixture_root" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture_root" rev-parse HEAD)" = "$revision"
          {
            echo "NEVERD_AGAVE_CONFORMANCE_ROOT=$fixture_root"
            echo "NEVERD_AGAVE_CONFORMANCE_REVISION=$revision"
            echo "NEVERD_REQUIRE_AGAVE_CONFORMANCE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      - name: Run native and Python semantic plugin examples
        shell: bash
        run: |
          build-ci/bin/neverd plugins \
            --plugin-dir build-ci/bin/plugins \
            --run "Semantic Optimizer"
          build-ci/bin/neverd plugins \
            --plugin-dir build-ci/bin/sdk/python/examples \
            --run "Python Semantic Optimizer"

      - name: Audit and select test profile
        id: inventory
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-ci --build-config Release --show-only=json-v1 |
            "$PYTHON" scripts/audit_ci_test_inventory.py \
              --profile "$TEST_PROFILE" \
              --exclude-label-regex "$EXCLUDE_LABELS" \
              --matrix-name "$MATRIX_NAME"
        env:
          EXCLUDE_LABELS: ${{ matrix.exclude_labels }}
          MATRIX_NAME: ${{ matrix.name }}
          PYTHON: ${{ matrix.python }}
          TEST_PROFILE: ${{ matrix.test_profile }}

      - name: Run selected test profile
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-ci \
            --build-config Release \
            --label-exclude "$EXCLUDE_LABELS" \
            --stop-on-failure \
            --output-on-failure \
            --progress \
            --parallel "$TEST_PARALLEL" 2>&1 | tee ctest.log
          executed="$(tr -d '\r' < ctest.log | sed -nE 's/^100% tests passed(, 0 tests failed)? out of ([0-9]+)$/\2/p' | tail -n 1)"
          if [[ "$executed" != "$EXPECTED_TESTS" ]]; then
            echo "CTest executed $executed tests; expected $EXPECTED_TESTS" >&2
            exit 1
          fi
        env:
          EXCLUDE_LABELS: ${{ steps.inventory.outputs.label_exclude }}
          EXPECTED_TESTS: ${{ steps.inventory.outputs.count }}
          TEST_PARALLEL: ${{ matrix.parallel }}

      # The CLI, the typed C entry point and the JSON one are three surfaces
      # over one implementation, and nothing that tests any of them alone would
      # notice them drifting apart.  This needs the built tool and library, so
      # it runs here rather than with the source checks.
      - name: Check the simplifier's surfaces agree
        shell: bash
        run: |
          "$PYTHON" -m unittest scripts.tests.test_simplify_surfaces -v
        env:
          NEVERD_BUILD_DIR: build-ci
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python
