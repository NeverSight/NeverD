name: Temporary FLS native observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fls-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Observe original FLS API behavior
        run: python scripts/fls-native-probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fls-native-observations
          path: |
            build-fls-reference/*.json
            build-fls-reference/*.log
          if-no-files-found: error
          retention-days: 14
