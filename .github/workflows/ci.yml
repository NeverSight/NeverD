name: Native PE mapping probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-pe-mapping:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe native Windows PE mapping
        run: python scripts/diagnostics/pe_mapping_probe/run.py
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pe-mapping
          path: scripts/diagnostics/pe_mapping_probe/observations/
