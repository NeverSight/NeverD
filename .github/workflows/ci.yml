name: CI
run-name: Windows runtime fix qualification / ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-runtime-fixed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      SCCACHE_GHA_ENABLED: 'true'
      NEVERD_THREADS: '1'
      NEVERD_SIGNATURE_CACHE: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 32
      - name: Initialize the pinned runtime dependencies
        shell: bash
        run: git submodule update --init --recursive --depth 1 third_party/capstone third_party/unicorn
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: 'v0.16.0'
      - run: choco install ninja --yes --no-progress
        shell: pwsh
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Record the actual host and fixture tools
        shell: bash
        run: |
          mkdir -p build-windows-runtime/evidence
          git rev-parse HEAD > build-windows-runtime/evidence/source.txt
          cmake --version > build-windows-runtime/evidence/toolchains.txt
          ninja --version >> build-windows-runtime/evidence/toolchains.txt
          clang --version >> build-windows-runtime/evidence/toolchains.txt
          ld.lld --version >> build-windows-runtime/evidence/toolchains.txt
          ld64.lld --version >> build-windows-runtime/evidence/toolchains.txt
          where.exe cl >> build-windows-runtime/evidence/toolchains.txt
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install the original failing Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          echo "NEVERD_TEST_RUSTC=$(rustup which --toolchain 1.93.1 rustc)" >> "$GITHUB_ENV"
          rustup run 1.93.1 rustc --version >> build-windows-runtime/evidence/toolchains.txt
          where.exe link >> build-windows-runtime/evidence/toolchains.txt
          where.exe lld-link >> build-windows-runtime/evidence/toolchains.txt
      - name: Configure the original native owning targets
        shell: pwsh
        run: |
          cmake -S . -B build-windows-runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_TESTING=ON -DNEVERD_LLVM_PREBUILT=ON -DNEVERD_BUILD_SHARED=OFF -DNEVERD_ENABLE_CPU_EMULATION=ON -DNEVERD_EMULATION_BACKEND_UNICORN=ON -DNEVERD_ENABLE_DRIVER_EMULATION=ON -DNEVERD_ENABLE_SEMANTIC_TESTS=OFF -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_BUILD_GUI=OFF -DNEVERD_BUILD_WORKER=OFF -DNEVERD_BUILD_WEB_MCP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows-runtime --target NeverDWindowsTimerProbe --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure per-entry Unicorn timer retirement
        shell: bash
        run: build-windows-runtime/bin/NeverDWindowsTimerProbe.exe | tee build-windows-runtime/evidence/raw-timer.jsonl
      - name: Preserve timer measurements before the C++ build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-runtime-fixed-timer-probe
          path: build-windows-runtime/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Build the original failing owners
        shell: pwsh
        run: |
          cmake --build build-windows-runtime --target NeverDX64IntegerTests NeverDNativeDriverTests NeverDSourceDialectTests NeverDCPUEmulationTests NeverDRunControlTests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify deadline and linker fixes on native Windows
        shell: bash
        run: python scripts/windows-runtime-qualify.py
      - name: Preserve completed and failed epochs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-runtime-fixed-evidence
          path: |
            build-windows-runtime/evidence/
            build-windows-runtime/CMakeCache.txt
            build-windows-runtime/Testing/Temporary/LastTest.log
            build-windows-runtime/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: error
          retention-days: 14
