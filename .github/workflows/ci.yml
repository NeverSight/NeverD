name: CI

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:
    inputs:
      use_prebuilt_llvm:
        description: 'Use the published prebuilt NeverD LLVM packages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      NEVERD_LLVM_PREBUILT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.use_prebuilt_llvm && 'ON' || 'OFF' }}
      SCCACHE_GHA_ENABLED: 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            parallel: 4
            test_profile: linux-semantic
            exclude_labels: '^NeverDPatchFullTests$'
            python: python3
            python_version: '3.12'
          - name: macOS arm64
            runner: macos-15
            cc: clang
            cxx: clang++
            parallel: 3
            test_profile: macos-patch
            exclude_labels: '^NeverDSemanticTests$'
            python: python3
            python_version: '3.12'
          - name: Windows x64
            runner: windows-latest
            cc: cl
            cxx: cl
            parallel: 4
            test_profile: windows-focused
            exclude_labels: '^NeverD(Semantic|PatchFull)Tests$'
            python: python
            python_version: '3.12'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 32
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      # Keep the default source-built LLVM contract while avoiding recompiling
      # unchanged LLVM and NeverD translation units on every runner.  The GHA
      # backend is content-addressed, so compiler flags and source changes
      # naturally miss instead of reusing an incompatible object.
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify Unix toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --version
          ninja --version
          "$CC" --version
          ld.lld --version
        env:
          CC: ${{ matrix.cc }}

      - name: Verify Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          where.exe cl
          where.exe clang
          where.exe ld.lld
          where.exe lld-link

      - name: Verify CTest outcome tooling
        shell: bash
        run: '"$PYTHON" scripts/audit_ci_test_results.py check-tool'
        env:
          PYTHON: ${{ matrix.python }}

      - name: Verify Debug and Release target flags
        shell: bash
        run: |
          "$PYTHON" -m unittest \
            scripts.tests.test_debug_build_configuration \
            scripts.tests.test_ci_configuration \
            scripts.tests.test_audit_ci_test_inventory \
            scripts.tests.test_audit_ci_test_results \
            scripts.tests.test_first_fatal_snapshots \
            scripts.tests.test_neverd_bench_harness \
            scripts.tests.test_audit_evm_opcode_metadata \
            scripts.tests.test_eh_signature_generation \
            -v
          "$PYTHON" -m unittest discover \
            -s pluginsdk/python/tests -v
          "$PYTHON" -m unittest \
            scripts.tests.test_check_capabilities \
            scripts.tests.test_check_docs_i18n \
            scripts.tests.test_check_python_plugin_sdk \
            scripts.tests.test_check_source_provenance -v
          "$PYTHON" scripts/check_capabilities.py
          "$PYTHON" scripts/check_python_plugin_sdk.py
          "$PYTHON" scripts/check_source_provenance.py --history-commits 16
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python

      # Ten locales plus the English source is one shared set of files, and
      # which host reads them cannot change the answer, so one leg settles it
      # for all three.  It runs before the configure below because a broken
      # link is worth hearing about in seconds rather than after a build.
      - name: Check the localized documentation matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$PYTHON" scripts/check_docs_i18n.py
        env:
          PYTHON: ${{ matrix.python }}

      # The corpus is a submodule of pinned real binaries, and the configure
      # below turns its tests on unconditionally so that a checkout which did
      # not bring it fails here rather than quietly running without it.  What
      # that costs is a clear message when it is the network and not the code
      # that went wrong.
      - name: Verify the pinned binary corpus
        shell: bash
        run: |
          missing=0
          for line in windows-eh rust-eh go-eh cxx-itanium-eh objc-eh ada-d-eh; do
            manifest="unittests/corpus/manifests/$line.json"
            if [[ ! -f "$manifest" ]]; then
              echo "missing $manifest" >&2
              missing=1
              continue
            fi
            count="$("$PYTHON" -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["artifacts"]))' "$manifest")"
            echo "$line: $count pinned artifacts"
          done
          if [[ "$missing" != 0 ]]; then
            echo "the unittests/corpus submodule did not check out" >&2
            exit 1
          fi
        env:
          PYTHON: ${{ matrix.python }}

      - name: Configure Release build
        shell: bash
        run: |
          PYTHON_EXECUTABLE="$("$PYTHON" -c 'import sys; print(sys.executable)')"
          cmake -E make_directory build-ci/.cmake/api/v1/query
          cmake -E touch build-ci/.cmake/api/v1/query/codemodel-v2
          cmake -E touch build-ci/.cmake/api/v1/query/cmakeFiles-v1
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=ON \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=ON \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=ON \
            -DPython3_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DNEVERD_LLVM_PREBUILT="$NEVERD_LLVM_PREBUILT_MODE"
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          PYTHON: ${{ matrix.python }}

      - name: Build default targets
        id: default_build
        shell: bash
        run: |
          cmake --build build-ci --config Release --parallel "$BUILD_PARALLEL"
          cmake -E touch build-ci/.neverd-capability-build-complete
        env:
          BUILD_PARALLEL: ${{ matrix.parallel }}

      - name: Run and audit mobile native regressions
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          from scripts.audit_ci_test_inventory import TestRecord, parse_inventory
          from scripts.audit_ci_test_results import parse_junit

          expected = tuple(
              TestRecord(name, frozenset(owners))
              for name, *owners in (
                  ("DarwinUnwindSymbols.PromotesAllAliasesAfterSymbolVectorGrowth",
                   "NeverDLanguageEHTests"),
                  ("DarwinUnwindSymbols.ReusesNewSymbolForLaterSameAddressFDE",
                   "NeverDLanguageEHTests"),
                  ("DarwinUnwindSymbols.KeepsNonExecutableRangesWithoutChangingSymbols",
                   "NeverDLanguageEHTests"),
                  ("MachOFunctionListingTest.IgnoresStabsAndPreservesSameAddressAliasesInBothNListLayouts",
                   "NeverDLiftTests"),
                  ("MachOFunctionListingTest.CompactUnwindDoesNotPromoteDuplicateDebugFunctionRecords",
                   "NeverDLiftTests"),
                  ("MachOFunctionListingTest.LoaderClassifiesCodeSymbolsAndMergesExactUnwindSizes",
                   "NeverDLiftTests"),
                  ("MachOFunctionListingTest.FuncsJSONListsOnlyFunctionsWithStableNamesAndExactSizes",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.EmptyStructMetadataUsesAnExplicitContextWithoutAnOrdinaryMethod",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.EmptyStructContextRequiresUniqueNativeLayoutAndItsOwnProof",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.NominalContextAuthorizesOnlyItsBoundMetadataAccessor",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.NominalMetadataRetainsEverySourceDependencyAndRejectsChangedSeeds",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.NominalSourceNamesRejectBothSidesOfTopLevelCollisions",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.ExistingOrdinaryContextAndOverloadRulesDoNotBecomeNominalShells",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructUsesTheActualLocalValueWitnessLayout",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructRejectsNontrivialValueWitnessStorageAndTraits",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructRequiresAnAvailableExactValueWitnessPointer",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructRequiresTheEntireFileBackedValueWitnessTable",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructCannotTreatImportedPayloadsAsLocalTables",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructUsesAnExactStrongStandardRuntimeBinding",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructRejectsInexactStandardRuntimeBindingContracts",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructStandardBindingRequiresReadableExactHeaderSlot",
                   "NeverDLiftTests"),
                  ("SwiftMetadata.EmptyStructStandardBindingConflictsCannotBeResurrected",
                   "NeverDLiftTests"),
                  ("SwiftNominalContextCAPI.OwnedAccessorPublishesTypeWithoutOrdinaryBody",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.NativeOwnershipAndCompletePairRemainRequired",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.IncompleteMetadataCannotSeedNominalSource",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.EmptyFieldsDoNotReplaceValueWitnessLayout",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.OrdinaryMemberCannotBypassEmptyLayoutCheck",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.GlobalCollisionRejectsBothNativeIdentities",
                   "NeverDMetadataJSONTests"),
                  ("MachOChainedPointerBoundary.PreservesHighPositiveLibraryOrdinals",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.SpecialZeroAndOutOfRangeLibraryOrdinalsStayExternal",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.Keeps64BitInlineAddendsUnsigned",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.AddsUnsignedInlineToSignedOutlineWithinInt64Range",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.OverflowingUnsignedInlineDoesNotPublishOrReclassifySlot",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("RuntimeMetadata.DyldBindingsValidateStorageBeforeMutation",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.DyldBindingIdentityConflictsAreSticky",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.CanonicalConflictCannotReviveDyldProvider",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.NativeDylibBytesSurviveDisplayNormalization",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.NativeDylibOrdinalsExcludeLazyAndKeepDuplicates",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.NativeDylibOrdinalsPreserveInvalidNamePlaceholders",
                   "NeverDLiftTests"),
                  ("RuntimeMetadata.MachOTwoLevelNamespaceUsesActualHeaderFlags",
                   "NeverDLiftTests"),
                  ("MachOClassicBindBoundary.RecordsNativeProviderAndWeakness",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOClassicBindBoundary.ProviderConflictsAreStickyAcrossStreams",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOClassicBindBoundary.LazyEntriesResetProviderAndAddend",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.PreservesNativeProviderAndWeakness",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.DuplicateNamesKeepIndependentProviderSlots",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.ProviderConflictsAreStickyAcrossParsers",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.RecordsBindAndFineGrainedRebases",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("MachOChainedPointerBoundary.RejectsMalformedOrdinalNameAndAddendOverflow",
                   "NeverDLiftTests", "NeverDMachOPointerRelocationBoundaryTests"),
                  ("SwiftRuntimeSource.EmptyInitializerProvesNoValueStorageAndRetainsAliases",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeSource.EmptyInitializerRejectsLayoutIdentityAndNativeEffects",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.EmptyInitializerRequiresItsRecoveredNominalAccessor",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeProjection.EmptyInitializerCannotBorrowOrReplaceSourceContext",
                   "NeverDLiftTests"),
                  ("SwiftNominalContextCAPI.OwnedEmptyInitializerKeepsItsIdentityAndTypeProjection",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.OwnedEmptyInitializerRejectsMissingProofAndEffects",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.OwnedEmptyInitializerRetainsOrdinaryAndNamespaceGates",
                   "NeverDMetadataJSONTests"),
                  ("MobileIOSNative.EmptyInitializerCoverageKeepsDeclarationAndTwoIdentities",
                   "NeverDMobileTests"),
                  ("MobileIOSNative.EmptyInitializerCoverageRejectsFalseProjectionContracts",
                   "NeverDMobileTests"),
                  ("SwiftRuntimeSource.MetadataAccessorUsesSemanticNominalIdentity",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeSource.MetadataAccessorRejectsNonmatchingOrUnboundedTrees",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeSource.SemanticMetadataIdentityDoesNotReplaceNativeProof",
                   "NeverDLiftTests"),
                  ("SwiftRuntimeSource.EmptyInitializerUsesSemanticMetadataDependency",
                   "NeverDLiftTests"),
                  ("SwiftNominalContextCAPI.WordSubstitutedAccessorRetainsNativeAndSourceIdentity",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.ExistingAccessorSymbolCannotClaimAnotherSemanticContext",
                   "NeverDMetadataJSONTests"),
                  ("SwiftNominalContextCAPI.WordSubstitutionDoesNotBypassDescriptorResultOrValueWitnesses",
                   "NeverDMetadataJSONTests"),
                  ("SessionCAPITest.NativePhaseTraceRequiresExactEnvironmentValue",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativePhaseTracePreservesLoadFailuresAndExactPairing",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativePhaseTraceDoesNotTraceNullSessions",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativePhaseTracePreservesCompletedNativeLoadsAndReports",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativeMobileObserverSeesRawImageBeforeNormalizedPublication",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativeMobileLoadRejectsBeforeCallingTheObserver",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativeMobileObserverFailurePreservesLoadedAnalysisAndEdits",
                   "NeverDSessionCAPITests"),
                  ("SessionCAPITest.NativeMobileDebugFailureRetainsDecoderAndAllowsReplacement",
                   "NeverDSessionCAPITests"),
                  ("ObjCCallHints.SelectorStubCommandProofDoesNotRequireMethodSignature",
                   "NeverDLiftTests"),
                  ("ObjCCallHints.SelectorStubCommandProofRejectsUnverifiedCodeAndSlots",
                   "NeverDLiftTests"),
                  ("ObjCCallHints.VerifiedSelectorStubDiscardsStaleCallerCommand",
                   "NeverDLiftTests"),
                  ("ObjCCallHints.UnverifiedSelectorStubKeepsObservedCallerCommand",
                   "NeverDLiftTests"),
                  ("PipelineStageTrace.PreservesOwnedNativeResults",
                   "NeverDPipelineOutcomeTests"),
                  ("PipelineStageTrace.RequiresExactEnvironmentValue",
                   "NeverDPipelineOutcomeTests"),
                  ("PipelineStageTrace.KeepsFailuresAndIntermediateReturns",
                   "NeverDPipelineOutcomeTests"),
                  ("PipelineStageTrace.AdmissionDoesNotLimitAnalysis",
                   "NeverDPipelineOutcomeTests"),
                  ("PipelineStageTrace.KeepsLiftBranchAndItsNativeDefinition",
                   "NeverDPipelineOutcomeTests"),
              )
          )
          runner_os = os.environ["RUNNER_OS"]
          expected_count = {
              ("Linux", "linux-semantic"): 85,
              ("macOS", "macos-patch"): 83,
              ("Windows", "windows-focused"): 81,
          }[(runner_os, os.environ["TEST_PROFILE"])]
          if runner_os in ("Linux", "macOS"):
              expected += (TestRecord(
                  "SessionCAPITest.NativePhaseTraceClosedStderrPreservesActualLoadContract",
                  frozenset({"NeverDSessionCAPITests"}),
              ),)
          if runner_os == "Linux":
              expected += (TestRecord(
                  "SessionCAPITest.NativePhaseTraceFullStderrPreservesActualLoadContract",
                  frozenset({"NeverDSessionCAPITests"}),
              ),)
          if runner_os in ("Linux", "macOS"):
              expected += (TestRecord(
                  "PipelineStageTrace.ClosedStderrPreservesNativeResult",
                  frozenset({"NeverDPipelineOutcomeTests"}),
              ),)
          if runner_os == "Linux":
              expected += (TestRecord(
                  "PipelineStageTrace.FullStderrPreservesNativeResult",
                  frozenset({"NeverDPipelineOutcomeTests"}),
              ),)
          if (len(expected) != expected_count or len(set(expected)) != expected_count
                  or len({item.name for item in expected}) != expected_count):
              raise RuntimeError("focused contract has missing or duplicate identities")
          evidence = Path("build-ci/mobile-native-focused").resolve()
          evidence.mkdir()
          errors = []
          statuses = {}

          def write_json(name, value):
              (evidence / name).write_text(
                  json.dumps(value, indent=2) + "\n", encoding="utf-8"
              )

          def identities(records):
              return [
                  {"name": item.name, "labels": sorted(item.labels)}
                  for item in records
              ]

          name_regex = "^(" + "|".join(re.escape(item.name) for item in expected) + ")$"
          # CTest accepts any matching label. Select the owning aggregates;
          # additional labels remain part of each exact expected identity.
          owners = (
              "NeverDLanguageEHTests", "NeverDLiftTests", "NeverDMetadataJSONTests",
              "NeverDMobileTests", "NeverDSessionCAPITests",
              "NeverDPipelineOutcomeTests",
          )
          owner_regex = "^(" + "|".join(re.escape(owner) for owner in owners) + ")$"
          common = [
              "ctest", "--test-dir", "build-ci", "--build-config", "Release",
              "--label-regex", owner_regex,
              "--tests-regex", name_regex,
          ]
          discovery = common + ["--show-only=json-v1"]
          execution = common + [
              "--no-tests=error", "--output-on-failure", "--verbose", "--parallel", "1",
              "--test-output-size-passed", "1048576",
              "--test-output-size-failed", "1048576",
              "--test-output-truncation", "middle",
              "--output-junit", str(evidence / "results.xml"),
              "--output-log", str(evidence / "ctest.log"),
          ]
          write_json("expected.json", identities(expected))
          write_json("commands.json", {
              "head_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "profile": os.environ["TEST_PROFILE"],
              "runner_os": runner_os,
              "cwd": str(Path.cwd()),
              "discovery": discovery,
              "execution": execution,
          })

          def run(name, command, stdout_name):
              status = {"returncode": None}
              try:
                  with (evidence / stdout_name).open("wb") as stdout, \
                       (evidence / (name + ".stderr")).open("wb") as stderr:
                      result = subprocess.run(command, stdout=stdout, stderr=stderr, check=False)
                  status["returncode"] = result.returncode
              except OSError as error:
                  status["error"] = str(error)
              statuses[name] = status
              write_json("exit-status.json", statuses)
              if status["returncode"] != 0:
                  errors.append(f"{name} command failed: {status}")

          run("discovery", discovery, "inventory.json")
          # Still attempt every selected test when discovery reports an error.
          run("execution", execution, "execution.stdout")

          def check_identities(name, records):
              actual = set(records)
              required = set(expected)
              order = lambda item: (item.name, tuple(sorted(item.labels)))
              if len(records) != expected_count or actual != required:
                  errors.append(
                      f"{name} identities differ: count={len(records)}, "
                      f"missing={identities(sorted(required - actual, key=order))}, "
                      f"unexpected={identities(sorted(actual - required, key=order))}"
                  )

          selected = None
          outcomes = None
          gtest_receipts = []
          try:
              selected = parse_inventory(json.loads(
                  (evidence / "inventory.json").read_text(encoding="utf-8")
              ))
              check_identities("discovery", selected)
          except Exception as error:
              errors.append(f"inventory audit failed: {type(error).__name__}: {error}")
          try:
              outcomes = parse_junit(ET.parse(evidence / "results.xml").getroot())
              check_identities("execution", tuple(item.test for item in outcomes))
              for item in outcomes:
                  lines = item.output.splitlines()
                  started = lines.count(f"[ RUN      ] {item.test.name}")
                  passed_pattern = re.escape(f"[       OK ] {item.test.name}") + r"(?: \([0-9]+ ms\))?"
                  passed = sum(re.fullmatch(passed_pattern, line) is not None for line in lines)
                  gtest_receipts.append({
                      "name": item.test.name, "labels": sorted(item.test.labels),
                      "started": started, "passed": passed,
                  })
                  if started != 1 or passed != 1:
                      errors.append(
                          f"{item.test.name} {sorted(item.test.labels)}: "
                          f"expected one actual GTest start and pass, got {started}/{passed}"
                      )
                  if item.outcome != "passed":
                      errors.append(
                          f"{item.test.name} {sorted(item.test.labels)}: "
                          f"{item.outcome}: {item.message}"
                      )
          except Exception as error:
              errors.append(f"JUnit audit failed: {type(error).__name__}: {error}")
          report = {
              "status": "failed" if errors else "passed",
              "expected_count": expected_count,
              "selected_count": None if selected is None else len(selected),
              "reported_count": None if outcomes is None else len(outcomes),
              "passed_count": None if outcomes is None else sum(
                  item.outcome == "passed" for item in outcomes
              ),
              "started_count": sum(item["started"] == 1 for item in gtest_receipts),
              "gtest_passed_count": sum(item["passed"] == 1 for item in gtest_receipts),
              "gtest_receipts": gtest_receipts,
              "selected": None if selected is None else identities(selected),
              "outcomes": None if outcomes is None else [
                  {"name": item.test.name, "labels": sorted(item.test.labels),
                   "outcome": item.outcome, "message": item.message}
                  for item in outcomes
              ],
              "command_statuses": statuses,
              "errors": errors,
          }
          write_json("outcomes.json", report)
          print(json.dumps(report, indent=2))
          raise SystemExit(1 if errors else 0)
          PY
        env:
          PYTHON: ${{ matrix.python }}
          TEST_PROFILE: ${{ matrix.test_profile }}

      - name: Upload mobile native regression evidence
        if: ${{ always() && steps.default_build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-native-focused-${{ matrix.test_profile }}
          path: build-ci/mobile-native-focused/
          if-no-files-found: error

      # The C++ side alone cannot prove agreement with the implementation that
      # validators execute. Build the process-isolated oracle from the exact
      # source object and Cargo.lock named by NeverD's typed provenance table,
      # then make the Linux semantic leg treat every skipped oracle case as a
      # configured, executable differential test.
      - name: Build the pinned Anza SBF oracle
        id: sbf_oracle
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-pinned-revision)"
          toolchain="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-toolchain)"
          oracle_source="$RUNNER_TEMP/neverd-sbpf-oracle-source"
          oracle_binary="$GITHUB_WORKSPACE/build-ci/bin/neverd-sbpf-official-oracle"
          git init "$oracle_source"
          git -C "$oracle_source" remote add origin https://github.com/anza-xyz/sbpf.git
          git -C "$oracle_source" fetch --depth=1 origin "$revision"
          git -C "$oracle_source" checkout --detach FETCH_HEAD
          rustup toolchain install "$toolchain" --profile minimal
          "$PYTHON" scripts/build_sbf_official_oracle.py \
            --sbpf-root "$oracle_source" \
            --output "$oracle_binary" \
            --toolchain "$toolchain"
          {
            echo "NEVERD_SBPF_ROOT=$oracle_source"
            echo "NEVERD_SBPF_ORACLE=$oracle_binary"
            echo "NEVERD_REQUIRE_SBPF_ORACLE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      # The loader corpus is large enough that CI should fetch only its one
      # audited fixture directory.  Both the checkout and the C++ gate derive
      # the object identity from SBFUpstreamSources.def, and the required flag
      # turns a missing, partial, or wrong checkout into a hard failure.
      - name: Fetch the pinned Agave ELF-loader corpus
        id: agave_corpus
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && runner.os == 'Linux' && steps.sbf_oracle.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$("$PYTHON" scripts/build_sbf_official_oracle.py --print-test-vectors-revision)"
          fixture_root="$RUNNER_TEMP/neverd-firedancer-test-vectors"
          git init "$fixture_root"
          git -C "$fixture_root" remote add origin https://github.com/firedancer-io/test-vectors.git
          git -C "$fixture_root" sparse-checkout init --cone
          git -C "$fixture_root" sparse-checkout set elf_loader/fixtures
          git -C "$fixture_root" fetch --depth=1 origin "$revision"
          git -C "$fixture_root" checkout --detach FETCH_HEAD
          test "$(git -C "$fixture_root" rev-parse HEAD)" = "$revision"
          {
            echo "NEVERD_AGAVE_CONFORMANCE_ROOT=$fixture_root"
            echo "NEVERD_AGAVE_CONFORMANCE_REVISION=$revision"
            echo "NEVERD_REQUIRE_AGAVE_CONFORMANCE=1"
          } >> "$GITHUB_ENV"
        env:
          PYTHON: ${{ matrix.python }}

      - name: Run native and Python plugin examples
        id: plugin_examples
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && (runner.os != 'Linux' || (steps.sbf_oracle.outcome == 'success' && steps.agave_corpus.outcome == 'success')) }}
        shell: bash
        run: |
          set -o pipefail
          build-ci/bin/neverd plugins --list --json |
            "$PYTHON" -c 'import json, sys; plugins = json.load(sys.stdin); assert any(plugin.get("name") == "Example Plugin" and plugin.get("kind") == "native" for plugin in plugins), plugins'
          build-ci/bin/neverd plugins --run "Example Plugin"
          build-ci/bin/neverd plugins --run "Semantic Optimizer"
          build-ci/bin/neverd plugins \
            --plugin-dir build-ci/bin/sdk/python/examples \
            --run "Python Semantic Optimizer"
        env:
          PYTHON: ${{ matrix.python }}

      - name: Audit and select test profile
        id: inventory
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && steps.plugin_examples.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build-ci --build-config Release --show-only=json-v1 |
            tee build-ci/ctest-inventory.json |
            "$PYTHON" scripts/audit_ci_test_inventory.py \
              --profile "$TEST_PROFILE" \
              --exclude-label-regex "$EXCLUDE_LABELS" \
              --matrix-name "$MATRIX_NAME"
        env:
          EXCLUDE_LABELS: ${{ matrix.exclude_labels }}
          MATRIX_NAME: ${{ matrix.name }}
          PYTHON: ${{ matrix.python }}
          TEST_PROFILE: ${{ matrix.test_profile }}

      - name: Run selected test profile
        id: ctest
        if: ${{ !cancelled() && steps.default_build.outcome == 'success' && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cmake -E rm -f build-ci/ctest-results.xml \
            build-ci/ctest-exit-status.txt build-ci/ctest-outcomes.json ctest.log
          set +e
          ctest --test-dir build-ci \
            --build-config Release \
            --label-exclude "$EXCLUDE_LABELS" \
            --output-junit "$PWD/build-ci/ctest-results.xml" \
            --output-log "$PWD/ctest.log" \
            --no-tests=error \
            --stop-on-failure \
            --output-on-failure \
            --progress \
            --parallel "$TEST_PARALLEL"
          ctest_status="$?"
          set -e
          printf '%s\n' "$ctest_status" > build-ci/ctest-exit-status.txt
          exit "$ctest_status"
        env:
          EXCLUDE_LABELS: ${{ steps.inventory.outputs.label_exclude }}
          TEST_PARALLEL: ${{ matrix.parallel }}

      - name: Audit selected test outcomes
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" scripts/audit_ci_test_results.py audit \
            --inventory build-ci/ctest-inventory.json \
            --junit build-ci/ctest-results.xml \
            --ctest-status build-ci/ctest-exit-status.txt \
            --profile "$TEST_PROFILE" \
            --exclude-label-regex "$EXCLUDE_LABELS" \
            --matrix-name "$MATRIX_NAME" \
            --output build-ci/ctest-outcomes.json
        env:
          EXCLUDE_LABELS: ${{ steps.inventory.outputs.label_exclude }}
          TEST_PROFILE: ${{ matrix.test_profile }}
          MATRIX_NAME: ${{ matrix.name }}
          PYTHON: ${{ matrix.python }}

      - name: Upload CTest execution evidence
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctest-evidence-${{ matrix.test_profile }}
          path: |
            build-ci/ctest-inventory.json
            build-ci/ctest-results.xml
            build-ci/ctest-exit-status.txt
            build-ci/ctest-outcomes.json
            ctest.log
          if-no-files-found: error

      - name: Capture the existing first-fatal semantic failures
        id: first_fatal_snapshot
        timeout-minutes: 30
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        shell: bash
        run: |
          "$PYTHON" scripts/collect_first_fatal_snapshots.py \
            --build-dir build-ci \
            --inventory build-ci/ctest-inventory.json \
            --output-dir build-ci/first-fatal-snapshots
        env:
          PYTHON: ${{ matrix.python }}

      - name: Upload first-fatal semantic evidence
        if: ${{ always() && steps.inventory.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-fatal-snapshots-${{ matrix.test_profile }}
          path: build-ci/first-fatal-snapshots
          if-no-files-found: error

      - name: Audit configured and executable capability evidence
        shell: bash
        run: |
          "$PYTHON" scripts/check_capabilities.py \
            --build-dir build-ci --build-config Release \
            --ctest-inventory build-ci/ctest-inventory.json
        env:
          PYTHON: ${{ matrix.python }}

      # The CLI, the typed C entry point and the JSON one are three surfaces
      # over one implementation, and nothing that tests any of them alone would
      # notice them drifting apart.  This needs the built tool and library, so
      # it runs here rather than with the source checks.
      - name: Check the simplifier's surfaces agree
        shell: bash
        run: |
          "$PYTHON" -m unittest scripts.tests.test_simplify_surfaces -v
        env:
          NEVERD_BUILD_DIR: build-ci
          PYTHON: ${{ matrix.python }}
          PYTHONPATH: pluginsdk/python
