name: Native SHA-256 qualification

on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: 'Optional full NeverD commit SHA for a same-build native comparison'
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/digest.yml'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'include/neverd/support/SHA256.h'
      - 'include/neverd/support/LoadProgress.h'
      - 'lib/support/SHA256*'
      - 'unittests/digest/**'
      - 'unittests/lift/format/InputDigestTests.cpp'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/digest.yml'
      - 'cmake/NeverDGoogleTest.cmake'
      - 'include/neverd/support/SHA256.h'
      - 'include/neverd/support/LoadProgress.h'
      - 'lib/support/SHA256*'
      - 'unittests/digest/**'
      - 'unittests/lift/format/InputDigestTests.cpp'

permissions:
  contents: read

concurrency:
  group: digest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux ARM64 Clang, runner: ubuntu-24.04-arm, arch: arm64, cc: clang, cxx: clang++}
          - {name: Linux ARM64 GCC, runner: ubuntu-24.04-arm, arch: arm64, cc: gcc, cxx: g++}
          - {name: Linux x86-64 Clang, runner: ubuntu-24.04, arch: x64, cc: clang, cxx: clang++}
          - {name: Linux x86-64 GCC, runner: ubuntu-24.04, arch: x64, cc: gcc, cxx: g++}
          - {name: macOS ARM64, runner: macos-15, arch: arm64, cc: clang, cxx: clang++}
          - {name: macOS x86-64, runner: macos-15-intel, arch: x64, cc: clang, cxx: clang++}
          - {name: Windows ARM64 MSVC, runner: windows-11-arm, arch: arm64, cc: cl, cxx: cl}
          - {name: Windows ARM64 clang-cl, runner: windows-11-arm, arch: arm64, cc: clang-cl, cxx: clang-cl}
          - {name: Windows x86-64 MSVC, runner: windows-2025, arch: x64, cc: cl, cxx: cl}
          - {name: Windows x86-64 clang-cl, runner: windows-2025, arch: x64, cc: clang-cl, cxx: clang-cl}
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      DIGEST_ARCH: ${{ matrix.arch }}
      BASELINE_COMMIT: ${{ inputs.baseline_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Initialize recorded LLVM fork
        run: git submodule update --init --depth 1 third_party/llvm-project
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake ninja-build
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Install Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.arch }}
      - name: Export the requested baseline owner and headers
        if: inputs.baseline_commit != ''
        run: |
          set -euo pipefail
          [[ "$BASELINE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          git fetch --no-tags --depth 1 origin "$BASELINE_COMMIT"
          mkdir -p build-digest/baseline
          git archive "$BASELINE_COMMIT" include lib/support/SHA256.cpp lib/support/SHA256.def lib/support/SHA256Internal.h | tar -x -C build-digest/baseline
          git rev-parse "$BASELINE_COMMIT^{commit}" > build-digest/baseline-source.txt
      - name: Build exact native owners and portable controls
        run: |
          set -euo pipefail
          options=(-DCMAKE_BUILD_TYPE=Release)
          if [ "$DIGEST_ARCH" = arm64 ]; then
            options+=(-DNEVERD_DIGEST_REQUIRE_ARM64=ON)
          else
            options+=(-DNEVERD_DIGEST_REQUIRE_X86_64=ON)
          fi
          targets=(NeverDDigestTests NeverDPortableDigestTests NeverDDigestTestsBench NeverDPortableDigestTestsBench)
          if [ -n "${BASELINE_COMMIT:-}" ]; then
            options+=(-DNEVERD_DIGEST_BASELINE_ROOT="$PWD/build-digest/baseline")
            targets+=(NeverDBaselineDigestTests NeverDBaselineDigestTestsBench)
          fi
          if [ "$CXX" = clang-cl ]; then
            compiler_target=aarch64-pc-windows-msvc
            if [ "$DIGEST_ARCH" = x64 ]; then compiler_target=x86_64-pc-windows-msvc; fi
            options+=(-DCMAKE_C_COMPILER_TARGET="$compiler_target"
                      -DCMAKE_CXX_COMPILER_TARGET="$compiler_target")
          fi
          cmake -S unittests/digest -B build-digest -G Ninja "${options[@]}"
          python scripts/build.py build-digest --target "${targets[@]}" --parallel 3
          git rev-parse HEAD > build-digest/source.txt
          git submodule status third_party/llvm-project > build-digest/llvm-source.txt
      - name: Verify identity, actual dispatch, guarded reads and cancellation
        run: |
          set -euo pipefail
          if [ "$DIGEST_ARCH" = arm64 ]; then
            export NEVERD_TEST_SHA256_HARDWARE=1
          else
            unset NEVERD_TEST_SHA256_HARDWARE
          fi
          ctest --test-dir build-digest --output-on-failure --no-tests=error --output-junit tests.xml
          python - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('build-digest/tests.xml').getroot().iter('testcase'))
          expected = 26 if os.environ.get('BASELINE_COMMIT') else 18
          assert len(cases) == expected, len(cases)
          assert all(case.get('status') == 'run' for case in cases)
          assert not any(child.tag in {'failure', 'error', 'skipped'} for case in cases for child in case)
          PYTHON
      - name: Measure after all builds and tests finish
        run: |
          set -euo pipefail
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          measure() {
            if [ "$DIGEST_ARCH" = arm64 ]; then
              python unittests/digest/benchmark.py "$@" --require-hardware
            else
              python unittests/digest/benchmark.py "$@"
            fi
          }
          measure "build-digest/bin/NeverDDigestTestsBench$suffix" "build-digest/bin/NeverDPortableDigestTestsBench$suffix" build-digest/timings.json
          if [ -n "${BASELINE_COMMIT:-}" ]; then
            measure "build-digest/bin/NeverDDigestTestsBench$suffix" "build-digest/bin/NeverDBaselineDigestTestsBench$suffix" build-digest/baseline-timings.json --baseline
          fi
      - name: Retain native qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}-${{ github.sha }}
          path: |
            build-digest/tests.xml
            build-digest/timings.json
            build-digest/baseline-timings.json
            build-digest/baseline-source.txt
            build-digest/source.txt
            build-digest/llvm-source.txt
            build-digest/CMakeCache.txt
            build-digest/compile_commands.json
            build-digest/neverd-*.json
            build-digest/Testing/Temporary/LastTest.log
          if-no-files-found: error
