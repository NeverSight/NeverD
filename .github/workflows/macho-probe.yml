name: Mach-O patch probe
on:
  push:
    branches: [ci/macho-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: 'v0.16.0'
      - name: Install tools
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Build neverd
        shell: bash
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DBUILD_TESTING=ON -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF -DNEVERD_LLVM_PREBUILT=ON
          cmake --build build-ci --parallel 3 --target neverd NeverDPatchFullTests NeverDNativeExceptionRewriteContractTests NeverDSafetyPatchCAPITests
      - name: Reproduce
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          mkdir probe && cd probe
          ND=../build-ci/bin/neverd
          cat > m.c <<'SRC'
          #include <stdio.h>
          int main(void) {
            const char *w = "world";
            const char *a = "alpha", *b = "beta", *c = "gamma";
            puts("hello via puts");
            printf("hi %s!\n", w);
            printf("%s %s %s\n", a, b, c);
            return 77;
          }
          SRC
          cat > anchor.s <<'SRC'
          .section __TEXT,__text,regular,pure_instructions
          .private_extern _neverd_test_eh_frame_anchor
          .no_dead_strip _neverd_test_eh_frame_anchor
          .p2align 2
          _neverd_test_eh_frame_anchor:
          .cfi_startproc
          sub sp, sp, #16
          .cfi_def_cfa_offset 16
          str x19, [sp]
          .cfi_offset x19, -16
          ldr x19, [sp]
          add sp, sp, #16
          ret
          .cfi_endproc
          .subsections_via_symbols
          SRC
          clang -O0 -fno-stack-protector -Wl,-no_compact_unwind -o m m.c anchor.s
          ./m; echo "native rc=$?"
          "$ND" patch m -o m.patched 2>&1 | tail -3
          echo "patch rc=${PIPESTATUS[0]}"
          ./m.patched; echo "patched rc=$?"
          echo "--- load commands"; otool -l m.patched | grep -E "^ *cmd |segname|vmaddr|fileoff|filesize|sectname|dataoff|datasize" | head -90
          echo "--- codesign"; codesign -dvv m.patched 2>&1 | head -12
          echo "--- fixups"; dyld_info -fixups m.patched 2>&1 | head -24
          echo "--- entry"; otool -tv m.patched | head -24
          echo "--- segment"; otool -s __NDTEXT __text -v m.patched 2>&1 | head -6
          echo "--- lldb"
          lldb -b -o run -o 'bt 6' -o 'register read pc lr sp x16 x17 x0' -o 'disassemble -s $pc-24 -c 14' -o 'image list' -- ./m.patched 2>&1 | tail -60
          echo "--- inplace"
          "$ND" patch m --mode inplace -o m.inplace 2>&1 | tail -2
          ./m.inplace; echo "inplace rc=$?"
          lldb -b -o run -o 'bt 6' -o 'register read pc lr x16' -o 'disassemble -s $pc-16 -c 10' -- ./m.inplace 2>&1 | tail -32
          ls -la
      - name: Tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cd build-ci
          ctest --output-on-failure --timeout 300 --parallel 3 -R '_HostE2E|NeverDSafetyPatchCAPI|MachOPatchSegmentInstall' 2>&1 | tail -220
      - name: Retain the images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macho-probe
          path: probe/
