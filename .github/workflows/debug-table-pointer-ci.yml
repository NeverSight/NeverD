name: Debug table-pointer CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-build-and-test:
    name: Focused build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            artifact: linux-x64
            runner: ubuntu-24.04
            cc: clang
            cxx: clang++
            parallel: 4
            python: python3
          - name: macOS arm64
            artifact: macos-arm64
            runner: macos-15
            cc: clang
            cxx: clang++
            parallel: 3
            python: python3
          - name: Windows x64
            artifact: windows-x64
            runner: windows-latest
            cc: cl
            cxx: cl
            parallel: 4
            python: python

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install cmake lld ninja
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Enable the MSVC x64 toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure integrated LLVM Release build
        shell: bash
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DNEVERD_LLVM_PREBUILT=OFF
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Build focused test binaries
        shell: bash
        run: cmake --build build-ci --config Release --target neverd NeverDLiftTests --parallel "$BUILD_PARALLEL"
        env:
          BUILD_PARALLEL: ${{ matrix.parallel }}

      - name: Run table-pointer regressions
        shell: bash
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export NEVERD="$PWD/build-ci/bin/neverd${suffix}"
          set -o pipefail
          "build-ci/bin/NeverDLiftTests${suffix}" \
            --gtest_filter='MachOLLVMDataPointerBoundary.*:X86_64_SwitchTest.PatchELFExecutable:X86_64_PipelineE2E.PatchMachO_Switch:ARM32_SwitchTest.LLVMIRUnoptProduced:ARM32_SwitchTest.LLVMIRUnoptNoVerifierErrors:MachOI386Relocation.DispatchUsesRelinkablePointerToRecompiledZeroAddressFunction:JTE_X86_64.ComputedGotoAllStagesSucceed:JTE_X86_64.ComputedGotoNoVerifierErrors:JTE_X86_64.ComputedGotoRecoversDispatch:ThinObjects/MachOI386Pipeline.CompletesLiftAndDecompilation/PIC' \
            --gtest_output=xml:focused-tests.xml 2>&1 | tee focused-tests.log

      - name: Upload focused binaries and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: table-pointer-${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            build-ci/bin/neverd*
            build-ci/bin/NeverDLiftTests*
            build-ci/bin/libneverd*
            focused-tests.log
            focused-tests.xml
