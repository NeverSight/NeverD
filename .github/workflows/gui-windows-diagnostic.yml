name: Temporary Windows GUI diagnostic

on:
  push:
    branches: [codex/nov03-windows-gui-ci-followup]
    paths:
      - '.github/workflows/gui-windows-diagnostic.yml'
      - 'tools/neverd-gui/tests/AppearanceTests.cpp'
      - 'tools/neverd-gui/tests/DockingTests.cpp'
      - 'tools/neverd-gui/app/platform/WindowFrameWindows.cpp'

permissions:
  contents: read

concurrency:
  group: gui-windows-diagnostic
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install the affected Qt version
        run: |
          python -m pip install aqtinstall==3.3.0 ninja==1.11.1.3
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" >> "$GITHUB_PATH"
      - name: Build fixture and affected GUI owners
        run: |
          cmake -S tools/neverd-gui/tests/mock-sdk -B build-fixture -G Ninja -DCMAKE_BUILD_TYPE=Release
          python scripts/build.py build-fixture --parallel 3
          cmake -S tools/neverd-gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.8.3/msvc2022_64" \
            -DNEVERD_ENGINE_LIBRARY="$GITHUB_WORKSPACE/build-fixture/bin/neverd_fixture.dll" \
            -DNEVERD_ENGINE_IMPLIB="$GITHUB_WORKSPACE/build-fixture/bin/neverd_fixture.lib" \
            -DNEVERD_WORKER_REAL_ENGINE_TESTS=OFF
          python scripts/build.py build-gui --target neverd-gui-docking-tests neverd-gui-appearance-tests neverd-gui-unit-tests --parallel 3
          cp build-fixture/bin/neverd_fixture.dll build-gui/bin/
      - name: Inspect native input and fractional-scale composition
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          output = Path('windows-gui-evidence')
          output.mkdir()
          cases = [('docking-100', 'neverd-gui-docking-tests', [], '1'),
                   ('appearance-100', 'neverd-gui-appearance-tests', [], '1'),
                   ('appearance-150', 'neverd-gui-appearance-tests', [], '1.5'),
                   ('native-frame', 'neverd-gui-unit-tests', ['nativeFrameKeepsTheTitleBarOnScreen'], '1')]
          records = []
          for name, binary, selection, scale in cases:
              captures = output / name
              captures.mkdir()
              log = output / (name + '.txt')
              command = ['build-gui/bin/' + binary + '.exe', *selection, '-o', str(log) + ',txt']
              record = {'name': name, 'command': command, 'scale': scale}
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=300,
                                          env={**os.environ, 'QT_SCALE_FACTOR': scale,
                                               'NEVERD_APPEARANCE_CAPTURES': str(captures)})
                  record['returncode'] = result.returncode
                  (output / (name + '-stderr.txt')).write_text(result.stderr)
                  print(log.read_text() if log.exists() else 'No QtTest log')
              except subprocess.TimeoutExpired:
                  record['returncode'] = 124
              records.append(record)
              (output / 'summary.json').write_text(json.dumps(records, indent=2))
          raise SystemExit(0 if all(record['returncode'] == 0 for record in records) else 1)
          PY
      - name: Retain bounded native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-gui-${{ github.sha }}
          path: |
            windows-gui-evidence/
            build-gui/CMakeCache.txt
          retention-days: 7
