name: Debug Linux runtime pointer regressions

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'NeverD commit to build (empty uses the dispatched ref)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux-reproducer:
    name: Linux x64 pointer reproducers
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake lld ninja-build

      - name: Configure integrated-LLVM Release build
        shell: bash
        run: |
          python_executable="$(python3 -c 'import sys; print(sys.executable)')"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DPython3_EXECUTABLE="$python_executable" \
            -DNEVERD_LLVM_PREBUILT=OFF

      - name: Build semantic test binary
        shell: bash
        run: >-
          cmake --build build-ci --config Release
          --target NeverDSemanticTests --parallel 4

      - name: Run exact single-thread and default reproducers
        id: repro
        shell: bash
        run: |
          artifact_dir="linux-runtime-pointer-artifact"
          mkdir -p "$artifact_dir"
          cp build-ci/bin/NeverDSemanticTests "$artifact_dir/"
          cp build-ci/bin/libneverd.so "$artifact_dir/"
          clang --version > "$artifact_dir/clang-version.txt"
          cmake --version > "$artifact_dir/cmake-version.txt"
          ldd build-ci/bin/NeverDSemanticTests > "$artifact_dir/ldd.txt"
          (
            cd "$artifact_dir"
            sha256sum NeverDSemanticTests libneverd.so > sha256.txt
          )

          filter='OptStress269/X86OptStress269RT.Verify/x86o269_swmiddef:OptStress337/X86OptStress337RT.Verify/x86o337_twozz:OptStress82/ARM32OptStress82RT.Verify/armo82_structval'
          set +e
          NEVERD_THREADS=1 build-ci/bin/NeverDSemanticTests \
            --gtest_filter="$filter" --gtest_repeat=10 \
            2>&1 | tee "$artifact_dir/single-thread.log"
          single_status="${PIPESTATUS[0]}"
          build-ci/bin/NeverDSemanticTests \
            --gtest_filter="$filter" --gtest_repeat=10 \
            2>&1 | tee "$artifact_dir/default-threads.log"
          default_status="${PIPESTATUS[0]}"
          set -e

          echo "$single_status" > "$artifact_dir/single-thread.status"
          echo "$default_status" > "$artifact_dir/default-threads.status"
          if [[ "$single_status" != 0 || "$default_status" != 0 ]]; then
            echo 'status=1' >> "$GITHUB_OUTPUT"
          else
            echo 'status=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Package Linux reproducers
        if: always() && steps.repro.outputs.status != ''
        shell: bash
        run: tar -C linux-runtime-pointer-artifact -czf linux-runtime-pointer-artifact.tar.gz .

      - name: Upload Linux reproducers
        if: always() && steps.repro.outputs.status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-runtime-pointer-artifact
          path: linux-runtime-pointer-artifact.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Propagate Linux result
        if: always() && steps.repro.outputs.status != ''
        shell: bash
        run: exit "${{ steps.repro.outputs.status }}"
