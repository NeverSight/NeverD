name: Mobile SDK Export Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exports:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      CONSUMER_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify collector evidence retention
        run: python -m unittest scripts.tests.test_mobile_ios_sdk_declarations
      - name: Collect exact framework linker maps from both SDKs
        run: |
          test -d "$DEVELOPER_DIR"
          python scripts/collect_mobile_ios_sdk_declarations.py \
            --sdk-version 26.5 --exports-only \
            --output "$RUNNER_TEMP/ios-sdk-exports"
      - name: Preserve SDK export evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-ios-sdk-exports
          path: ${{ runner.temp }}/ios-sdk-exports
          if-no-files-found: error
          retention-days: 7
