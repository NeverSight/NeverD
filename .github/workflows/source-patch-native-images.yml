name: Source patch native process images

# A quick OS-unwinder qualification of source-authenticated current-engine
# outputs. The ordinary source-patch-windows workflow also rebuilds the engine.
on:
  workflow_dispatch:
  push:
    branches: [codex/native-source-patching]
    paths:
      - '.github/workflows/source-patch-native-images.yml'
      - 'scripts/check_source_patch_snapshot_runtime.py'
      - 'unittests/Inputs/source-patch/native-processes/**'

permissions:
  contents: read

jobs:
  native-processes:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            system: windows
            arch: x64
          - os: windows-11-arm
            system: windows
            arch: arm64
          - os: ubuntu-24.04
            system: linux
            arch: x64
          - os: ubuntu-24.04-arm
            system: linux
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Execute current-engine C and Clang C++ process images
        run: python scripts/check_source_patch_snapshot_runtime.py --system '${{ matrix.system }}' --arch '${{ matrix.arch }}' --output build-native-images

      - name: Preserve native receipts and process observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-patch-native-${{ matrix.system }}-${{ matrix.arch }}-${{ github.sha }}
          path: build-native-images
          if-no-files-found: error
