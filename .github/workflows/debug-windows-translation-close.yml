name: Debug Windows translation close

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce translation close failures
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --yes --no-progress

      - name: Enable the MSVC x64 toolchain
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure focused Release build
        shell: bash
        run: |
          cmake --version
          ninja --version
          where.exe cl
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DBUILD_TESTING=ON \
            -DNEVERD_BUILD_PLUGINS=OFF \
            -DNEVERD_ENABLE_PYTHON_PLUGINS=OFF \
            -DNEVERD_ENABLE_BINARY_CORPUS_TESTS=OFF \
            -DNEVERD_LLVM_PREBUILT=ON

      - name: Build owning test binary
        shell: bash
        run: >-
          cmake --build build-ci --config Release
          --target NeverDTranslationContractTests --parallel 4

      - name: Run exact close-failure tests
        id: close_tests
        continue-on-error: true
        shell: bash
        env:
          NEVERD_THREADS: '1'
        run: |
          set -o pipefail
          build-ci/bin/NeverDTranslationContractTests.exe \
            --gtest_filter='TranslationCLIContract.DiscardCloseFailureStillRemovesAndForgetsTheTemporary:TranslationCLIContract.CommitCloseFailureReportsContextAndPreservesTheOldOutput' \
            --gtest_repeat=3 2>&1 | tee translation-close.log

      - name: Upload reproducer and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-translation-close-reproducer
          path: |
            build-ci/bin/NeverDTranslationContractTests.exe
            build-ci/bin/*.dll
            build-ci/Testing/Temporary/*.log
            translation-close.log
          if-no-files-found: warn
          retention-days: 3

      - name: Report reproducer result
        if: steps.close_tests.outcome == 'failure'
        shell: bash
        run: exit 1
